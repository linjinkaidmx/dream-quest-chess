/* ---------------- Editor：关卡编辑器 ----------------
   一张网格 + 一排画笔。左边画图，右边实时告诉你"这关能不能玩"，
   画完一键试玩 / 生成分享码。自定义关不进主线存档与难度统计。 */
const ED_BRUSH={block:'障碍',erase:'橡皮',startP:'我方起点',startA:'对手起点',
  goal:'我方目标',aiGoal:'对手目标',portal:'传送门',boost:'加速带',spring:'弹簧',trap:'陷阱',pickup:'拆墙器'};
function edRow(r,w){ const a=[]; for(let c=0;c<w;c++) a.push({r,c}); return a; }
function edCenter(w,minN){
  const c0=Math.max(0,Math.floor((w-minN)/2));
  return [c0,c0+1];
}
function freshEditor(w,h,mode){
  const ed={w:w||9,h:h||9,mode:mode||'race',aiTier:1,blocked:new Set(),preWalls:[],specials:[],
    startP:{r:(h||9)-1,c:1},startA:{r:0,c:(w||9)-2},goalCells:[],aiGoalCells:[],portalFirst:null};
  edModeDefaults(ed);
  return ed;
}
/* 玩法/尺寸一变，起点与目标按新玩法重新摆（自定义部分保留） */
function edModeDefaults(ed){
  const W=ed.w,H=ed.h;
  if(ed.mode==='race'){ ed.goalCells=edRow(0,W); ed.aiGoalCells=edRow(H-1,W); ed.startP={r:H-1,c:1}; ed.startA={r:0,c:W-2}; }
  else if(ed.mode==='gate'){
    const cc=edCenter(W,2);
    ed.goalCells=cc.map(c=>({r:0,c})); ed.aiGoalCells=cc.map(c=>({r:H-1,c}));
    ed.startP={r:H-1,c:1}; ed.startA={r:0,c:W-2};
  }
  else if(ed.mode==='sameSide'){
    ed.goalCells=edRow(0,W); ed.aiGoalCells=edRow(0,W);
    ed.startP={r:H-1,c:Math.max(1,Math.floor(W/2)-2)}; ed.startA={r:H-1,c:Math.min(W-2,Math.floor(W/2)+2)};
  }
  else if(ed.mode==='sharedGate'){
    const cc=edCenter(W,2);
    ed.goalCells=cc.map(c=>({r:0,c})); ed.aiGoalCells=cc.map(c=>({r:0,c}));
    ed.startP={r:H-1,c:1}; ed.startA={r:H-1,c:W-2};
  }
  else if(ed.mode==='chase'){                       /* 追逐：怪物没有终点，守在右侧中路 */
    ed.goalCells=edRow(0,W); ed.aiGoalCells=[];
    ed.startP={r:H-1,c:1}; ed.startA={r:Math.floor(H/2),c:W-2};
  }
  ed.specials=ed.specials.filter(s=>s.r<H&&s.c<W&&!edOnGoal(ed,s));
  ed.portalFirst=null;
}
function edOnGoal(ed,cell){ return ed.goalCells.concat(ed.aiGoalCells).some(g=>g.r===cell.r&&g.c===cell.c); }
function edCellKind(ed,r,c){
  if(ed.startP&&ed.startP.r===r&&ed.startP.c===c) return 'startP';
  if(ed.startA&&ed.startA.r===r&&ed.startA.c===c) return 'startA';
  const sp=ed.specials.find(s=>s.r===r&&s.c===c);
  if(sp) return sp.kind==='portal'?('portal'+(sp.tag||'A')):sp.kind;
  if(ed.blocked.has(r+':'+c)) return 'block';
  if(ed.aiGoalCells.some(g=>g.r===r&&g.c===c)) return 'aiGoal';
  if(ed.goalCells.some(g=>g.r===r&&g.c===c)) return 'goal';
  return 'empty';
}
/* 编辑状态 → 可玩关卡对象（与内置关卡同构） */
function edToLevel(ed){
  return makeCustomLevel({
    mode:ed.mode,W:ed.w,H:ed.h,aiTier:ed.aiTier,
    start:ed.startP,aiStart:ed.startA,
    goalCells:ed.goalCells,aiGoalCells:ed.aiGoalCells,
    blockedCells:Array.from(ed.blocked).map(k=>{const [r,c]=k.split(':').map(Number); return {r,c};}),
    preWalls:ed.preWalls,
    specialCells:ed.specials.map(s=>({r:s.r,c:s.c,kind:s.kind,to:s.to})),
  });
}
/* 实时体检：把"不能玩"的原因说清楚，而不是只给个红叉 */
function edIssues(ed){
  const out=[];
  if(!ed.startP) out.push('还没放我方起点');
  if(!ed.startA) out.push(ed.mode==='chase'?'还没放怪物的位置':'还没放对手起点');
  if(!ed.goalCells.length) out.push('还没给我方设目标');
  if(ed.mode!=='chase'&&!ed.aiGoalCells.length) out.push('还没给对手设目标');
  const portals=ed.specials.filter(s=>s.kind==='portal');
  if(portals.length===1) out.push('传送门要成对（再点一格）');
  if(out.length) return out;
  const lv=edToLevel(ed);
  if(!lv) return ['无法生成关卡'];
  const g=makeGame(lv);
  for(const w of lv.preWalls){ const k=K(w.kind,w.r,w.c); }
  if(isBlockedCell(g,lv.startPosition.r,lv.startPosition.c)) out.push('我方起点压在障碍上');
  else if(isBlockedCell(g,lv.aiStartPosition.r,lv.aiStartPosition.c)) out.push('对手起点压在障碍上');
  else if(!bothOk(g)) out.push(ed.mode==='chase'?'怪物追不到你（墙/障碍把路堵死了）':'有一方到不了目标（墙/障碍把路堵死了）');
  return out;
}
function edSaved(){
  try{ return JSON.parse(localStorage.getItem('dreamquest.mine.v1')||'[]'); }catch(e){ return []; }
}
function edSave(code){
  const list=edSaved().filter(x=>x.code!==code);
  list.unshift({code,at:Date.now()});
  try{ localStorage.setItem('dreamquest.mine.v1',JSON.stringify(list.slice(0,20))); }catch(e){}
}
function Editor(root){
  const page=html('div','page'); root.appendChild(page);
  const head=html('div','page-head');
  head.innerHTML='<h1>造一关</h1><p class="sub">左边画图，右边实时体检；画完可以自己试玩，也能把码发给朋友。</p>';
  page.appendChild(head);
  const ed=editorState||(editorState=freshEditor());
  let brush='block';
  const wrap=html('div','ed-wrap');
  page.appendChild(wrap);

  /* ---- 顶部：尺寸 / 玩法 / 对手档 ---- */
  const bar=html('div','ed-bar');
  const sel=(label,opts,val,onChange)=>{
    const box=html('label','ed-field');
    box.appendChild(document.createTextNode(label));
    const s=html('select');
    opts.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(String(v)===String(val)) o.selected=true; s.appendChild(o); });
    s.onchange=()=>onChange(s.value);
    box.appendChild(s); return box;
  };
  bar.appendChild(sel('棋盘',[[7,'7×7'],9,11,13].map(x=>[x,x+'×'+x]).slice(0,1).concat([[9,'9×9'],[11,'11×11'],[13,'13×11']]),ed.w, v=>{
    const w=+v, h=(w===13?11:w);
    editorState=freshEditor(w,h,ed.mode); reroute('#/edit');
  }));
  bar.appendChild(sel('玩法',[['race','相向竞速'],['gate','门关'],['sameSide','同向竞速'],['sharedGate','共同终点'],['chase','追逐']],ed.mode, v=>{
    ed.mode=v; edModeDefaults(ed); render();
  }));
  bar.appendChild(sel('对手',[[0,'轻松'],[1,'普通'],[2,'困难'],[3,'拉满']],ed.aiTier, v=>{ ed.aiTier=+v; render(); }));
  wrap.appendChild(bar);

  /* ---- 画笔 ---- */
  const tools=html('div','ed-tools');
  Object.keys(ED_BRUSH).forEach(k=>{
    const b=html('button','ed-tool'+(k===brush?' on':''),ED_BRUSH[k]);
    b.dataset.brush=k;
    b.onclick=()=>{ brush=k; render(); };
    tools.appendChild(b);
  });
  wrap.appendChild(tools);

  /* ---- 网格 ---- */
  const gridBox=html('div','ed-gridbox');
  const grid=html('div','ed-grid');
  grid.style.gridTemplateColumns='repeat('+ed.w+',minmax(0,1fr))';
  gridBox.appendChild(grid);
  wrap.appendChild(gridBox);
  let painting=false;
  const paintCell=(r,c)=>{
    const key=r+':'+c;
    if(brush==='erase'){
      ed.blocked.delete(key);
      ed.specials=ed.specials.filter(s=>!(s.r===r&&s.c===c));
      if(ed.portalFirst&&ed.portalFirst.r===r&&ed.portalFirst.c===c) ed.portalFirst=null;
    } else if(brush==='block'){
      if(edOnGoal(ed,{r,c})||(ed.startP&&ed.startP.r===r&&ed.startP.c===c)||(ed.startA&&ed.startA.r===r&&ed.startA.c===c)) return;
      ed.blocked.add(key);
      ed.specials=ed.specials.filter(s=>!(s.r===r&&s.c===c));
    } else if(brush==='startP'||brush==='startA'){
      ed[brush]={r,c};
      ed.blocked.delete(key);
    } else if(brush==='goal'||brush==='aiGoal'){
      const isGoal=ed.goalCells.some(g=>g.r===r&&g.c===c);
      if(brush==='goal'){
        ed.goalCells=isGoal?ed.goalCells.filter(g=>!(g.r===r&&g.c===c)):ed.goalCells.concat([{r,c}]);
      } else {
        ed.aiGoalCells=isGoal?ed.aiGoalCells.filter(g=>!(g.r===r&&g.c===c)):ed.aiGoalCells.concat([{r,c}]);
      }
      if(!isGoal) ed.blocked.delete(key);
    } else {
      /* 机关：同类只留一个；传送门点两格成对 */
      ed.specials=ed.specials.filter(s=>!(s.r===r&&s.c===c));
      if(brush==='portal'){
        if(!ed.portalFirst){ ed.portalFirst={r,c}; ed.specials.push({r,c,kind:'portal',tag:'A'}); }
        else {
          const a=ed.portalFirst;
          if(a.r===r&&a.c===c){ ed.portalFirst=null; ed.specials=ed.specials.filter(s=>!(s.r===r&&s.c===c)); }
          else {
            ed.specials=ed.specials.filter(s=>!(s.r===a.r&&s.c===a.c)).concat([
              {r:a.r,c:a.c,kind:'portal',tag:'A',to:{r,c}},
              {r,c,kind:'portal',tag:'B',to:{r:a.r,c:a.c}},
            ]);
            ed.portalFirst=null;
          }
        }
      } else ed.specials.push({r,c,kind:brush});
      ed.blocked.delete(key);
    }
    render();
  };
  function render(){
    grid.innerHTML='';
    for(let r=0;r<ed.h;r++)for(let c=0;c<ed.w;c++){
      const k=edCellKind(ed,r,c);
      const cell=html('button','ed-cell k-'+k);
      cell.dataset.r=r; cell.dataset.c=c;
      if(k==='portalA'||k==='portalB') cell.textContent=k==='portalA'?'A':'B';
      else if(k==='goal') cell.textContent='终';
      else if(k==='aiGoal') cell.textContent='目';
      else if(k==='startP'||k==='startA') cell.textContent=k==='startP'?'我':'敌';
      cell.onpointerdown=e=>{ e.preventDefault(); painting=true; paintCell(r,c); };
      cell.onpointerenter=()=>{ if(painting) paintCell(r,c); };
      grid.appendChild(cell);
    }
    /* 画笔高亮 + 体检 + 码 */
    tools.querySelectorAll('.ed-tool').forEach(b=>b.classList.toggle('on',b.dataset.brush===brush));
    const issues=edIssues(ed);
    status.innerHTML=issues.length?('还不能玩：'+issues.join(' · ')):'✓ 这关可以玩';
    status.className='ed-status '+(issues.length?'bad':'ok');
    const lv=edToLevel(ed);
    codeArea.value=issues.length?'':LevelCode.encode(lv);
    playBtn.disabled=!!issues.length;
    codeBtn.disabled=!!issues.length;
  }
  gridBox.addEventListener('pointerup',()=>{ painting=false; });
  window.addEventListener('pointerup',()=>{ painting=false; });

  const status=html('div','ed-status');
  wrap.appendChild(status);

  /* ---- 动作 ---- */
  const acts=html('div','row ed-acts');
  const playBtn=html('button','btn primary','试玩这一关');
  const codeBtn=html('button','btn green','生成分享码');
  const clearBtn=html('button','btn ghost','清空');
  playBtn.onclick=()=>{
    customLevel=edToLevel(ed); customFromEditor=true;
    location.hash='#/play/c';
  };
  clearBtn.onclick=()=>{ editorState=freshEditor(ed.w,ed.h,ed.mode); editorState.aiTier=ed.aiTier; reroute('#/edit'); };
  acts.append(playBtn,codeBtn,clearBtn);
  wrap.appendChild(acts);

  const codeBox=html('div','ed-code hidden');
  codeBox.appendChild(html('div','ed-code-hint','把这条链接发给朋友，他点开就能玩你这张图：'));
  const codeArea=html('textarea','ed-code-area'); codeArea.readOnly=true; codeArea.rows=3;
  const linkRow=html('div','row');
  const copyBtn=html('button','btn green','复制链接');
  const playLinkBtn=html('button','btn ghost','打开看看');
  linkRow.append(copyBtn,playLinkBtn);
  codeBox.append(codeArea,linkRow);
  wrap.appendChild(codeBox);
  const fullLink=()=>location.origin+location.pathname+'#/c/'+LevelCode.encode(edToLevel(ed));
  codeBtn.onclick=()=>{
    const code=LevelCode.encode(edToLevel(ed));
    edSave(code);
    codeArea.value=fullLink();
    codeBox.classList.remove('hidden');
    toast('分享码已生成（也存进了「我造的关」）');
  };
  copyBtn.onclick=async()=>{
    const txt=fullLink();
    try{ await navigator.clipboard.writeText(txt); toast('链接已复制'); }
    catch(e){ codeArea.select(); toast('请长按选中上面的链接复制'); }
  };
  playLinkBtn.onclick=()=>{ location.hash='#/c/'+LevelCode.encode(edToLevel(ed)); };

  /* ---- 我造的关 ---- */
  const mine=edSaved();
  if(mine.length){
    const box=html('div','paper ed-mine');
    const h2=html('div','page-head'); h2.style.margin='0 0 8px';
    h2.innerHTML='<h1 style="font-size:16px">我造的关</h1>';
    box.appendChild(h2);
    mine.forEach(it=>{
      const row=html('div','ed-mine-row');
      const info=html('span','ed-mine-info',(it.code.length)+' 字符 · '+new Date(it.at).toLocaleDateString());
      const b1=html('button','btn small','继续编辑');
      const b2=html('button','btn small ghost','试玩');
      const b3=html('button','btn small ghost','复制链接');
      b1.onclick=()=>{
        const lv=LevelCode.decode(it.code);
        if(!lv){ toast('这条码已经失效了'); return; }
        editorState=edFromLevel(lv); reroute('#/edit');
      };
      b2.onclick=()=>{
        const lv=LevelCode.decode(it.code);
        if(!lv){ toast('这条码已经失效了'); return; }
        customLevel=lv; customFromEditor=false; location.hash='#/play/c';
      };
      b3.onclick=async()=>{
        const link=location.origin+location.pathname+'#/c/'+it.code;
        try{ await navigator.clipboard.writeText(link); toast('链接已复制'); }catch(e){ toast('复制失败，请手动复制：'+link); }
      };
      row.append(info,b1,b2,b3);
      box.appendChild(row);
    });
    wrap.appendChild(box);
  }
  render();
}
/* 分享码 → 编辑状态（「继续编辑」用） */
function edFromLevel(lv){
  const ed={w:lv.width,h:lv.height,mode:lv.mode,aiTier:lv.aiTier===undefined?1:lv.aiTier,
    blocked:new Set(lv.blockedCells.map(c=>c.r+':'+c.c)),preWalls:lv.preWalls.slice(),
    specials:lv.specialCells.map(s=>Object.assign({},s)),portalFirst:null,
    startP:{...lv.startPosition},startA:{...lv.aiStartPosition},
    goalCells:lv.goalCells.map(c=>({...c})),aiGoalCells:lv.aiGoalCells.map(c=>({...c}))};
  const pa=ed.specials.filter(s=>s.kind==='portal');
  if(pa.length===2){ pa[0].tag='A'; pa[1].tag='B'; }
  return ed;
}

/* 成就墙 + 外观选择（都在「我的」页） */
function AchievementBoard(){
  const box=html('div','paper ach-box');
  const h=html('div','page-head'); h.style.margin='0 0 8px';
  h.innerHTML='<h1 style="font-size:16px">成就</h1>';
  box.appendChild(h);
  const sum=html('div','heat-sum');
  sum.innerHTML='已解锁 <b>'+AchSave.count()+'</b> / '+ACHIEVEMENTS.length
    +' —— 通关、少用墙、不用技能、自造关、双人对战都会记一笔';
  box.appendChild(sum);
  const grid=html('div','ach-grid');
  ACHIEVEMENTS.forEach(a=>{
    const on=AchSave.has(a.id);
    const c=html('div','ach-card'+(on?' on':''));
    c.innerHTML='<b>'+(on?'✓ ':'')+a.name+'</b><small>'+a.desc+'</small>';
    grid.appendChild(c);
  });
  box.appendChild(grid);
  return box;
}
function SkinPicker(){
  const box=html('div','paper ach-box');
  const h=html('div','page-head'); h.style.margin='0 0 8px';
  h.innerHTML='<h1 style="font-size:16px">外观</h1>';
  box.appendChild(h);
  box.appendChild(html('div','heat-sum','换一个样子，棋盘上和地图上都会跟着变'));
  const grid=html('div','skin-grid');
  const cur=SkinSave.get();
  SKINS.forEach(s=>{
    const unlocked=!s.ach||Achievements.isUnlocked(s.ach);
    const card=html('button','skin-card'+(s.id===cur?' on':'')+(unlocked?'':' lock'));
    const svg=el('svg',{viewBox:'0 0 44 46'});
    PlayerPiece(svg,22,30,9,s.id);
    card.appendChild(svg);
    card.appendChild(html('b','',s.name));
    card.appendChild(html('small','',unlocked?(s.desc||''):s.need));
    card.onclick=()=>{
      if(!unlocked){ toast('还没解锁：'+s.need); return; }
      SkinSave.set(s.id);
      toast('换上了「'+s.name+'」');
      reroute('#/me');
    };
    grid.appendChild(card);
  });
  box.appendChild(grid);
  return box;
}

/* ---------------- Profile：我的冒险档案 ---------------- */
function Profile(root){
  const page=html('div','page'); root.appendChild(page);
  const head=html('div','page-head');
  head.innerHTML='<h1>我的冒险档案</h1>';
  page.appendChild(head);
  const p=progressStats();
  const card=html('div','paper profile-card');
  const av=html('div','avatar-big');
  const avSvg=el('svg',{viewBox:'0 0 100 100'}); av.appendChild(avSvg);
  PlayerPiece(avSvg,50,58,26,currentSkin().id);
  card.appendChild(av);
  const info=html('div');
  const nameInput=html('input'); nameInput.value=Save.data.name; nameInput.maxLength=8;
  nameInput.addEventListener('change',()=>{ Save.data.name=nameInput.value.trim()||'冒险者'; Save.write(); });
  info.appendChild(nameInput);
  const line=html('div'); line.style.cssText='margin-top:6px;font-size:13px;color:var(--ink2)';
  line.innerHTML='冒险进度 <b style="color:var(--ink)">'+p.done+' / '+p.total+' 关</b> · 星星 <b style="color:var(--ink)">'+p.stars+'</b> / '+p.maxStars;
  info.appendChild(line);
  const track=html('div','progress-track');
  const fill=html('div','progress-fill'); fill.style.width=(p.done/p.total*100)+'%';
  track.appendChild(fill); info.appendChild(track);
  card.append(info);
  page.appendChild(card);

  const chapters=html('div','paper chapter-rows');
  CHAPTERS.forEach(ch=>{
    const ls=LEVELS.filter(l=>l.chapterId===ch.id);
    const done=ls.filter(l=>Save.done(l.id)).length;
    const row=html('div','crow');
    row.innerHTML='<div class="cname">'+ch.name+'</div>';
    const t2=html('div','progress-track'); const f2=html('div','progress-fill');
    f2.style.width=(done/ls.length*100)+'%'; f2.style.background=THEMES[ch.theme].road;
    t2.appendChild(f2); row.appendChild(t2);
    const num=html('div','cnum',done+'/'+ls.length);
    row.appendChild(num);
    chapters.appendChild(row);
  });
  page.appendChild(chapters);

  /* 难度热力图：一眼看出自己卡在哪一关 */
  page.appendChild(DifficultyHeatmap());

  /* 编辑器入口 */
  const edBox=html('div','paper');
  edBox.style.marginTop='16px';
  const edH=html('div','page-head'); edH.style.margin='0 0 8px';
  edH.innerHTML='<h1 style="font-size:16px">自己造一关</h1>';
  edBox.appendChild(edH);
  edBox.appendChild(html('div','narr','画障碍、摆终点、放机关，导出链接发给朋友——他点开就能玩你画的图。'));
  const edRow=html('div','row');
  const edBtn=html('button','btn green','开工造一关');
  edBtn.onclick=()=>{ location.hash='#/edit'; };
  edRow.appendChild(edBtn);
  const mineCount=edSaved().length;
  if(mineCount) edRow.appendChild(html('span','ed-mine-info','已造 '+mineCount+' 关'));
  edBox.appendChild(edRow);
  page.appendChild(edBox);

  /* 成就墙 + 外观 */
  page.appendChild(AchievementBoard());
  page.appendChild(SkinPicker());

  const recs=Object.entries(Save.data.records).map(([id,r])=>({id:+id,...r}))
    .sort((a,b)=>b.at-a.at).slice(0,6);
  const recBox=html('div');
  const rh=html('div','page-head'); rh.style.marginTop='18px';
  rh.innerHTML='<h1 style="font-size:17px">最近冒险记录</h1>';
  recBox.appendChild(rh);
  if(!recs.length){
    const empty=html('p'); empty.style.cssText='color:var(--ink2);font-size:13px';
    empty.textContent='还没有记录，去地图上踩出第一个脚印吧。';
    recBox.appendChild(empty);
  }
  recs.forEach(r=>{
    recBox.appendChild(AdventureRecord(r));
  });
  page.appendChild(recBox);
}
function AdventureRecord(r){
  const lv=LEVELS[r.id-1]; const ch=CHAPTERS[lv.chapterId-1];
  const row=html('div','record-row');
  const stars=html('span','star-mini');
  for(let i=0;i<3;i++){
    const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 30 30');
    s.innerHTML='<path d="'+starPath(15,16,13,5.4)+'" fill="'+(i<r.stars?'#e6b455':'#dcd6c6')+'"/>';
    stars.appendChild(s);
  }
  row.appendChild(stars);
  const nm=html('span','rname','第'+r.id+'关 · '+ch.name);
  row.appendChild(nm);
  const meta=html('span','rmeta',r.rounds+' 回合 / '+fmtTime(r.time));
  row.appendChild(meta);
  row.appendChild(html('span','rwhen',ago(r.at)));
  return row;
}

/* ---------------- Router ---------------- */
function route(){
  clearInterval(gameTimer);
  document.querySelectorAll('.scrim').forEach(s=>s.remove());   /* 切页时清掉残留弹层 */
  const h=location.hash||'#/map';
  document.body.classList.toggle('in-game',h.startsWith('#/play'));
  const view=$('#view'); if(!view) return;
  view.innerHTML='';
  const m=h.match(/^#\/play\/(\d+|c|d)/);        /* d = 每日挑战 */
  if(m){ renderGame(view,m[1]); }
  else if(h.startsWith('#/edit')) Editor(view);
  else if(h.startsWith('#/daily')){
    const tier=h.includes('/hell')?1:0;
    const lv=buildDailyLevel(Daily.todayKey(),tier);
    if(!lv){ toast('今天的图没生成出来，稍后再试'); location.hash='#/map'; }
    else { dailyLevel=lv; location.hash='#/play/d'; }
  }
  else if(h.startsWith('#/c/')){
    /* 分享码入口：解出来就进对局，解不出来就明确告诉玩家码有问题 */
    const code=decodeURIComponent(h.slice(4)).trim();
    const lv=LevelCode.decode(code);
    if(lv){ customLevel=lv; customFromEditor=false; location.hash='#/play/c'; }
    else {
      const page=html('div','page'); view.appendChild(page);
      const head=html('div','page-head'); head.innerHTML='<h1>这张分享码打不开</h1>'; page.appendChild(head);
      const box=html('div','paper');
      box.appendChild(html('div','narr','可能链接被截断了，或者码被改动过。可以让对方重新发一次完整链接。'));
      const row=html('div','row');
      const b1=html('button','btn primary','回到地图'); b1.onclick=()=>{ location.hash='#/map'; };
      const b2=html('button','btn ghost','我也去造一关'); b2.onclick=()=>{ location.hash='#/edit'; };
      row.append(b1,b2); box.appendChild(row);
      page.appendChild(box);
    }
  }
  else if(h.startsWith('#/rank')) renderLeaderboard(view);
  else if(h.startsWith('#/community')) CommunityPlaceholder(view);
  else if(h.startsWith('#/me')) Profile(view);
  else renderAdventureMap(view);
  syncNav();
}
window.addEventListener('hashchange',route);

/* ---------------- boot ---------------- */
Save.load();
Stats.load();
Flags.load();
Daily.load();
buildLevels();          /* 生成 100 关数据（棋盘/预置墙/障碍/AI/星级规则） */
AppShell();
route();
</script>
