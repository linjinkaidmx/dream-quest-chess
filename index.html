<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梦境征途 · 冒险策略棋</title>
<style>
:root{
  --paper:#f7f1e3; --paper2:#efe4cc; --ink:#4a3b2a; --ink2:#8d7c62;
  --green:#4f7d5b; --green2:#6a9a76; --brown:#8b6b4a; --brown2:#6b4f35;
  --sun:#e6b455; --mint:#9ecfb4; --sky:#8ec3e0; --lav:#b5a6d6; --coral:#e59a8c;
  --danger:#c96f5e;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  font-size:15px; line-height:1.6;
}
button{font-family:inherit; color:inherit;}
a{color:inherit; text-decoration:none;}
#app{display:flex; min-height:100vh;}

/* ---------- 手绘质感基础 ---------- */
.paper{
  background:var(--paper);
  border:2px solid rgba(74,59,42,.5);
  border-radius:20px 26px 22px 28px / 28px 20px 26px 22px;
  box-shadow:0 3px 0 rgba(107,79,53,.18);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; font-size:15px;                 /* 默认尺寸：面板/地图里的按钮另有更具体的规则覆盖 */
  border:2px solid var(--ink); cursor:pointer; font-weight:600;
  background:var(--paper); color:var(--ink);
  border-radius:14px 17px 15px 18px / 18px 15px 17px 14px;
  box-shadow:0 3px 0 rgba(74,59,42,.4); transition:transform .08s, box-shadow .08s;
  user-select:none;
}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,0);}
.btn.primary{background:var(--sun); border-color:var(--brown2);}
.btn.green{background:var(--green2); color:#fff; border-color:var(--green);}
.btn.ghost{background:transparent; box-shadow:none; border-color:rgba(74,59,42,.35);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- AppShell：侧导航（PC） ---------- */
.side-nav{
  width:216px; flex:none; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; padding:22px 14px;
  background:var(--paper2);
  border-right:2px solid rgba(74,59,42,.35);
  background-image:radial-gradient(rgba(139,107,74,.07) 1.2px, transparent 1.2px);
  background-size:22px 22px;
}
.logo{display:flex; align-items:center; gap:10px; padding:4px 8px 18px;}
.logo .mark{width:44px; height:44px; flex:none;}
.logo b{font-size:19px; letter-spacing:1px; display:block; line-height:1.15;}
.logo small{color:var(--ink2); font-size:11px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 14px; margin-bottom:6px;
  border:2px solid transparent; border-radius:16px 13px 15px 12px / 12px 15px 13px 16px;
  cursor:pointer; font-size:15px; color:var(--ink); background:none; width:100%;
  transition:.15s; text-align:left;
}
.nav-item svg{width:21px; height:21px; flex:none;}
.nav-item:hover{background:rgba(230,180,85,.18);}
.nav-item.active{
  background:var(--sun); border-color:var(--brown2);
  box-shadow:0 3px 0 rgba(107,79,53,.35); font-weight:700;
}
.nav-progress{margin-top:auto; padding:12px 14px; font-size:12px; color:var(--ink2);}
.nav-progress b{color:var(--ink); font-size:15px;}
/* 占位页入口：灰显 + 敬请期待角标（社区/排行要等服务端，先诚实一点） */
.nav-item.soon{opacity:.45;}
.nav-item.soon:hover{background:rgba(74,59,42,.06);}
.nav-item{position:relative;}
.soon-badge{
  position:absolute; top:-6px; right:6px; font-style:normal; font-size:9px; font-weight:700;
  background:var(--paper2); color:var(--ink2); border:1.5px solid rgba(74,59,42,.4);
  border-radius:8px; padding:1px 5px; letter-spacing:1px;
}
.nav-mute{margin-bottom:0;}

/* ---------- 视图区 ---------- */
#view{flex:1; min-width:0; display:block;}
.page{max-width:900px; margin:0 auto; padding:26px 22px 60px;}

/* ---------- 底部导航（Mobile） ---------- */
.tabbar{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--paper2);
  border-top:2px solid rgba(74,59,42,.4);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .nav-item{
  flex-direction:column; gap:2px; margin:0; flex:1; padding:8px 0 7px;
  border-radius:0; font-size:11px; box-shadow:none;
}
.tabbar .nav-item.active{background:none; box-shadow:none;}
.tabbar .nav-item.active svg{color:var(--brown2);}
.tabbar .nav-item.active{color:var(--brown2); font-weight:700;}
/* 对局中隐藏底部导航，避免与操作区重叠 */
body.in-game .tabbar{display:none !important;}

/* ---------- 闯关页顶部：继续冒险 ---------- */
.hero{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:18px 22px; margin-bottom:18px;
}
.hero .info{flex:1; min-width:220px;}
.hero .chapter-tag{
  display:inline-block; font-size:12px; padding:2px 10px; margin-bottom:6px;
  background:var(--mint); border:1.5px solid var(--green);
  border-radius:12px 9px 11px 10px / 9px 12px 10px 11px; color:#2f5a40; font-weight:600;
}
.hero h1{font-size:22px; line-height:1.3;}
.hero .sub{color:var(--ink2); font-size:13px; margin-top:2px;}
.hero .btn{padding:13px 30px; font-size:17px;}
.hero .stats{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
.chip{
  font-size:12px; padding:4px 11px; background:#fff;
  border:1.5px solid rgba(74,59,42,.35); border-radius:14px 11px 13px 12px / 11px 14px 12px 13px;
  color:var(--ink2);
}
.chip b{color:var(--ink);}

/* ---------- 世界地图 ---------- */
.mapwrap{position:relative;}
.mapsvg{display:block; width:100%; height:auto;}
.node-hit{cursor:pointer;}
.node-locked .node-hit{cursor:default;}
@keyframes npulse{0%{r:26; opacity:.75}100%{r:46; opacity:0}}
.node-ring{animation:npulse 1.6s ease-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.node-bob{animation:bob 1.5s ease-in-out infinite; transform-origin:center; transform-box:fill-box;}
@keyframes nodepop{0%{transform:scale(.4); opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1); opacity:1}}
.node-pop{animation:nodepop .5s ease-out; transform-origin:center; transform-box:fill-box;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.misty{animation:floaty 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}

/* ---------- 对局页 ---------- */
.game-page{max-width:980px; margin:0 auto; padding:14px 14px 96px;}
.hud{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 16px; margin-bottom:12px;
}
.hud .lv{font-weight:700; font-size:15px; margin-right:auto;}
.hud .lv small{display:block; font-weight:400; font-size:11px; color:var(--ink2);}
.pill{
  font-size:12px; color:var(--ink2); background:#fff; padding:4px 10px;
  border:1.5px solid rgba(74,59,42,.35); border-radius:14px 11px 13px 12px / 11px 14px 12px 13px;
  white-space:nowrap;
}
.pill b{color:var(--ink); font-size:14px;}
.hud .goal-pill{background:#fff6dd; border-color:rgba(201,154,46,.55);}
.hud .goal-pill b{color:#b07a1f;}
.hud .evt-pill{background:#ffe9d6; border-color:rgba(201,111,94,.5);}
.hud .evt-pill b{color:#b5533a;}
/* ---------- 今日挑战 ---------- */
.daily-card{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px; flex-wrap:wrap;}
.daily-left{flex:1; min-width:210px;}
.daily-tag{display:inline-block; font-size:11px; font-weight:700; color:#3b2a10; background:#EF9F27; padding:3px 9px; border-radius:999px;}
.daily-card h2{font-size:18px; margin:8px 0 4px;}
.daily-info{font-size:13px; color:var(--ink2); line-height:1.55;}
.daily-info .dim{opacity:.78; font-size:12px;}
.daily-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
.daily-done{font-size:13px; font-weight:700; color:#3B6D11;}
.daily-streak{font-size:12px; color:var(--ink2);}
@media (max-width:560px){ .daily-right{align-items:stretch; width:100%;} .daily-right .btn{width:100%;} }

/* ---------- 成就 / 外观 ---------- */
.ach-box{margin-top:16px;}
.ach-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(152px, 1fr)); gap:10px;}
.ach-card{padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:#f7f4ea; opacity:.55;}
.ach-card.on{background:#fff8e6; border-color:#b07a1f; opacity:1;}
.ach-card b{display:block; font-size:14px; color:var(--ink);}
.ach-card small{display:block; font-size:12px; color:var(--ink2); margin-top:3px; line-height:1.45;}
.skin-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:10px;}
.skin-card{display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 8px; border-radius:12px;
  border:2px solid var(--line); background:#fffdf6; cursor:pointer;}
.skin-card.on{border-color:#EF9F27; background:#fff8e6;}
.skin-card.lock{opacity:.5; cursor:not-allowed;}
.skin-card svg{width:46px; height:48px;}
.skin-card b{font-size:13px; color:var(--ink);}
.skin-card small{font-size:11px; color:var(--ink2); text-align:center; line-height:1.4;}
.ach-new{margin-top:12px; padding:8px 10px; border-radius:10px; background:#EAF3DE; border:1.5px solid #639922;}
.ach-new-row{font-size:13px; color:#3B6D11; font-weight:600;}

/* ---------- 技能卡 ---------- */
.btn.warn{background:#fff6dd; border-color:#b07a1f;}
.skill-list{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 6px;}
.skill-card{display:flex; flex-direction:column; align-items:flex-start; gap:5px; text-align:left;
  padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:#fffdf6; cursor:pointer;}
.skill-card:hover{border-color:#b07a1f;}
.skill-card .sk-mark{width:26px; height:26px; border-radius:8px; background:#EF9F27; color:#3b2a10;
  display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.skill-card b{font-size:15px; color:var(--ink);}
.skill-card small{font-size:12px; color:var(--ink2); line-height:1.5;}
.skill-card.used{border-color:#639922; background:#EAF3DE;}
.skill-card.dim{opacity:.5;}
@media (max-width:560px){ .skill-list{grid-template-columns:1fr;} }

/* ---------- 关卡编辑器 ---------- */
.page-head .sub{font-size:13px;color:var(--ink2);margin:4px 0 0;}
/* 通用按钮行（面板之外的地方也用它：编辑器、战绩卡…；面板内由 .panel .row 覆盖） */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.ed-wrap{display:flex;flex-direction:column;gap:12px;}
.ed-bar{display:flex;flex-wrap:wrap;gap:16px;}
.ed-field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);}
.ed-field select{padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:#fffdf6;font-size:13px;color:var(--ink);}
.ed-tools{display:flex;flex-wrap:wrap;gap:8px;}
.ed-tool{padding:7px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fffdf6;font-size:13px;cursor:pointer;color:var(--ink2);}
.ed-tool.on{background:#EF9F27;border-color:#b07a1f;color:#3b2a10;font-weight:700;}
.ed-gridbox{overflow:auto;padding:4px;}
.ed-grid{display:grid;gap:3px;max-width:560px;}
.ed-cell{aspect-ratio:1/1;border-radius:6px;border:1.5px solid #ddd5c0;background:#f4efe2;font-size:12px;font-weight:700;cursor:pointer;padding:0;color:#6b5b3e;}
.ed-cell.k-block{background:#9a7550;border-color:#6b4f33;color:#fff;}
.ed-cell.k-startP{background:#EF9F27;border-color:#854F0B;color:#3b2a10;}
.ed-cell.k-startA{background:#7F77DD;border-color:#534AB7;color:#fff;}
.ed-cell.k-goal{background:#fff6dd;border-color:#b07a1f;color:#b07a1f;}
.ed-cell.k-aiGoal{background:#EEEDFE;border-color:#534AB7;color:#534AB7;}
.ed-cell.k-portalA,.ed-cell.k-portalB{background:#EEEDFE;border-color:#534AB7;color:#534AB7;}
.ed-cell.k-boost{background:#D7F0EA;border-color:#0F6E56;color:#0F6E56;}
.ed-cell.k-spring{background:#FAEEDA;border-color:#854F0B;color:#854F0B;}
.ed-cell.k-trap{background:#FBE4E8;border-color:#A32D2D;color:#A32D2D;}
.ed-cell.k-pickup{background:#FAEEDA;border-color:#B07A1F;color:#854F0B;}
.ed-status{font-size:13px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);}
.ed-status.ok{background:#EAF3DE;border-color:#639922;color:#3B6D11;}
.ed-status.bad{background:#FAECE7;border-color:#D85A30;color:#993C1D;}
.ed-acts{gap:10px;}
.ed-code{padding:12px 14px;border-radius:12px;background:#fffdf6;border:1.5px solid var(--line);}
.ed-code.hidden{display:none;}
.ed-code-hint{font-size:13px;color:var(--ink2);margin-bottom:8px;}
.ed-code-area{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:#fbf8ee;color:#4a3b2a;resize:vertical;}
.ed-mine{margin-top:16px;}
.ed-mine-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eee7d5;}
.ed-mine-info{flex:1;font-size:12px;color:var(--ink2);}
.btn.small{padding:6px 10px;font-size:12px;}

/* ---------- 难度热力图 ---------- */
.heat-box{margin-top:18px;}
.heat-sum{font-size:13px;color:var(--ink2);margin-bottom:10px;}
.heat-sum b{color:var(--ink);}
.heat-grid{display:flex;flex-direction:column;gap:6px;}
.heat-row{display:flex;align-items:center;gap:10px;}
.heat-lab{flex:0 0 108px;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.heat-cells{flex:1;display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;}
.heat-cell{
  aspect-ratio:1/1; border-radius:6px; border:1.5px solid var(--line);
  background:#F1EFE8; color:#7a6a52; font-size:11px; font-weight:600;
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  transition:transform .12s ease, box-shadow .12s ease;
}
.heat-cell:hover{transform:translateY(-1px);}
.heat-cell.on{box-shadow:0 0 0 2.5px var(--ink);}
.heat-cell.t0{background:#F1EFE8;border-color:#D3D1C7;color:#8a8578;}
.heat-cell.t1{background:#EAF3DE;border-color:#639922;color:#3B6D11;}
.heat-cell.t2{background:#FAEEDA;border-color:#BA7517;color:#854F0B;}
.heat-cell.t3{background:#FAECE7;border-color:#D85A30;color:#993C1D;}
.heat-cell.t4{background:#FBE4E8;border-color:#A32D2D;color:#8a2431;}
.heat-legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 4px;font-size:12px;color:var(--ink2);}
.lg-item{display:flex;align-items:center;gap:6px;}
.lg-sw{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line);display:inline-block;}
.lg-sw.t0{background:#F1EFE8;border-color:#D3D1C7;}
.lg-sw.t1{background:#EAF3DE;border-color:#639922;}
.lg-sw.t2{background:#FAEEDA;border-color:#BA7517;}
.lg-sw.t3{background:#FAECE7;border-color:#D85A30;}
.lg-sw.t4{background:#FBE4E8;border-color:#A32D2D;}
.heat-detail{margin-top:14px;}
.stat-card{background:#fffdf6;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;}
.stat-card h2{font-size:16px;margin:0 0 10px;}
.advice{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff6dd;border:1.5px solid rgba(201,154,46,.5);font-size:13px;line-height:1.6;}
.advice b{color:#b07a1f;}

/* ---------- 教学卡示意图 ---------- */
.hud .chase-pill{background:#fbe4e8; border-color:rgba(168,50,74,.5);}
.hud .chase-pill b{color:#a8324a;}
.intro-art{width:100%; max-width:320px; height:auto; display:block; margin:2px auto 8px;}
.intro-art .ia-hop{animation:iaHop 2.2s ease-in-out infinite;}
@keyframes iaHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.intro-art .ia-step{animation:iaStep 2.6s ease-in-out infinite;}
@keyframes iaStep{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-18px)}}
.intro-art .ia-chase{animation:iaChase 2.2s ease-in-out infinite;}
@keyframes iaChase{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}
.intro-art .ia-dodge{animation:iaDodge 2.2s ease-in-out infinite;}
@keyframes iaDodge{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}
.intro-art .ia-push-a{animation:iaPushA 2.8s ease-in-out infinite;}
@keyframes iaPushA{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
.intro-art .ia-push-b{animation:iaPushB 2.8s ease-in-out infinite;}
@keyframes iaPushB{0%,100%{transform:translateX(0)}50%{transform:translateX(-30px)}}
.intro-art .ia-blink{animation:iaBlink 1.7s ease-in-out infinite;}
@keyframes iaBlink{0%,100%{opacity:.4}50%{opacity:1}}
.intro-art .ia-tick-a{animation:iaTickA 2.6s ease-in-out infinite;}
@keyframes iaTickA{0%,42%{opacity:1}58%,100%{opacity:.2}}
.intro-art .ia-tick-b{animation:iaTickB 2.6s ease-in-out infinite;}
@keyframes iaTickB{0%,42%{opacity:.2}58%,100%{opacity:1}}
.intro-art .ia-pulse{animation:iaPulse 1.9s ease-in-out infinite;}
@keyframes iaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.turn-orb{width:15px; height:15px; border-radius:50%; border:2px solid var(--ink); flex:none; transition:.2s;}
.turn-orb.on{box-shadow:0 0 0 4px rgba(230,180,85,.45);}
.turn-pair{display:flex; align-items:center; gap:5px;}
.icon-btn{
  width:38px; height:38px; padding:0; flex:none; display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn svg{width:18px; height:18px;}
.boardsvg{display:block; width:100%; height:auto; touch-action:none;}
.board-arena{position:relative;}
@keyframes goalglow{0%,100%{opacity:.45}50%{opacity:.95}}
.goal-cell{animation:goalglow 1.8s ease-in-out infinite;}
@keyframes dotsoft{0%,100%{opacity:.35}50%{opacity:.85}}
.move-hint{animation:dotsoft 1.4s ease-in-out infinite; cursor:pointer;}

/* ---------- 操作区（单行手势提示） ---------- */
.actions{
  position:sticky; bottom:0; z-index:40; margin-top:12px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--paper2); border:2px solid rgba(74,59,42,.45);
  border-radius:18px 22px 16px 20px / 20px 16px 22px 18px;
  padding:10px 14px 12px; flex-wrap:wrap;
}
.actions .hint{
  font-size:13px; color:var(--ink2); line-height:1.5; text-align:center;
}
.actions .hint b{color:var(--ink);}
@keyframes anchorPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.anchor-pulse{transform-box:fill-box; transform-origin:center; animation:anchorPulse 1s ease-out infinite;}

/* ---------- 覆盖面板（胜利/失败） ---------- */
.scrim{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:rgba(58,44,28,.34); padding:18px; opacity:0; transition:opacity .3s; pointer-events:none;
}
.scrim.show{opacity:1; pointer-events:auto;}
.panel{
  width:min(430px,100%); padding:26px 28px 24px; text-align:center; position:relative;
  transform:translateY(16px) rotate(-.6deg); transition:transform .3s;
}
.scrim.show .panel{transform:translateY(0) rotate(-.6deg);}
.panel h2{font-size:24px; margin-bottom:4px; letter-spacing:1px;}
.panel .narr{color:var(--ink2); font-size:14px; margin-bottom:16px; font-style:italic;}
.stats-grid{display:flex; justify-content:center; gap:10px; margin:14px 0 6px; flex-wrap:wrap;}
.stat{
  flex:1; min-width:86px; padding:9px 6px; background:#fff;
  border:1.5px solid rgba(74,59,42,.3);
  border-radius:14px 11px 13px 12px / 11px 14px 12px 13px;
}
.stat small{display:block; font-size:11px; color:var(--ink2);}
.stat b{font-size:19px;}
.newrec{
  display:inline-block; font-size:12px; color:#b07a1f; background:#ffedc4;
  border:1.5px dashed var(--sun); border-radius:12px; padding:2px 10px; margin-top:6px;

<body>

<script>
"use strict";
/* =====================================================================
   梦境征途 · 冒险策略棋（单文件骨架版）
   架构：数据(LEVELS/CHAPTERS/THEMES) 驱动 UI 组件（组件名与设计稿一致）
   AppShell / Navigation / AdventureMap / Chapter / LevelNode /
   GameBoard / BoardCell / PlayerPiece / AIPiece / Wall / WallDrag /
   GameHUD / ActionBar / VictoryPanel / FailurePanel / StarRating /
   Leaderboard / Profile / AdventureRecord / CommunityPlaceholder
   引擎(Engine/AI) 与表现(render/animate) 完全分离
   ===================================================================== */

/* ---------------- utils ---------------- */
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs){ if(attrs[k]!=null) e.setAttribute(k,attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
function html(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function rng(seed){ let s=seed>>>0; return function(){ s=(s+0x6D2B79F5)>>>0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function fmtTime(sec){ sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60),s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function ago(ts){ const d=Date.now()-ts; if(d<60e3)return'刚刚'; if(d<3600e3)return Math.floor(d/60e3)+'分钟前'; if(d<86400e3)return Math.floor(d/3600e3)+'小时前'; return Math.floor(d/86400e3)+'天前'; }
function tween(dur,step,done){
  const t0=performance.now();
  function frame(now){
    const p=clamp((now-t0)/dur,0,1);
    const e=1-Math.pow(1-p,3);           // easeOutCubic
    step(e,p);
    if(p<1) requestAnimationFrame(frame); else if(done) done();
  }
  requestAnimationFrame(frame);
}
let toastTimer=null;
function toast(msg){
  const t=$('.toast'); if(!t)return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ---------------- 音效（WebAudio 实时合成，零音频文件，保住单文件架构） ----------------
   SFX.play(name) 播一发短音效；SFX.startMusic('map'|'game') 播环境 BGM 循环。
   铁律：AudioContext 必须在用户手势之后创建（移动端自动播放策略）——
   boot 时挂一次性 pointerdown 监听，第一次点击才解锁；此前所有播放调用静默跳过。 */
const SFX=(()=>{
  const KEY='dreamquest.sfx.v1';
  let ctx=null, muted=false, unlocked=false;
  let musicTimer=null, musicKind=null, musicBar=0;
  try{ muted=localStorage.getItem(KEY)==='off'; }catch(e){}
  function unlock(){                 /* 在首次用户手势里调用；之后才能出声 */
    if(unlocked) return;
    unlocked=true;
    if(!muted&&musicKind) startMusic(musicKind,true);
  }
  function ac(){
    if(muted||!unlocked) return null;
    if(!ctx){
      try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  /* 一个音符：freq 起始频率、slide 结束频率、type 波形、dur 时长、vol 音量、at 延迟 */
  function tone(o){
    const c=ac(); if(!c) return;
    const t0=c.currentTime+(o.at||0);
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.freq,t0);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30,o.slide),t0+o.dur);
    const v=(o.vol==null?0.16:o.vol);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v,t0+(o.attack||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
    osc.connect(g).connect(c.destination);
    osc.start(t0); osc.stop(t0+o.dur+0.02);
  }
  /* 一撮噪声：木块叩击、岩浆隆隆这类"质感"音都靠它 */
  function noise(o){
    const c=ac(); if(!c) return;
    const t0=c.currentTime+(o.at||0);
    const n=Math.floor(c.sampleRate*o.dur);
    const buf=c.createBuffer(1,n,c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type=o.ftype||'lowpass'; f.frequency.value=o.freq||800;
    const g=c.createGain(); g.gain.setValueAtTime(o.vol==null?0.12:o.vol,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t0);
  }
  const PLAY={
    step(){   tone({freq:340,slide:430,type:'sine',dur:0.09,vol:0.07}); },
    aiStep(){ tone({freq:280,slide:340,type:'sine',dur:0.08,vol:0.045}); },
    wall(){   noise({dur:0.08,freq:900,vol:0.16}); tone({freq:150,slide:95,type:'triangle',dur:0.13,vol:0.18}); },
    wallFail(){ tone({freq:170,type:'square',dur:0.07,vol:0.05}); tone({freq:130,type:'square',dur:0.09,vol:0.05,at:0.08}); },
    portal(){ [520,660,880].forEach((f,i)=>tone({freq:f,type:'sine',dur:0.12,vol:0.09,at:i*0.055})); },
    boost(){  tone({freq:420,slide:760,type:'triangle',dur:0.16,vol:0.09}); },
    spring(){ tone({freq:200,slide:520,type:'triangle',dur:0.22,vol:0.11}); tone({freq:520,slide:260,type:'sine',dur:0.18,vol:0.06,at:0.16}); },
    trap(){   tone({freq:300,slide:120,type:'sawtooth',dur:0.26,vol:0.08}); noise({dur:0.14,freq:500,vol:0.06,at:0.04}); },
    lava(){   noise({dur:0.55,freq:220,vol:0.13}); tone({freq:70,slide:48,type:'sine',dur:0.5,vol:0.1}); },
    rain(){   for(let i=0;i<4;i++) noise({dur:0.05,freq:1800+i*300,vol:0.045,at:i*0.05}); },
    gate(){   tone({freq:660,type:'sine',dur:0.18,vol:0.09}); tone({freq:990,type:'sine',dur:0.22,vol:0.07,at:0.09}); },
    phase(){  tone({freq:392,type:'triangle',dur:0.12,vol:0.08}); tone({freq:523,type:'triangle',dur:0.16,vol:0.08,at:0.1}); },
    skill(){  [523,659,784].forEach((f,i)=>tone({freq:f,type:'triangle',dur:0.14,vol:0.08,at:i*0.05})); },
    caught(){ tone({freq:220,slide:65,type:'sawtooth',dur:0.5,vol:0.14}); noise({dur:0.3,freq:300,vol:0.1,at:0.05}); },
    win(){    [523,659,784,1047].forEach((f,i)=>tone({freq:f,type:'triangle',dur:0.3,vol:0.1,at:i*0.12}));
              tone({freq:1047,type:'sine',dur:0.5,vol:0.06,at:0.5}); },
    fail(){   [392,311,262].forEach((f,i)=>tone({freq:f,type:'sine',dur:0.28,vol:0.09,at:i*0.14})); },
    star(){   tone({freq:880,slide:1320,type:'sine',dur:0.18,vol:0.08}); },
    ach(){    [659,784,988,1319].forEach((f,i)=>tone({freq:f,type:'sine',dur:0.2,vol:0.07,at:i*0.07})); },
  };
  /* BGM：极简的环境循环。地图页 = 慢速五声音阶拨弦；对局页 = 更稀疏的低音铺底。
     音量压得很低（0.035 档），存在感刚好盖过"死寂"，不抢注意力。 */
  const SCALE_MAP=[262,294,330,392,440,523], SCALE_GAME=[131,147,165,196];
  function bar(){
    if(!ac()||!musicKind){ return; }
    const scale=musicKind==='game'?SCALE_GAME:SCALE_MAP;
    const stepLen=musicKind==='game'?2.4:1.5;
    const R2=Math.random;
    if(musicKind==='game'){
      tone({freq:scale[musicBar%4],type:'sine',dur:2.2,vol:0.028});
      if(musicBar%4===0) tone({freq:scale[0]/2,type:'sine',dur:3.6,vol:0.022});
    } else {
      const n=2+Math.floor(R2()*2);
      for(let i=0;i<n;i++){
        const f=scale[Math.floor(R2()*scale.length)];
        tone({freq:f,type:'triangle',dur:0.9,vol:0.03,at:i*0.42});
      }
    }
    musicBar++;
    musicTimer=setTimeout(bar,stepLen*1000);
  }
  function startMusic(kind,force){
    if(musicKind===kind&&!force) return;
    stopMusic();
    musicKind=kind;
    if(muted) return;                    /* 静音时只记种类，解锁/取消静音后再起 */
    if(ac()){ musicBar=0; bar(); }
  }
  function stopMusic(){ if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; } }
  function setMuted(m){
    muted=m;
    try{ localStorage.setItem(KEY,m?'off':'on'); }catch(e){}
    if(m){ stopMusic(); }
    else if(unlocked&&musicKind){ musicBar=0; bar(); }
    return muted;
  }
  return {
    play(name){ if(PLAY[name]) PLAY[name](); },
    startMusic, stopMusic,
    toggle(){ return setMuted(!muted); },
    isMuted(){ return muted; },
    unlock,
  };
})();
/* 首次任意点击/按键解锁音频（自动播放策略）；一旦解锁，当前页面的 BGM 立刻补上 */
window.addEventListener('pointerdown',()=>SFX.unlock(),{once:true,capture:true});
window.addEventListener('keydown',()=>SFX.unlock(),{once:true,capture:true});

/* ---------------- 视觉主题（地图章节 + 棋盘） ---------------- */

/* ---------------- Level 数据工厂（数据驱动核心） ---------------- */
const LEVELS=[];      // id → level 对象（含棋盘/预置墙/AI/星级规则）
const EDGES=[];       // {from,to} 关卡图（分支/合并）

const ZONES=[];       // 章节地图区 {y0,y1,ch}
const WALL_QUOTA_P=10;

const K=(k,r,c)=>k+':'+r+':'+c;

/* 引擎纯函数（棋盘由 level 数据动态生成，支持任意 WxH）
   胜负语义：到达对方一侧的整条边线（goalPosition 中的 span 门仅作视觉强调） */
function makeGame(level){
  /* 目标完全由关卡数据决定：goalCells 可以是「整条边线」也可以是「指定的门格」，
     引擎不再假设终点在哪 —— 门型关、共同终点、同起点同向都靠这一处支撑。 */
  const goalsP=(level.goalCells||[]).map(g=>({r:g.r,c:g.c}));
  const goalsA=(level.aiGoalCells||[]).map(g=>({r:g.r,c:g.c}));
  return {
    W:level.width, H:level.height,
    mode:level.mode||'race',              /* 追逐关要用它改判定（怪物追人，不追终点） */
    blocked:new Set(level.blockedCells.map(c=>c.r+':'+c.c)),
    specialCells:(level.specialCells||[]).map(s=>Object.assign({},s)),
    hW:new Set(), vW:new Set(),           // 对局中新放置的墙
    balls:{ P:{...level.startPosition}, A:{...level.aiStartPosition} },
    goals:{ P:goalsP, A:goalsA },
    wallsLeft:{ P:level.wallRules.quota.P, A:level.aiConfig.budget },
    turn:'P', round:1, over:null,
  };
}
function isBlockedCell(g,r,c){ return g.blocked.has(r+':'+c); }
function edgeBlocked(g,a,b){
  if(b.r===a.r+1) return g.hW.has(K('H',a.r,a.c))||g.hW.has(K('H',a.r,a.c-1));
  if(b.r===a.r-1) return g.hW.has(K('H',b.r,b.c))||g.hW.has(K('H',b.r,b.c-1));
  if(b.c===a.c+1) return g.vW.has(K('V',a.r,a.c))||g.vW.has(K('V',a.r-1,a.c));
  if(b.c===a.c-1) return g.vW.has(K('V',b.r,b.c))||g.vW.has(K('V',b.r-1,b.c));
  return false;
}
function legalMoves(g,color){
  const me=g.balls[color], op=g.balls[color==='P'?'A':'P'], out=[];
  for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const r=me.r+dr, c=me.c+dc;
    if(r<0||r>=g.H||c<0||c>=g.W) continue;
    if(isBlockedCell(g,r,c)) continue;
    if(r===op.r&&c===op.c) continue;                 // 两球不可重叠
    if(edgeBlocked(g,me,{r,c})) continue;
    out.push({r,c});
  }
  return out;
}
function bfs(g,color){
  const me=g.balls[color], goals=g.goals[color];
  const dist=Array.from({length:g.H},()=>Array(g.W).fill(-1));
  const prev=Array.from({length:g.H},()=>Array(g.W).fill(null));
  const q=[[me.r,me.c]]; dist[me.r][me.c]=0; let head=0;
  while(head<q.length){
    const [r,c]=q[head++];
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=g.H||nc<0||nc>=g.W) continue;
      if(dist[nr][nc]!==-1) continue;
      if(isBlockedCell(g,nr,nc)) continue;
      if(edgeBlocked(g,{r,c},{r:nr,c:nc})) continue;
      dist[nr][nc]=dist[r][c]+1; prev[nr][nc]={r,c}; q.push([nr,nc]);
    }
  }
  let best=Infinity, cell=null;
  for(const gl of goals){ const d=dist[gl.r][gl.c]; if(d!==-1&&d<best){best=d; cell=gl;} }
  /* 回溯出「起点→终点」的整条路径；next = 从球出发的第一步（AI 与竞速对手都靠它推进） */
  const path=[]; let cur=cell;
  while(cur){ path.push(cur); cur=prev[cur.r][cur.c]; }
  path.reverse();
  return { dist: best===Infinity?0:best, next: path.length>1?path[1]:null, path };
}
/* 从某一格到某一格的最短路（怪物追人用：它的"目标"是玩家当前位置，不在 goals 里） */
function pathLen(g,from,to){
  const dist=Array.from({length:g.H},()=>Array(g.W).fill(-1));
  const prev=Array.from({length:g.H},()=>Array(g.W).fill(null));
  const q=[[from.r,from.c]]; dist[from.r][from.c]=0; let head=0;
  while(head<q.length){
    const [r,c]=q[head++];
    if(r===to.r&&c===to.c) break;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=g.H||nc<0||nc>=g.W) continue;
      if(dist[nr][nc]!==-1) continue;
      if(isBlockedCell(g,nr,nc)) continue;
      if(edgeBlocked(g,{r,c},{r:nr,c:nc})) continue;
      dist[nr][nc]=dist[r][c]+1; prev[nr][nc]={r,c}; q.push([nr,nc]);
    }
  }
  const d=dist[to.r][to.c];
  if(d===-1) return { dist:0, next:null };
  const path=[]; let cur={r:to.r,c:to.c};
  while(cur){ path.push(cur); cur=prev[cur.r][cur.c]; }
  path.reverse();
  return { dist:d, next: path.length>1?path[1]:null, path };
}
function validWall(g,kind,r,c){
  if(r<0||r>g.H-2||c<0||c>g.W-2) return false;
  if(kind==='H'){
    if(g.hW.has(K('H',r,c))||g.hW.has(K('H',r,c-1))||g.hW.has(K('H',r,c+1))) return false;
    if(g.hW.has(K('H',r,c))||g.vW.has(K('V',r,c))) return false;
  } else {
    if(g.vW.has(K('V',r,c))||g.vW.has(K('V',r-1,c))||g.vW.has(K('V',r+1,c))) return false;
    if(g.hW.has(K('H',r,c))) return false;
  }
  const set=kind==='H'?g.hW:g.vW, key=K(kind,r,c);
  set.add(key);
  /* 追逐关多一条铁律：落墙后怪物必须仍能走到玩家当前位置。
     否则玩家只要一堵墙就能把怪物永久隔离，这关就变成走空路。 */
  const ok = g.mode==='chase'
    ? (bfs(g,'P').dist>0 && pathLen(g,g.balls.A,g.balls.P).dist>0)
    : (bfs(g,'P').dist>0 && bfs(g,'A').dist>0);
  set.delete(key);
  return ok;
}
function placeWall(g,color,kind,r,c){
  (kind==='H'?g.hW:g.vW).add(K(kind,r,c));
  g.wallsLeft[color]--;
}
/* 落不了墙的原因（出手前预警用）：把 validWall 的三种否决拆开说人话，
   玩家在出手前就知道这面墙为什么不行，而不是出手后挨一句 toast。 */
function wallBlockReason(g,kind,r,c){
  if(r<0||r>g.H-2||c<0||c>g.W-2) return '墙要完全落在棋盘内部';
  if(kind==='H'){
    if(g.hW.has(K('H',r,c))||g.hW.has(K('H',r,c-1))||g.hW.has(K('H',r,c+1))) return '会和别的墙重叠';
    if(g.vW.has(K('V',r,c))) return '会和别的墙相交';
  } else {
    if(g.vW.has(K('V',r,c))||g.vW.has(K('V',r-1,c))||g.vW.has(K('V',r+1,c))) return '会和别的墙重叠';
    if(g.hW.has(K('H',r,c))) return '会和别的墙相交';
  }
  const set=kind==='H'?g.hW:g.vW, key=K(kind,r,c);
  set.add(key);
  let why='不能落在这里';
  if(bfs(g,'P').dist<=0) why=(g.mode==='chase'?'会把你自己的路封死':'会把金球封死');
  else if(g.mode==='chase'?(pathLen(g,g.balls.A,g.balls.P).dist<=0):(bfs(g,'A').dist<=0))
    why=(g.mode==='chase'?'会把怪物的路彻底断掉':'会把对手封死');
  set.delete(key);
  return why;
}
function hasOptions(g,color){ return legalMoves(g,color).length>0 || g.wallsLeft[color]>0; }
/* 真正还有事可做吗：能走一步，或能落一面合法的墙。
   只看 hasOptions 会把「被围死但手里有墙」当成"还有招"，双方会互相空过到天荒地老；
   判僵局要用这个。 */
function hasRealOptions(g,color){
  if(legalMoves(g,color).length>0) return true;
  if(g.wallsLeft[color]<=0) return false;
  for(let r=0;r<g.H-1;r++)for(let c=0;c<g.W-1;c++)for(const kind of ['H','V']) if(validWall(g,kind,r,c)) return true;
  return false;
}
function reachedGoal(g,color){ return g.goals[color].some(gl=>gl.r===g.balls[color].r&&gl.c===g.balls[color].c); }

/* 墙位剪枝：只取「能切断这条路径上某一步」的墙，而不是全盘枚举所有墙位 */
function wallSlotsOnPath(path){
  const out=[], seen=new Set();
  const add=(kind,r,c)=>{ if(r<0||c<0) return; const k=K(kind,r,c); if(seen.has(k)) return; seen.add(k); out.push({kind,r,c}); };
  for(let i=0;i+1<path.length;i++){
    const a=path[i], b=path[i+1];
    if(a.r===b.r){ const c=Math.min(a.c,b.c); add('V',a.r,c); add('V',a.r-1,c); }   // 横向一步 → V 墙可断
    else         { const r=Math.min(a.r,b.r); add('H',r,a.c); add('H',r,a.c-1); }   // 纵向一步 → H 墙可断
  }
  return out;
}
/* AI 决策模块：纯逻辑，与表现层完全分离（禁止暴露思考过程） */
/* 追逐关怪物拦截点：玩家最短路的哪个比例处设卡（0.5=半程）。调平衡主要动这一个数与怪物站位 */
const CHASE_CUT=0.48;
const AI={
  decide(g,level){
    const cfg=level.aiConfig;
    /* 人设（可被回合事件动态切换，终局 Boss 靠这个做"三阶段"） */
    const persona=g.persona||cfg.persona||'race';
    const P=PERSONAS[persona]||PERSONAS.race;
    const wallCost=cfg.wallCost*P.wallK;
    const legal=legalMoves(g,'A');
    /* 追逐模式（2026-09 重做，方案①）：怪物与你同速，但会拦截——它奔向你到对岸
       最短路的"半程点"（略偏前），抢在你路过之前堵住去路。玩法从"赛跑"变成"堵路"：
       墙不再是可选项，而是唯一能改变怪物路线的手段——把它的拦截路线堵开，才能冲到对岸。
       旧版（每回合 2 格直追）实测"非黑即白"，已废弃（见 README 的实测记录）。 */
    if(g.mode==='chase'){
      const pp=bfs(g,'P');
      if(pp.path.length>1){
        const k=Math.min(pp.path.length-1,Math.max(1,Math.round(pp.path.length*CHASE_CUT)));
        const ap=pathLen(g,g.balls.A,pp.path[k]);
        if(ap.next) return {type:'move',to:ap.next};
      }
      const chase=pathLen(g,g.balls.A,g.balls.P);
      if(chase.next) return {type:'move',to:chase.next};
      if(legal.length) return {type:'move',to:legal[0]};
      return null;
    }
    /* 被围到无路可走（迷宫里对手堵住唯一通道就是这么回事）：
       手上还有墙就把墙用在最拖住对手的地方，别空过一回合 */
    if(!legal.length){
      if(g.wallsLeft.A<=0) return null;
      const op0=bfs(g,'P');
      let best=null, gain=0;
      for(const slot of wallSlotsOnPath(op0.path)){
        if(!validWall(g,slot.kind,slot.r,slot.c)) continue;
        const set=slot.kind==='H'?g.hW:g.vW, key=K(slot.kind,slot.r,slot.c);
        set.add(key);
        const op=bfs(g,'P').dist;
        set.delete(key);
        if(op-op0.dist>gain){ gain=op-op0.dist; best={type:'wall',kind:slot.kind,r:slot.r,c:slot.c}; }
      }
      return best;
    }

    /* 新手档（前 5 关）：只沿最短路推进，偶尔溜达，不放墙 */
    if(cfg.tier===0){
      const my=bfs(g,'A');
      const step=(my.next && legal.some(m=>m.r===my.next.r&&m.c===my.next.c))?my.next:null;
      if(step && Math.random()>=cfg.mistake) return {type:'move',to:step};
      return {type:'move',to:legal[Math.floor(Math.random()*legal.length)]};
    }

    /* 评估式：走子与放墙用同一把尺子打分，取最优。
       race/charger/builder/ambusher 用「对手距离 − 自己距离」；
       mirror 额外扣「与对手不同列」的惩罚 → 它会贴着你的路线走。 */
    const opNow=bfs(g,'P');
    const myNow=bfs(g,'A').dist;
    const pCol=g.balls.P.c;
    /* 强化档（每日挑战 / 拉满的 Boss）：更宽的墙候选 + 交换比评分 + 节奏判断 */
    /* 实测记录（2026-09-26）："更宽墙候选 / 节奏成本 / 允许自己慢一格"这三项改法，
       在每日挑战与主线各测一遍，胜率与常规档完全一致，其中"更宽墙候选"还会被
       "看起来有用、实际没用"的墙骗到（对直线冲刺玩家 1/6 → 3/6，更差）。
       所以这里保持常规评分，难度靠"档位拉满 + 关卡加难"来给。 */

    const cands=[];
    for(const m of legal){
      const save=g.balls.A;
      const res=resolveSpecial(g,'A',save,m);      /* 机关会把人再带一段，按最终落点评估 */
      g.balls.A={r:res.r,c:res.c};
      const my=bfs(g,'A').dist;
      g.balls.A=save;
      const trapPen=(res.kind==='trap')?-1.2:(res.kind==='pickup'?0.6:0);    /* 陷阱丢墙是亏的，拆墙器是赚的 */
      /* 镜像型：以推进为主，贴列只当"同等推进时"的偏好——上限 0.9，保证它压不过一格的进度 */
      const score=(persona==='mirror')
        ? (-my-Math.min(0.9,Math.abs(m.c-pCol)*0.3))
        : (opNow.dist-my);
      cands.push({score:score+trapPen, act:{type:'move',to:m}, isMove:true});
    }
    if(g.wallsLeft.A>0){
      /* 强化档在"所有最短路经过的格子"旁边找墙（能挖到真正的窄口），常规档只看一条路径 */
      const slots=wallSlotsOnPath(opNow.path);
      for(const slot of slots){
        if(!validWall(g,slot.kind,slot.r,slot.c)) continue;
        const key=K(slot.kind,slot.r,slot.c), set=slot.kind==='H'?g.hW:g.vW;
        set.add(key);
        const op=bfs(g,'P').dist, my=bfs(g,'A').dist;
        /* 别把自己砌进墙里：这手墙落下后如果自己一步都走不了，就不要它 */
        const selfStuck=legalMoves(g,'A').length===0;
        set.delete(key);
        /* 两条硬约束，避免"为了堵远处的对手把自己关进绕路里"：
           ① 这堵墙必须真的把对手推开（筑墙型允许只推 1 格，其余要 2 格）；
           ② 常规档绝不拖慢自己；强化档允许"慢 1 格换对手慢 3 格"这种等价交换。 */
        if(selfStuck) continue;
        if(op-opNow.dist<P.gain) continue;
        if(my>myNow) continue;
        cands.push({score:op-my-wallCost, act:{type:'wall',kind:slot.kind,r:slot.r,c:slot.c}, isMove:false});
      }
    }
    /* 分高者优先；同分先走子（省墙、也避免无意义地来回放） */
    cands.sort((a,b)=>(b.score-a.score)||(a.isMove?-1:1));
    const pool=Math.min(cands.length, 1+Math.round(cfg.noise*5));   // 噪声=在前几名里随机挑，0 则永远选最优
    return cands[Math.floor(Math.random()*pool)].act;
  }
};

/* ---------------- 关卡玩法编排（数据驱动） ----------------
   mode   玩法：race 相向竞速 / gate 门型（只有指定格算终点）/ sameSide 同起点同向 / sharedGate 共同终点
   terrain 地形：plain 平坦 / maze 回廊迷宫
   每章 15 关 = 9 经典 + 2 门型 + 2 迷宫 + 1 同起点 + 1 共同终点；章内最后一关预留给第二批的追逐关。
   第 1 章即新玩法首秀（便于教学），此后各章重复出现。 */
const MODE_PLAN_15   =['race','race','race','race','race','gate','race','race','race','sameSide','chase','race','gate','sharedGate','race'];
const TERRAIN_PLAN_15=['plain','plain','plain','plain','plain','plain','maze','plain','plain','plain','plain','maze','plain','plain','plain'];
const MODE_PLAN_10   =['race','race','chase','gate','race','race','sameSide','race','sharedGate','race'];
const TERRAIN_PLAN_10=['plain','plain','plain','plain','plain','maze','plain','plain','plain','plain'];

/* 回廊迷宫：每隔几行铺一道隔断，只在左侧或右侧留 2 格缺口，且左右交替
   → 走法被强制成蛇形绕行；缺口本身是全局咽喉，墙落在那里会被「双方必须可达」挡下 */
function mazeTerrain(level,g0,R){
  const {width:W,height:H}=level;
  const out=[];
  const isGoalCell=(r,c)=>level.goalCells.some(g=>g.r===r&&g.c===c)||level.aiGoalCells.some(g=>g.r===r&&g.c===c);
  const keep=(r,c)=>(r===level.startPosition.r&&c===level.startPosition.c)
                 ||(r===level.aiStartPosition.r&&c===level.aiStartPosition.c)||isGoalCell(r,c);
  const bars=Math.max(2,Math.floor((H-2)/3));
  let side=0;
  for(let i=1;i<=bars;i++){
    const r=Math.round(i*(H-1)/(bars+1));
    if(r<2||r>H-3) continue;
    const gap=(side++%2===0)?1:W-3;                 // 缺口左右交替，形成蛇形
    for(let c=0;c<W;c++){
      if(c===gap||c===gap+1) continue;
      if(keep(r,c)||g0.blocked.has(r+':'+c)) continue;
      g0.blocked.add(r+':'+c);
      if(bothOk(g0)) out.push({r,c});
      else g0.blocked.delete(r+':'+c);
    }
  }
  return out;
}

/* ---------------- 回合事件（数据驱动的基础设施） ----------------
   level.events = [{every:N, type:'shrink'|'shiftGate'|'phase', ...}]
   每回合 tick 一次。硬约束：任何事件都不能把某一方困死——所以每个事件内部
   都做「球不埋、目标格不埋、改完必须双方仍可达」三项检查，不通过就不改。 */
function tickEvents(g,level){
  if(!level.events||!level.events.length||g.over) return [];
  const fired=[];
  for(const ev of level.events){
    if(ev.every>0&&g.round%ev.every!==0) continue;
    if(ev.type==='shrink'){ const c=doShrink(g,ev.step); if(c&&c.length) fired.push({type:'shrink',n:c.length}); }
    else if(ev.type==='shiftGate'){ const c=doShiftGate(g); if(c) fired.push({type:'shiftGate'}); }
    else if(ev.type==='rain'){ const c=doRain(g,ev.step); if(c&&c.length) fired.push({type:'rain',n:c.length}); }
    else if(ev.type==='phase'){ const p=doPhase(g,ev); if(p) fired.push({type:'phase',persona:p}); }
  }
  return fired;
}
/* 岩浆收缩：左右两侧各涌上 step 列（step 越大越凶），把格子埋掉 */
function doShrink(g,step){
  const n=Math.max(1,step||1);
  const from=g.lavaDepth||0, to=from+n;
  g.lavaDepth=to;
  const added=[];
  for(let d=from;d<to;d++){
    for(const c of [d, g.W-1-d]){
      if(c<0||c>=g.W) continue;
      for(let r=0;r<g.H;r++){
        if(g.blocked.has(r+':'+c)) continue;
        if(r===g.balls.P.r&&c===g.balls.P.c) continue;              /* 不埋球 */
        if(r===g.balls.A.r&&c===g.balls.A.c) continue;
        if(g.goals.P.some(x=>x.r===r&&x.c===c)||g.goals.A.some(x=>x.r===r&&x.c===c)) continue;  /* 不埋目标格 */
        g.blocked.add(r+':'+c);
        if(bothOk(g)) added.push({r,c});
        else g.blocked.delete(r+':'+c);                              /* 会把谁困死就撤回 */
      }
    }
  }
  return added;
}
/* 定期落石：每 N 回合天上掉 step 颗障碍。随机落点，但球与目标格不埋，
   落下后必须双方仍可达（否则这颗作废）——与岩浆同一套安全底线。 */
function doRain(g,step){
  const n=Math.max(1,step||1);
  const added=[];
  for(let i=0;i<n*12&&added.length<n;i++){
    const r=Math.floor(Math.random()*g.H), c=Math.floor(Math.random()*g.W);
    if(g.blocked.has(r+':'+c)) continue;
    if(r===g.balls.P.r&&c===g.balls.P.c) continue;
    if(r===g.balls.A.r&&c===g.balls.A.c) continue;
    if(g.goals.P.some(x=>x.r===r&&x.c===c)||g.goals.A.some(x=>x.r===r&&x.c===c)) continue;
    g.blocked.add(r+':'+c);
    if(bothOk(g)) added.push({r,c});
    else g.blocked.delete(r+':'+c);
  }
  return added;
}
/* 门漂移：把玩家的门沿顶边挪到新位置（依次试，只挑双方都还能到的位置） */
function doShiftGate(g){
  const cells=g.goals.P;
  if(!cells.length) return null;
  const span=cells.length, cur=Math.min(...cells.map(c=>c.c));
  const old=cells.map(c=>({r:c.r,c:c.c}));
  for(let k=1;k<=g.W-span;k++){
    const c0=(cur+k)%(g.W-span+1);
    const next=[]; for(let i=0;i<span;i++) next.push({r:0,c:c0+i});
    if(next.some(n=>g.blocked.has(n.r+':'+n.c))) continue;
    g.goals.P=next;
    if(bfs(g,'P').dist>0&&(g.goals.A.length===0||bfs(g,'A').dist>0)) return next;
    g.goals.P=old;
  }
  return null;
}
/* 阶段切换：换一套 AI 人设（终局 Boss 用） */
function doPhase(g,ev){
  const list=ev.list||[];
  if(!list.length) return null;
  g.phaseIdx=(g.phaseIdx||0)+1;
  g.persona=list[g.phaseIdx%list.length];
  return g.persona;
}

/* ---------------- AI 的追逐拦截辅助 ----------------
   纯计算、无副作用：给"怪物抄近路拦截"算一张距离场。 */
/* ---------------- 特殊格（数据在 level.specialCells） ----------------
   四种机关，规则都只有一句话：
     portal 传送门：踩上立刻传到配对的那扇
     boost  加速带：踩上沿原方向再滑一格（不穿墙）
     spring 弹簧　：踩上沿原方向弹两格，可以越过墙与障碍（唯一能越墙的手段）
     trap   陷阱　：踩上丢 2 面墙
   设计底线：机关只提供"更快/更省"的可能，**不吃它也必须能过关**（有推演断言守着），
   也不改变棋盘连通性 —— 所以墙的合法性判断不受影响。 */
function specialAt(g,r,c){
  const list=g.specialCells;
  if(!list||!list.length) return null;
  for(const s of list) if(s.r===r&&s.c===c) return s;
  return null;
}
/* 落点能否站人：盘内、不是障碍、不是对方球 */
function canStand(g,r,c,color){
  if(r<0||r>=g.H||c<0||c>=g.W) return false;
  if(isBlockedCell(g,r,c)) return false;
  const other=g.balls[color==='P'?'A':'P'];
  if(other.r===r&&other.c===c) return false;
  return true;
}
/* 走一步（from→to）之后，机关把这一方带到哪里。返回最终落点与触发到的机关种类 */
function resolveSpecial(g,color,from,to){
  const s=specialAt(g,to.r,to.c);
  if(!s) return {r:to.r,c:to.c,kind:null};
  if(s.kind==='portal'){
    if(s.to&&canStand(g,s.to.r,s.to.c,color)) return {r:s.to.r,c:s.to.c,kind:'portal'};
    return {r:to.r,c:to.c,kind:null};
  }
  const dr=Math.sign(to.r-from.r), dc=Math.sign(to.c-from.c);
  if(s.kind==='boost'){
    const nr=to.r+dr, nc=to.c+dc;
    /* 加速带是滑行，不能穿墙 */
    if(canStand(g,nr,nc,color)&&!edgeBlocked(g,to,{r:nr,c:nc})) return {r:nr,c:nc,kind:'boost'};
    return {r:to.r,c:to.c,kind:'boost'};
  }
  if(s.kind==='spring'){
    const nr=to.r+dr*2, nc=to.c+dc*2;
    if(canStand(g,nr,nc,color)) return {r:nr,c:nc,kind:'spring'};   /* 越过中间那格（含墙/障碍） */
    const mr=to.r+dr, mc=to.c+dc;
    if(canStand(g,mr,mc,color)) return {r:mr,c:mc,kind:'spring'};
    return {r:to.r,c:to.c,kind:'spring'};
  }
  return {r:to.r,c:to.c,kind:s.kind};       /* trap：位置不变，落在原地结算 */
}
/* 机关落点带来的即时代价（目前只有陷阱：丢 2 面墙） */
function specialCost(res){
  if(res&&res.kind==='trap') return {walls:-2};
  return null;
}
/* 特殊格位置：程序生成 + 明确规则（都放在中线上，双方都可能经过，谁先占谁占便宜）
   障碍是随机撒的，所以候选位置要依次尝试，不能只试一个点。 */
function specialCellsFor(level,kind){
  if(!kind) return [];
  const W=level.width, H=level.height, mid=Math.floor(W/2);
  const out=[];
  const taken=(r,c)=>level.blockedCells.some(b=>b.r===r&&b.c===c)
    || (r===level.startPosition.r&&c===level.startPosition.c)
    || (r===level.aiStartPosition.r&&c===level.aiStartPosition.c)
    || level.goalCells.concat(level.aiGoalCells).some(x=>x.r===r&&x.c===c)
    || out.some(s=>s.r===r&&s.c===c);
  const put=(r,c)=>{
    if(r<1||r>H-2||c<0||c>=W) return null;
    if(taken(r,c)) return null;
    const cell={r,c,kind};
    out.push(cell); return cell;
  };
  if(kind==='portal'){
    /* 一上一下配成一对，同列：走上去直接被送到大半张棋盘之外 */
    for(let d=0;d<4&&out.length<2;d++){
      const c=Math.min(Math.max(1,mid-d),W-2);
      const a=put(H-3,c), b=put(2,c);
      if(a&&b){ a.to={r:b.r,c:b.c}; b.to={r:a.r,c:a.c}; }
      else { if(a) out.pop(); if(b) out.pop(); }
    }
  } else if(kind==='boost'){
    /* 中线上一串加速带 */
    for(const r of [3,Math.floor(H/2),H-4]) put(r,mid);
    if(out.length<2) for(const r of [3,Math.floor(H/2),H-4,Math.floor(H/3)]) put(r,Math.min(W-2,mid+1));
  } else if(kind==='spring'){
    for(let d=0;d<3&&out.length<2;d++){
      put(H-4,Math.max(1,mid-2+d));
      put(Math.max(1,H-6),Math.min(W-2,mid+2-d));
    }
  } else if(kind==='trap'){
    put(Math.floor(H/2),Math.max(0,mid-1)); put(Math.floor(H/2),Math.min(W-1,mid+1)); put(Math.max(1,Math.floor(H/2)-1),mid);
    if(out.length<2) for(let d=1;d<3;d++) put(Math.floor(H/2)+1,Math.min(W-1,mid+d));
  } else if(kind==='pickup'){
    /* 拆墙器：踩上多 1 面墙。摆在必经之路的旁边——绕开还是顺路捾由你决定 */
    put(Math.floor(H/2),Math.max(1,mid-2)); put(Math.floor(H/2),Math.min(W-2,mid+2));
    if(out.length<2){ put(Math.max(1,Math.floor(H/2)-2),mid); put(Math.min(H-2,Math.floor(H/2)+2),mid); }
  }
  return out;
}
/* 特殊格关卡编排：第 2~5 章各两关（首秀 + 进阶），最后一章的 Boss 用传送门做文章 */
const SPECIAL_PLAN={ 22:'portal', 23:'portal', 37:'boost', 38:'boost', 52:'spring', 53:'spring', 67:'trap', 68:'trap', 82:'pickup', 83:'pickup', 90:'portal' };

/* AI 人设：同一个评估框架，换权重与取向，就能让 Boss 有"性格"而不是只有"强度" */
const PERSONAS={
  race:    {name:'竞速型', note:'攻守均衡，稳扎稳打',  wallK:1.0,  gain:2},

  ambusher:{name:'埋伏型', note:'先在自己半场布墙',    wallK:0.5,  gain:2},
};

/* 章节 Boss：每章最后一关。纯数据的组合 + 回合事件，各自只突出一个新变量。 */
const BOSSES={

     note:'守卫先在自己半场布好墙，等你送上门。', counter:'它的墙都在自己那半场，从侧面绕。'},
  5:{name:'熔岩收缩', walls:14, aiWalls:12, persona:'charger', events:[{type:'shrink',every:3,step:2}],
     note:'每 3 回合两侧岩浆各涌上两列，棋盘越来越窄。', counter:'别在两侧磨蹭，越晚路越少。'},
  6:{name:'天空之门', mode:'gate', aiWalls:12, persona:'mirror', events:[{type:'shiftGate',every:3}],
     note:'每 3 回合那扇门会换位置。', counter:'别死盯一条路线，门会跑。'},

/* 双方是否都还能行动：
   普通关 = 双方都能到各自终点；追逐关 = 玩家能到终点 且 怪物还能走到玩家（否则堵死怪物就没意义了） */
function bothOk(g){
  if(g.mode==='chase') return bfs(g,'P').dist>0 && pathLen(g,g.balls.A,g.balls.P).dist>0;
  return bfs(g,'P').dist>0 && bfs(g,'A').dist>0;
}
/* ---------------- 自定义关卡：编解码 / 校验 ----------------
   分享码用「字符网格」而不是 JSON+base64：短、可读、能直接塞进 URL 与微信消息。
   格式： 1<玩法 r/g/s/c/h><宽>x<高><对手档 0-3>_<网格每行>_<墙>_<我方目标>_<对手目标>
   网格字符： . 空  * 障碍  P 我方起点  A 对手起点  1/2 传送门（成对）  3 加速带  4 弹簧  5 陷阱
   目标与墙单独成段（每格/每面 2~3 个 base36 字符）—— 因为一个格子可能既是目标又是
   别人的起点（例如相向竞速里对手起点就在我方目标行上），塞进同一个网格会互相覆盖。 */
const LevelCode={
  CELL:{empty:'.',block:'*',startP:'P',startA:'A',boost:'3',spring:'4',trap:'5',pickup:'6'},
  CH2MODE:{r:'race',g:'gate',s:'sameSide',c:'sharedGate',h:'chase'},
  MODE2CH:{race:'r',gate:'g',sameSide:'s',sharedGate:'c',chase:'h'},
  encode(level){
    const B=new Set(level.blockedCells.map(c=>c.r+':'+c.c));
    const spOn=(r,c)=>(level.specialCells||[]).find(s=>s.r===r&&s.c===c);
    const portals=(level.specialCells||[]).filter(s=>s.kind==='portal');
    const pTag=new Map();
    portals.forEach((s,i)=>pTag.set(s.r+':'+s.c, i===0?'1':'2'));
    const rows=[];
    for(let r=0;r<level.height;r++){
      let line='';
      for(let c=0;c<level.width;c++){
        const k=r+':'+c;
        let ch=this.CELL.empty;
        if(r===level.startPosition.r&&c===level.startPosition.c) ch=this.CELL.startP;
        else if(r===level.aiStartPosition.r&&c===level.aiStartPosition.c) ch=this.CELL.startA;
        else if(B.has(k)) ch=this.CELL.block;
        else {
          const sp=spOn(r,c);
          if(sp) ch=(sp.kind==='portal')?(pTag.get(k)||'1'):this.CELL[sp.kind];
        }
        line+=ch;
      }
      rows.push(line);
    }
    const cells=list=>list.map(x=>x.r.toString(36)+x.c.toString(36)).join('');
    const walls=(level.preWalls||[]).map(w=>(w.kind==='H'?'p':'q')+w.r.toString(36)+w.c.toString(36)).join('');
    const ai=(level.aiTier===undefined)?1:level.aiTier;
    return '1'+this.MODE2CH[level.mode]+level.width+'x'+level.height+ai+'_'
      +rows.join('_')+'_'+walls+'_'+cells(level.goalCells)+'_'+cells(level.aiGoalCells||[]);
  },
  decode(code){
    if(typeof code!=='string'||code.length>4000) return null;
    const m=code.match(/^1([rgsch])(\d{1,2})x(\d{1,2})(\d)_([^]*)$/);
    if(!m) return null;
    const mode=this.CH2MODE[m[1]], W=+m[2], H=+m[3], aiTier=+m[4];
    if(!mode||W<5||W>15||H<5||H>15||aiTier>3) return null;
    const parts=m[5].split('_');
    if(parts.length<H+3) return null;
    const rows=parts.slice(0,H), wallsStr=parts[H]||'', goalStr=parts[H+1]||'', aiGoalStr=parts[H+2]||'';
    if(rows.some(r=>r.length!==W)) return null;
    const blockedCells=[], goalCells=[], aiGoalCells=[], specialCells=[], portals=[];
    let start=null, aiStart=null;
    for(let r=0;r<H;r++)for(let c=0;c<W;c++){
      const ch=rows[r][c];
      if(ch===this.CELL.block) blockedCells.push({r,c});
      else if(ch===this.CELL.startP) start={r,c};
      else if(ch===this.CELL.startA) aiStart={r,c};
      else if(ch==='1'||ch==='2') portals.push({r,c});
      else if(ch===this.CELL.boost||ch===this.CELL.spring||ch===this.CELL.trap||ch===this.CELL.pickup){
        const kind=ch===this.CELL.boost?'boost':(ch===this.CELL.spring?'spring':(ch===this.CELL.trap?'trap':'pickup'));
        specialCells.push({r,c,kind});
      }
      else if(ch!==this.CELL.empty) return null;                /* 出现未知字符：码被改过 */
    }
    const readCells=(s,out)=>{
      if(s.length%2) return false;
      for(let i=0;i<s.length;i+=2){
        const r=parseInt(s[i],36), c=parseInt(s[i+1],36);
        if(!(r>=0)||!(c>=0)||r>=H||c>=W) return false;
        out.push({r,c});
      }
      return true;
    };
    if(!readCells(goalStr,goalCells)||!readCells(aiGoalStr,aiGoalCells)) return null;
    if(!start||!aiStart||!goalCells.length) return null;
    if(mode!=='chase'&&!aiGoalCells.length) return null;
    if(goalCells.some(c=>blockedCells.some(b=>b.r===c.r&&b.c===c.c))) return null;
    if(portals.length!==0&&portals.length!==2) return null;      /* 传送门要么没有，要么正好一对 */
    if(portals.length===2){
      const A=portals[0], Bp=portals[1];
      if(A.r===Bp.r&&A.c===Bp.c) return null;
      specialCells.push({r:A.r,c:A.c,kind:'portal',to:{r:Bp.r,c:Bp.c}});
      specialCells.push({r:Bp.r,c:Bp.c,kind:'portal',to:{r:A.r,c:A.c}});
    }
    const preWalls=[];
    for(let i=0;i+2<wallsStr.length;i+=3){
      const kind=wallsStr[i]==='p'?'H':(wallsStr[i]==='q'?'V':null);
      if(!kind) return null;
      const r=parseInt(wallsStr[i+1],36), c=parseInt(wallsStr[i+2],36);
      if(!(r>=0)||!(c>=0)||r>H-2||c>W-2) return null;
      preWalls.push({kind,r,c});
    }
    const level=makeCustomLevel({mode,W,H,aiTier,start,aiStart,goalCells,aiGoalCells,blockedCells,preWalls,specialCells});
    return levelValid(level)?level:null;
  },
};
/* 把解析出来的数据补全成一个可玩的关卡对象（规则字段与内置关卡同构） */
function makeCustomLevel(p){
  const tier=[{tier:0,mistake:0.25,noise:0,wallCost:99,budget:4},
              {tier:1,mistake:0.10,noise:0.30,wallCost:0.7,budget:8},
              {tier:1,mistake:0.02,noise:0.10,wallCost:0.4,budget:10},
              {tier:1,mistake:0,noise:0,wallCost:0.15,budget:10}][p.aiTier]||[1];
  const g0={W:p.W,H:p.H,mode:p.mode,blocked:new Set(p.blockedCells.map(c=>c.r+':'+c.c)),
            hW:new Set(),vW:new Set(),balls:{P:p.start,A:p.aiStart},goals:{P:p.goalCells,A:p.aiGoalCells}};
  (p.preWalls||[]).forEach(w=>(w.kind==='H'?g0.hW:g0.vW).add(K(w.kind,w.r,w.c)));
  const d=bfs(g0,'P').dist;
  const kindOf=(p.specialCells||[]).find(s=>s.kind!=='portal');
  return {
    id:'c', chapterId:0, index:0, name:'自定义关卡', mode:p.mode, terrain:'plain',
    isBoss:false, bossName:'', bossNote:'', bossCounter:'', events:null,
    custom:true, aiTier:p.aiTier,
    chaseSteps:p.mode==='chase'?2:0,
    width:p.W, height:p.H,
    startPosition:p.start, aiStartPosition:p.aiStart,
    goalCells:p.goalCells, aiGoalCells:p.aiGoalCells||[],
    blockedCells:p.blockedCells, preWalls:p.preWalls||[],
    wallRules:{len:2, quota:{P:10, A:10}},
    aiConfig:{budget:tier.budget, tier:tier.tier, mistake:tier.mistake, noise:tier.noise,
              wallCost:tier.wallCost, persona:'race', skin:0},
    starRules:{par2:d+6, par3:d+3},
    visualTheme:'forest',
    specialKind:kindOf?kindOf.kind:(p.specialCells&&p.specialCells.length?'portal':''),
    specialCells:p.specialCells||[],
  };
}
/* 完整性校验：起点终点齐、墙不重叠、双方都还能行动 */
function levelValid(level){
  if(!level||!level.goalCells.length) return false;
  if(level.mode!=='chase'&&!level.aiGoalCells.length) return false;
  const g=makeGame(level);
  const seen=new Set();
  for(const w of level.preWalls){
    const k=K(w.kind,w.r,w.c);
    if(seen.has(k)) return false;
    seen.add(k);
  }
  if(isBlockedCell(g,level.startPosition.r,level.startPosition.c)) return false;
  if(isBlockedCell(g,level.aiStartPosition.r,level.aiStartPosition.c)) return false;
  return bothOk(g);
}

/* 关卡生成（含棋盘/预置墙/障碍/AI/星级规则） */
function buildLevels(){
  let id=1;
  CHAPTERS.forEach((ch,ci)=>{
    for(let i=0;i<ch.count;i++){
      const [W,H]=ch.size(i+1);
      let mode   =(ch.count>=15?MODE_PLAN_15:MODE_PLAN_10)[i]||'race';
      let terrain=(ch.count>=15?TERRAIN_PLAN_15:TERRAIN_PLAN_10)[i]||'plain';
      const isBoss=(i===ch.count-1);              /* 每章最后一关是 Boss */
      const B=isBoss?BOSSES[ch.id]:null;
      if(B){
        if(B.mode) mode=B.mode;
        if(B.terrain) terrain=B.terrain;
      }
      /* 起点与目标按玩法生成（引擎直接读 goalCells，所以这里就是规则的唯一出处） */
      const mid=Math.floor(W/2);
      const rowOf=r=>{ const a=[]; for(let c=0;c<W;c++) a.push({r,c}); return a; };
      const gateOf=r=>{ const c0=Math.max(0,Math.floor((W-2)/2)); return [{r,c:c0},{r,c:c0+1}]; };
      let startPosition={r:H-1,c:mid}, aiStartPosition={r:0,c:mid};
      let goalCells, aiGoalCells;
      if(mode==='sameSide'){                                 // 并排同侧出发，抢同一侧
        startPosition   ={r:H-1,c:Math.max(1,mid-2)};
        aiStartPosition ={r:H-1,c:Math.min(W-2,mid+2)};
        goalCells=rowOf(0); aiGoalCells=rowOf(0);
      } else if(mode==='sharedGate'){                        // 起点不同，抢同一扇门
        startPosition   ={r:H-1,c:1};
        aiStartPosition ={r:H-1,c:W-2};
        goalCells=gateOf(0); aiGoalCells=gateOf(0);
        if(B&&B.doors===2){                                  /* Boss：左右各一扇门，都算终点 */
          goalCells=[{r:0,c:1},{r:0,c:2},{r:0,c:W-3},{r:0,c:W-2}];
          aiGoalCells=goalCells.map(x=>({...x}));
        }
      } else if(mode==='chase'){
        /* 追逐关（重做后）：你从左下角起跑，怪物就守在棋盘中央——它与你同速但会拦截，
           守在中央才能抢到你去对岸的半程点。太靠角落的话它永远只能尾随，这关就形同虚设。 */
        startPosition   ={r:H-1,c:1};
        aiStartPosition ={r:Math.floor(H/2),c:Math.floor(W/2)};
        goalCells=rowOf(0); aiGoalCells=[];
      } else if(mode==='gate'){                              // 相向竞速，但终点收窄成门
        /* 起点放在对角：否则「起点在中央 + 门在中央」会让双方开局就站在对手的门上 */
        startPosition   ={r:H-1,c:1};
        aiStartPosition ={r:0,c:W-2};
        goalCells=gateOf(0); aiGoalCells=gateOf(H-1);
      } else {                                               // 经典：整条边线都算
        goalCells=rowOf(0); aiGoalCells=rowOf(H-1);
      }
      const level={
        id, chapterId:ch.id, index:i, name:'第'+id+'关', mode, terrain,
        isBoss:!!B, bossName:B?B.name:'', bossNote:B?B.note:'', bossCounter:B?B.counter:'',
        events:B&&B.events?B.events.map(e=>({...e})):null,
        chaseSteps:(mode==='chase')?1:0,
        width:W, height:H,
        startPosition, aiStartPosition,
        goalCells, aiGoalCells,
        blockedCells:[], preWalls:[],
        /* 追逐关给足墙：墙是唯一能拖住怪物的手段 */
        wallRules:{len:2, quota:{P:(mode==='chase')?15:(B&&B.walls?B.walls:WALL_QUOTA_P), A:0}},
        aiConfig:{ budget:0, tier:1, mistake:0, noise:0, wallCost:0.5, persona:B&&B.persona?B.persona:'race', skin:ci },
        starRules:{par2:0, par3:0},
        visualTheme:ch.theme,
        specialKind:SPECIAL_PLAN[id]||'',       // 特殊格编排（见 SPECIAL_PLAN）
        specialCells:[],                        // 特殊区域/传送/加速带/弹簧/陷阱
      };
      /* AI 强度曲线（数据化）：
         · 1-5 关新手档：只沿最短路推进、会偶尔走错、完全不放墙 —— 让新手先摸清规则；
         · 6 关起换成评估式 AI：按「对手距离 − 自己距离」选最优动作，会堵前路、会冲刺；
         · 犯错率 20 关归零、决策噪声 40 关归零、墙的代价 60 关降到最低 → 后面几近满强度。 */
      /* AI 强度：Boss 走自己的曲线（按章逼近满强度 + 人设），普通关走平滑曲线 */
      const t=id/100;
      if(mode==='chase'){
  /* 追逐关的怪物行为固定（同速拦截、每回合 1 格），强度参数用不上 */
        level.aiConfig.tier=1; level.aiConfig.mistake=0; level.aiConfig.noise=0;
        level.aiConfig.wallCost=99; level.aiConfig.budget=0; level.aiConfig.persona='race';
      } else if(B){
        level.aiConfig.tier    = 1;
        level.aiConfig.mistake = 0.05;
        level.aiConfig.noise   = clamp(0.28-ch.id*0.03,0.02,0.28);
        level.aiConfig.wallCost= clamp(0.62-ch.id*0.06,0.18,0.62);
        level.aiConfig.budget  = Math.min(level.wallRules.quota.P, B.aiWalls||Math.min(WALL_QUOTA_P,Math.round(4+6*t)));
      } else {
        level.aiConfig.budget = Math.min(WALL_QUOTA_P, Math.round(3+7*t));
        if(id<=5){
          level.aiConfig.tier    = 0;
          level.aiConfig.mistake = 0.32-id*0.02;                        // 约 30% → 22%
          level.aiConfig.noise   = 0;
          level.aiConfig.wallCost= 99;                                  // 新手关不放墙
        } else {
          level.aiConfig.tier    = 1;
          level.aiConfig.mistake = clamp(0.18-(id-5)*0.012,0,0.18);     // 第 20 关起不再犯错
          level.aiConfig.noise   = clamp(0.5-(id-5)*0.0143,0,0.5);      // 第 40 关起永远选最优
          level.aiConfig.wallCost= clamp(0.85-(id-5)*0.012,0.15,0.85);  // 第 60 关起最爱封路
        }
      }
      /* 地形 + 预置墙：种子随机 + 逐个可达性校验
         迷宫关交给回廊生成器；其余关卡从第 16 关起少量撒障碍（前 5 关保持空盘教学） */
      const g0=makeGame(level);
      const R=rng(id*7919+17);
      /* 追逐关：预置墙要少、不撒随机障碍 —— 这关考的是怎么甩开怪物，不是怎么绕开墙 */
      const want=(B&&B.preset)?B.preset:(mode==='chase'?Math.min(3,Math.floor((id-1)/20)):Math.min(10,Math.floor((id-1)/6)));
      for(let t2=0,placed=0; t2<600&&placed<want; t2++){
        const kind=R()<0.5?'H':'V';
        const r=Math.floor(R()*(H-1)), c=Math.floor(R()*(W-1));
        if(validWall(g0,kind,r,c)){ (kind==='H'?g0.hW:g0.vW).add(K(kind,r,c)); placed++; level.preWalls.push({kind,r,c}); }
      }
      if(terrain==='maze'){
        level.blockedCells=mazeTerrain(level,g0,R);
      } else if(id>=16&&mode!=='chase'){
        const nb=Math.min(6,Math.floor((id-10)/12));
        for(let t2=0,placed=0; t2<300&&placed<nb; t2++){
          const r=2+Math.floor(R()*(H-4)), c=1+Math.floor(R()*(W-2));
          if(g0.blocked.has(r+':'+c)) continue;
          if((r===level.startPosition.r&&c===level.startPosition.c)||(r===level.aiStartPosition.r&&c===level.aiStartPosition.c)) continue;
          g0.blocked.add(r+':'+c);
          if(bothOk(g0)){ level.blockedCells.push({r,c}); placed++; }
          else g0.blocked.delete(r+':'+c);
        }
      }
      /* 中段铺回合事件（每章至少 1 关），全部复用已验证的事件基础设施：
         · 每章的门关（15 关编排的第 13 关）带「门漂移」——门会跑，别死盯一条路线；
         · 第 3/5/7 章的经典关带「定期落石」——盘面会慢慢变窄，别在两侧磨蹭。
         Boss 与追逐关不叠加事件。 */
      if(!B&&mode!=='chase'){
        if(i===12) level.events=[{type:'shiftGate',every:4}];
        else if(((ch.id===3||ch.id===5)&&i===3)||(ch.id===7&&i===7)) level.events=[{type:'rain',every:5,step:2}];
      }
      /* 特殊格：机关只提供"更快/更省"的可能，生成在障碍与预置墙定好之后 */
      level.specialCells=specialCellsFor(level,level.specialKind);
      /* 星级基准：按真实最短路 +不同玩法的余量（门窄、要抢位，容错更宽） */
      const d=bfs(g0,'P').dist;
      const sl={race:[5,2],gate:[6,3],sameSide:[7,4],sharedGate:[7,4]}[mode]||[5,2];
      const tz=(terrain==='maze'?2:0)+(B?2:0);
      level.starRules={par2:d+sl[0]+tz, par3:d+sl[1]+tz};
      level.wallRules.quota.A=level.aiConfig.budget;
      LEVELS.push(level);
      id++;
    }
  });
  /* 关卡图：默认链式 + 章节分支/合并 */
  let base=1;
  CHAPTERS.forEach(ch=>{
    const s=base, e=base+ch.count-1;
    for(let i=s;i<e;i++) EDGES.push({from:i,to:i+1});
    if(ch.branch){
      const sp=s+ch.branch.split;
      EDGES.push({from:sp,to:sp+2});             // 分支
      EDGES.push({from:sp+1,to:sp+3});           // 合并
      const idx=EDGES.findIndex(x=>x.from===sp+1&&x.to===sp+2);
      if(idx>-1) EDGES.splice(idx,1);
      const det=LEVELS.find(l=>l.id===sp+2); if(det) det.isDetour=true;
    }
    base=e+1;
  });
}
/* 地图布局：蛇形道路 + 分支岔道（每次渲染重建，先清空避免累积） */
function buildMapLayout(){
  NODES.length=0; ZONES.length=0;
  const MW=800, zonePadTop=120, rowGap=158, sidePad=150;
  let y=0;
  CHAPTERS.forEach((ch,ci)=>{
    const rows=ch.rows, z={ch, y0:y, y1:y+zonePadTop+(rows.length-1)*rowGap+180, idx:ci};
    ZONES.push(z);
    const firstId=LEVELS.find(l=>l.chapterId===ch.id).id;
    let n=0;
    for(let ri=0;ri<rows.length;ri++){
      const count=rows[ri];
      const ry=z.y0+zonePadTop+ri*rowGap;
      for(let i=0;i<count;i++){
        const lv=LEVELS[firstId-1+n];
        const t=count>1? i/(count-1):0.5;
        let x=sidePad+t*(MW-sidePad*2);
        if(ri%2===1) x=MW-x;                       // 蛇形往返
        const R=rng(lv.id*613+3);
        x+=(R()-0.5)*36;
        let yy=ry+(R()-0.5)*26;
        if(lv.isDetour){ x=clamp(x+((x<MW/2)?-160:160),90,MW-90); yy+=72; }
        NODES.push({id:lv.id, x, y:yy, zone:ci, detour:!!lv.isDetour});
        n++;
      }
    }
    y=z.y1+26;
  });
  return y+70;   // 总高
}

/* ---------------- 存档 ---------------- */
const Save={
  key:'dreamquest.save.v1',
  data:{v:1, name:'冒险者', records:{}},
  load(){ try{ const raw=localStorage.getItem(this.key); if(raw) this.data=Object.assign(this.data,JSON.parse(raw)); }catch(e){} },
  write(){ try{ localStorage.setItem(this.key,JSON.stringify(this.data)); }catch(e){} },
  rec(id){ return this.data.records[id]||null; },
  done(id){ const r=this.rec(id); return !!(r&&r.stars>=1); },
  record(id,stats){
    const old=this.rec(id);
    const better=!old || stats.stars>old.stars
      || (stats.stars===old.stars&&stats.rounds<old.rounds);
    if(better){ this.data.records[id]={...stats, at:Date.now()}; this.write(); }
    return better;
  },
};
/* ---------------- Stats：难度与失败统计（本地） ----------------
   只统计单人关卡（双人同屏不进这里）。用途有两个：
   ① 给玩家一张"我卡在哪"的热力图；② 给失败面板一句针对性的建议。
   注意这里是纯本地数据，跟星级存档（Save）分开存，互不影响。 */
const Stats={
  key:'dreamquest.stats.v1',
  data:{},
  load(){ try{ const raw=localStorage.getItem(this.key); if(raw) this.data=JSON.parse(raw)||{}; }catch(e){ this.data={}; } },
  write(){ try{ localStorage.setItem(this.key,JSON.stringify(this.data)); }catch(e){} },
  rec(id){ return this.data[id]||null; },
  record(id,{win,rounds,walls,skill}){
    const s=this.data[id]||{plays:0,wins:0,fails:0,best:0,sumRounds:0,sumWalls:0};
    s.plays++;
    if(win){ s.wins++; if(!s.best||rounds<s.best) s.best=rounds; } else { s.fails++; }
    s.sumRounds+=(rounds||0); s.sumWalls+=(walls||0); s.lastTs=Date.now();
    if(skill) s.lastSkill=skill;
    this.data[id]=s; this.write(); return s;
  },
  all(){ return this.data; },
  of(id){
    const s=this.rec(id); if(!s) return null;
    return Object.assign({},s,{winRate:s.wins/s.plays, avgRounds:s.sumRounds/s.plays, avgWalls:s.sumWalls/s.plays});
  },
  /* 颜色分档：0 未挑战 / 1 顺利 / 2 有点难 / 3 卡住 / 4 反复失败 */
  tier(s){
    if(!s||!s.plays) return 0;
    if(!s.fails) return 1;
    const rate=s.fails/s.plays;
    return rate<=0.34?2:(rate<=0.66?3:4);
  },
  hardest(n){
    return Object.keys(this.data).map(id=>({id:+id,fails:this.data[id].fails,plays:this.data[id].plays}))
      .filter(x=>x.plays>=2&&x.fails>0)
      .map(x=>Object.assign(x,{rate:x.fails/x.plays}))
      .sort((a,b)=>b.rate-a.rate||b.fails-a.fails).slice(0,n);
  },
  totals(){
    return Object.keys(this.data).reduce((a,id)=>{ a.plays+=this.data[id].plays; a.fails+=this.data[id].fails; return a; },{plays:0,fails:0});
  },
};
/* 失败原因 → 一句能马上照做的建议（按关卡机制分流，再按累计战绩补一句） */
function failAdvice(level,reason){
  let tip;
  if(reason==='caught') tip='怪物每回合走两格：提前一回合把墙放在它必经的窄口上，比事后逃更管用。';
  else if(reason==='stalemate') tip='两条路都被堵死了。别把棋盘彻底封上——僵局同样算失败。';
  else if(level.mode==='chase') tip='它比你快一倍，只能靠墙拉开距离：把墙放在它必须经过的拐角。';
  else if(level.isBoss) tip=level.bossCounter||'先别拼速度，看清这关的特殊规则。';
  else if(level.mode==='gate') tip='门只有两格：与其一路冲刺，不如先把门前那一行占住。';
  else if(level.mode==='sameSide'||level.mode==='sharedGate') tip='同路争抢：挡在对手前面，比抢速度划算。';
  else if(level.terrain==='maze') tip='回廊里绕路很亏：在缺口那一格堵住对手，让它也绕。';
  else tip='对手先到了：试着用一面墙封住它上行的那条列，比自己加速更划算。';
  const s=Stats.of(level.id);
  if(s&&s.fails>=3) tip+='（这关你已挑战 '+s.plays+' 次、成功 '+s.wins+' 次，别硬冲。）';
  return tip;
}
/* 单关战绩卡：数字 + 一句建议 + 再挑战 */
function LevelStatCard(id){
  const lv=LEVELS[id-1], s=Stats.of(id);
  const box=html('div','stat-card');
  const h=html('h2','','第 '+id+' 关 · '+(lv.isBoss?lv.bossName:modeTag(lv)));
  box.appendChild(h);
  if(!s){ box.appendChild(html('div','narr','还没挑战过这一关——去试试。')); }
  else {
    const grid=html('div','stats-grid');
    [['挑战次数',s.plays],['成功',s.wins],['失败',s.fails],
     ['最少步数',s.best||'—'],['平均步数',s.avgRounds.toFixed(1)],['平均用墙',s.avgWalls.toFixed(1)]].forEach(([k,v])=>{
      const d=html('div','stat'); d.innerHTML='<small>'+k+'</small><b>'+v+'</b>'; grid.appendChild(d);
    });
    box.appendChild(grid);
    box.appendChild(html('div','narr',levelAdvice(lv,s)));
  }
  const row=html('div','row');
  const go=html('button','btn primary','再挑战一次');
  go.onclick=()=>reroute('#/play/'+id);
  row.appendChild(go); box.appendChild(row);
  return box;
}
function levelAdvice(lv,s){
  const rate=s.fails/s.plays;
  if(lv.mode==='chase') return '怪物每回合两格、你一格——墙是唯一手段。它必经的窄口，提前一回合堵。';
  if(lv.mode==='gate') return '门只有两格：先占住门前那一行，比一路冲刺快。';
  if(lv.mode==='sameSide'||lv.mode==='sharedGate') return '同一条路线争抢：挡在对手前面比抢速度划算。';
  if(lv.terrain==='maze') return '回廊绕路太久：把墙下在缺口那一格，让对手也绕。';
  if(lv.isBoss) return 'Boss 关的特殊规则比速度更重要：'+(lv.bossCounter||'');
  if(rate>0.6) return '失败偏多：别急着冲，先用一两面墙把对手的上行路线收窄。';
  if(s.best) return '你已经走过 '+s.best+' 步通关——试着再省两步。';
  return '保持这个节奏。';
}
/* 难度热力图：7 行 100 格，颜色 = 失败率；点格子看单关战绩 */
function DifficultyHeatmap(){
  const box=html('div','paper heat-box');
  const h=html('div','page-head'); h.style.margin='0 0 8px';
  h.innerHTML='<h1 style="font-size:17px">难度热力图 · 我在哪卡住</h1>';
  box.appendChild(h);
  const tot=Stats.totals(), hard=Stats.hardest(3);
  const sum=html('div','heat-sum');
  sum.innerHTML='共挑战 <b>'+tot.plays+'</b> 次 · 失败 <b>'+tot.fails+'</b> 次'
    +(hard.length?(' · 最难：'+hard.map(x=>'第 '+x.id+' 关').join('、')):' · 还没有反复失败的关');
  box.appendChild(sum);
  const grid=html('div','heat-grid');
  const detail=html('div','heat-detail');
  const showDetail=id=>{
    detail.innerHTML='';
    detail.appendChild(LevelStatCard(id));
    [...grid.querySelectorAll('.heat-cell')].forEach(c=>c.classList.toggle('on',+c.dataset.id===id));
  };
  CHAPTERS.forEach(ch=>{
    const row=html('div','heat-row');
    row.appendChild(html('div','heat-lab',ch.id+' · '+ch.name));
    const cells=html('div','heat-cells');
    LEVELS.filter(l=>l.chapterId===ch.id).forEach(l=>{
      const s=Stats.rec(l.id);
      const cell=html('button','heat-cell t'+Stats.tier(s));
      cell.dataset.id=l.id; cell.textContent=l.id;
      cell.title='第 '+l.id+' 关 · 挑战 '+(s?s.plays:0)+' 次 · 失败 '+(s?s.fails:0)+' 次';
      cell.onclick=()=>showDetail(l.id);
      cells.appendChild(cell);
    });
    row.appendChild(cells);
    grid.appendChild(row);
  });
  box.appendChild(grid);
  const legend=html('div','heat-legend');
  [['t0','未挑战'],['t1','顺利'],['t2','有点难'],['t3','卡住'],['t4','反复失败']].forEach(([c,t])=>{
    const it=html('span','lg-item');
    const sw=html('i','lg-sw '+c);
    it.appendChild(sw); it.appendChild(document.createTextNode(t));
    legend.appendChild(it);
  });
  box.appendChild(legend);
  box.appendChild(detail);
  showDetail(hard.length?hard[0].id:currentLevelId());
  return box;
}
function predsOf(id){ return EDGES.filter(e=>e.to===id).map(e=>e.from); }
function isUnlocked(id){
  if(id===1||Save.done(id)) return true;
  return predsOf(id).some(p=>Save.done(p));
}
function currentLevelId(){
  for(const l of LEVELS){ if(isUnlocked(l.id)&&!Save.done(l.id)) return l.id; }
  return LEVELS.find(l=>isUnlocked(l.id)) ? LEVELS.find(l=>isUnlocked(l.id)).id : 1;
}
function progressStats(){
  let stars=0, done=0;
  LEVELS.forEach(l=>{ const r=Save.rec(l.id); if(r){ stars+=r.stars; if(r.stars>=1)done++; } });
  return {stars, done, total:LEVELS.length, maxStars:LEVELS.length*3};
}

/* ---------------- 每日挑战 ----------------
   同一天所有人拿到同一张图：日期 → 种子 → 用同一套生成器造关。
   纯前端，不需要服务端；成绩只存本地，不进主线存档与难度统计。 */
const Daily={
  key:'dreamquest.daily.v1',
  data:{},
  load(){ try{ const raw=localStorage.getItem(this.key); if(raw) this.data=JSON.parse(raw)||{}; }catch(e){ this.data={}; } },
  write(){ try{ localStorage.setItem(this.key,JSON.stringify(this.data)); }catch(e){} },
  todayKey(){ return dailyKey(new Date()); },
  rec(key){ return this.data[key]||null; },
  /* 记一笔：当天通关过就一直算通关，最好步数取更小的那个 */
  mark(key,rounds,win){
    const old=this.data[key]||{win:false,best:0,tries:0};
    const rec={win:old.win||!!win, best:(win&&rounds)?Math.min(old.best||999,rounds):old.best, tries:(old.tries||0)+1};
    this.data[key]=rec; this.write(); return rec;
  },
  streak(){ return dailyStreak(this.data,dailyKey(new Date())); },
  doneCount(){ return Object.keys(this.data).filter(k=>this.data[k].win||this.data[k].hellWin).length; },
};
function dailyKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dailySeedOf(key){
  let h=2166136261;
  for(let i=0;i<key.length;i++){ h^=key.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
/* 连续天数：从今天往前数连着通关的天数（今天还没打就从昨天起数；普通/地狱任一档通关都算） */
function dailyStreak(map,key){
  const day=new Date(key+'T12:00:00');
  let n=0;
  const won=k=>!!(map[k]&&(map[k].win||map[k].hellWin));
  if(!won(key)) day.setDate(day.getDate()-1);
  for(;;){
    const k=dailyKey(day);
    if(won(k)){ n++; day.setDate(day.getDate()-1); }
    else break;
    if(n>400) break;
  }
  return n;
}
/* 用日期种子造一张图：玩法/尺寸/机关都跟着日期变，并且保证一定可玩。
   双档难度（tier 0=普通 / 1=地狱）：
   · 普通（保底能赢）：对手「强而不狠」（mistake 2%、噪声 10%），障碍 3~6 颗，
     事件更稀（每 5 回合 1 步）——会放墙的玩家目标胜率 ~50%；
   · 地狱（核心玩家）：对手拉满（零犯错零噪声），障碍 6~10 颗，事件每 3 回合 2 步。
   两档玩法相同、棋盘略有不同；同一天同档全网同图（种子=日期+档位）。 */
function buildDailyLevel(key,tier){
  const hell=(tier===1);
  const seed=(dailySeedOf(key)+(hell?0x9E37:0))>>>0;
  for(let attempt=0;attempt<60;attempt++){
    const R=rng((seed+attempt*7919)>>>0);
    /* 尺寸偏大：每日挑战就是用来"卡住你"的 */
    const W=[9,11,11,13,13][Math.floor(R()*5)], H=(W===13?11:W);
    /* 追逐模式暂不进每日：等它重新设计过再放进来（见 README 的说明） */
    const mode=['race','gate','sameSide','sharedGate'][Math.floor(R()*4)];
    const mid=Math.floor(W/2);
    const p={mode,W,H,aiTier:hell?3:2,start:null,aiStart:null,goalCells:[],aiGoalCells:[],
      blockedCells:[],preWalls:[],specialCells:[]};
    if(mode==='race'){ p.goalCells=edRow(0,W); p.aiGoalCells=edRow(H-1,W); p.start={r:H-1,c:1}; p.aiStart={r:0,c:W-2}; }
    else if(mode==='gate'){ const cc=edCenter(W,2); p.goalCells=cc.map(c=>({r:0,c})); p.aiGoalCells=cc.map(c=>({r:H-1,c})); p.start={r:H-1,c:1}; p.aiStart={r:0,c:W-2}; }
    else if(mode==='sameSide'){ p.goalCells=edRow(0,W); p.aiGoalCells=edRow(0,W); p.start={r:H-1,c:Math.max(1,mid-2)}; p.aiStart={r:H-1,c:Math.min(W-2,mid+2)}; }
    else { const cc=edCenter(W,2); p.goalCells=cc.map(c=>({r:0,c})); p.aiGoalCells=cc.map(c=>({r:0,c})); p.start={r:H-1,c:1}; p.aiStart={r:H-1,c:W-2}; }
    /* 障碍：位置随机，但每放一颗都要确认双方还都能走（地狱 6~10 颗，普通 3~6 颗） */
    const g0={W,H,blocked:new Set(),hW:new Set(),vW:new Set(),balls:{P:p.start,A:p.aiStart},
      goals:{P:p.goalCells,A:p.aiGoalCells},mode};
    const nb=(hell?6:3)+Math.floor(R()*(hell?5:4));
    for(let t=0,cnt=0;t<200&&cnt<nb;t++){
      const r=1+Math.floor(R()*(H-2)), c=Math.floor(R()*W);
      if(g0.blocked.has(r+':'+c)) continue;
      if((r===p.start.r&&c===p.start.c)||(r===p.aiStart.r&&c===p.aiStart.c)) continue;
      if(p.goalCells.concat(p.aiGoalCells).some(x=>x.r===r&&x.c===c)) continue;
      g0.blocked.add(r+':'+c);
      if(bothOk(g0)){ p.blockedCells.push({r,c}); cnt++; }
      else g0.blocked.delete(r+':'+c);
    }
    /* 有几率加一种机关 */
    if(R()<0.45){
      const kind=['portal','boost','spring','trap','pickup'][Math.floor(R()*5)];
      p.specialCells=specialCellsFor({width:W,height:H,startPosition:p.start,aiStartPosition:p.aiStart,
        goalCells:p.goalCells,aiGoalCells:p.aiGoalCells,blockedCells:p.blockedCells},kind);
    }
    const lv=makeCustomLevel(p);
    lv.daily=true;
    lv.name='每日挑战 · '+key;
    lv.tier=hell?1:0;
    lv.dailyKey=key;
    lv.chapterId=0;
    /* 回合事件：地狱约 1/3 的日子带（每 3 回合 2 步）；普通更稀（每 5 回合 1 步） */
    if(R()<(hell?0.34:0.3)){
      const kinds=(mode==='gate'||mode==='sharedGate')?['shiftGate','shrink']:['shrink'];
      lv.events=[{type:kinds[Math.floor(R()*kinds.length)],every:hell?3:5,step:hell?2:1}];
    }
    if(!levelValid(lv)) continue;
    const dist=bfs(makeGame(lv),'P').dist;      /* 太短不好玩、太长太拖：路程要落在合理区间 */
    if(dist<6||dist>W*2) continue;
    return lv;
  }
  return null;
}

function computeStars(level,stats){
  const r=level.starRules;
  let s=1;
  if(stats.rounds<=r.par2) s=2;
  if(stats.rounds<=r.par3) s=3;
  return s;
}

    const x2=cx+Math.cos(rad)*r*1.5, y2=cy+Math.sin(rad)*r*1.5;
    const p1=cx+Math.cos(rad+0.22)*r*0.9, p2=cy+Math.sin(rad+0.22)*r*0.9;
    const p3=cx+Math.cos(rad-0.22)*r*0.9, p4=cy+Math.sin(rad-0.22)*r*0.9;
    el('path',{d:`M${p1} ${p2} L${x2} ${y2} L${p3} ${p4} Z`,fill:dark,stroke:dark,'stroke-width':1},g);
  }
  el('circle',{cx,cy,r,fill:body,stroke:dark,'stroke-width':2.5},g);
  el('ellipse',{cx:cx-r*0.34,cy:cy-r*0.16,rx:r*0.26,ry:r*0.3,fill:'#f6f1e4',stroke:dark,'stroke-width':1.6},g);
  el('ellipse',{cx:cx+r*0.34,cy:cy-r*0.16,rx:r*0.26,ry:r*0.3,fill:'#f6f1e4',stroke:dark,'stroke-width':1.6},g);
  el('circle',{cx:cx-r*0.3,cy:cy-r*0.1,r:r*0.12,fill:dark},g);
  el('circle',{cx:cx+r*0.38,cy:cy-r*0.1,r:r*0.12,fill:dark},g);
  /* 锯齿嘴 */
  let d=`M${cx-r*0.5} ${cy+r*0.42}`;
  for(let i=0;i<5;i++){ d+=` L${cx-r*0.5+(i+0.5)*r*0.2} ${cy+r*0.62} L${cx-r*0.5+(i+1)*r*0.2} ${cy+r*0.42}`; }
  el('path',{d,fill:'none',stroke:dark,'stroke-width':2,'stroke-linecap':'round'},g);
  return g;
}

/* ---------------- AdventureMap：世界地图 ---------------- */
function nodeShapeDrawing(g,shape,x,y,th,muted){

      break;
    case 'flower':
      for(let p=0;p<5;p++){ const a=p/5*Math.PI*2-Math.PI/2;

      el('circle',{cx:x,cy:y+2,r:4.5,fill:tone('#e6b455'),stroke:ink,'stroke-width':1.5},g);

    case 'chest':

      el('path',{d:`M${x-13} ${y-8} q13 -10 26 0`,fill:tone('#7d5a3a'),stroke:ink,'stroke-width':2},g);
      el('rect',{x:x-3,y:y-4,width:6,height:8,rx:2,fill:tone('#e6b455'),stroke:ink,'stroke-width':1.5},g);
      break;
    case 'crystal':
      el('path',{d:`M${x} ${y-18} l10 8 -4 18 -12 0 -4 -18 z`,fill:tone(th===THEMES.lava?'#ff9d5c':'#9ec8d8'),stroke:ink,'stroke-width':2,opacity:.95},g);
      el('path',{d:`M${x} ${y-18} l-4 26`,stroke:ink,'stroke-width':1.2,fill:'none',opacity:.5},g);
      break;
    case 'cave':
      el('path',{d:`M${x-17} ${y+12} a17 16 0 0 1 34 0 z`,fill:tone('#8f8468'),stroke:ink,'stroke-width':2},g);
      el('path',{d:`M${x-8} ${y+12} a8 10 0 0 1 16 0 z`,fill:'#3d3227'},g);
      break;
    case 'hut':
      el('rect',{x:x-13,y:y-4,width:26,height:17,rx:3,fill:tone('#d8c49a'),stroke:ink,'stroke-width':2},g);
      el('path',{d:`M${x-17} ${y-4} l17 -13 l17 13 z`,fill:tone('#c96f5e'),stroke:ink,'stroke-width':2},g);
      el('rect',{x:x-4,y:y+2,width:8,height:11,rx:2,fill:tone('#9c7550'),stroke:ink,'stroke-width':1.5},g);

    case 'tower':

      el('path',{d:`M${x-12} ${y-14} h24 l-12 -9 z`,fill:tone('#8a8175'),stroke:ink,'stroke-width':2},g);

      break;
