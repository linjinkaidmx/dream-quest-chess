function starPath(cx,cy,R,r){
  const pts=[];
  for(let i=0;i<10;i++){ const rad=i%2===0?R:r, a=-Math.PI/2+i*Math.PI/5;
    pts.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1)); }
  return 'M'+pts.join('L')+'Z';
}
function zoneScenery(root,zone){
  const th=THEMES[zone.ch.theme], z=zone;
  const R=rng(z.ch.id*991+5);
  const W=800;
  /* 地面 */
  el('rect',{x:0,y:z.y0,width:W,height:z.y1-z.y0,fill:th.zoneBg},root);
  el('ellipse',{cx:W*0.25,cy:z.y1,rx:400,ry:150,fill:th.ground,opacity:.55},root);
  el('ellipse',{cx:W*0.8,cy:z.y1+30,rx:430,ry:170,fill:th.ground,opacity:.7},root);
  const deco=(fn,n)=>{ for(let i=0;i<n;i++){ const x=40+R()*(W-80), y=z.y0+60+R()*(z.y1-z.y0-120); fn(x,y,i); } };
  if(z.ch.theme==='forest'||z.ch.theme==='mist'){
    deco((x,y)=>{ const sc=0.7+R()*0.6;
      el('path',{d:`M${x} ${y} l-9 ${26*sc} h18 z`,fill:th.ground,opacity:.8,stroke:'rgba(74,59,42,.35)','stroke-width':1.5},root);
      el('path',{d:`M${x-16*sc} ${y+2} q16 -22 32 0 z`,fill:z.ch.theme==='mist'?'#9fb3a3':'#5b8a5a',opacity:.85},root); },7);
  } else if(z.ch.theme==='valley'){
    deco((x,y)=>{ el('path',{d:`M${x} ${y+30} l14 -44 12 20 10 -28 16 52 z`,fill:'#b5a889',opacity:.7,stroke:'rgba(74,59,42,.3)','stroke-width':1.5},root); },5);
    deco((x,y)=>{ el('path',{d:`M${x-20} ${y} q20 -7 40 0`,fill:'none',stroke:'#fff','stroke-width':2,'stroke-linecap':'round',opacity:.5},root); },4);
  } else if(z.ch.theme==='castle'){
    deco((x,y)=>{ el('rect',{x:x-11,y:y-26,width:22,height:56,rx:3,fill:'#a49a8c',opacity:.75,stroke:'rgba(74,59,42,.35)','stroke-width':1.5},root);
      el('path',{d:`M${x-14} ${y-26} h28 l-14 -12 z`,fill:'#8a8175',opacity:.8},root); },4);
  } else if(z.ch.theme==='lava'){
    deco((x,y)=>{ el('path',{d:`M${x-16} ${y+10} l4 -16 10 -7 11 6 4 17 z`,fill:'#5f504c',opacity:.85},root); },6);
    deco((x,y)=>{ el('circle',{cx:x,cy:y,r:2.2,fill:'#ff9d5c',class:'goal-cell'},root); },8);
  } else if(z.ch.theme==='sky'){
    deco((x,y)=>{ el('ellipse',{cx:x,cy:y,rx:26+R()*16,ry:9,fill:'#fff',opacity:.85},root); },8);
    deco((x,y)=>{ el('ellipse',{cx:x,cy:y,rx:16,ry:6,fill:th.ground,opacity:.8},root);
      el('ellipse',{cx:x+4,cy:y-5,rx:9,ry:5,fill:th.ground,opacity:.7},root); },3);
  } else if(z.ch.theme==='star'){
    deco((x,y)=>{ el('circle',{cx:x,cy:y,r:1+R()*1.6,fill:'#ffe08a',opacity:.9},root); },26);
    deco((x,y)=>{ el('circle',{cx:x,cy:y,r:7,fill:'#b5a6d6',opacity:.18},root);
      el('circle',{cx:x,cy:y,r:2,fill:'#ffe08a',opacity:.8},root); },4);
  }
  /* 章节木牌（收窄到第一个节点之前，避免被节点光环/头像压住；文字超宽自动压缩到牌面内） */
  const sy=z.y0+58;
  const pw=112, px=6, cx=px+pw/2;
  el('rect',{x:cx-5,y:sy+10,width:10,height:44,rx:5,fill:'#8b6b4a',stroke:'#4a3b2a','stroke-width':2},root);
  const sign=el('g',{transform:'rotate(-2 '+cx+' '+sy+')'},root);
  el('rect',{x:px,y:sy-26,width:pw,height:44,rx:9,fill:'#e9d9b4',stroke:'#6b4f35','stroke-width':2.5},sign);
  const t1=el('text',{x:cx,y:sy-8,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#4a3b2a'},sign);
  t1.textContent='第'+z.ch.id+'章 · '+z.ch.name;
  const t2=el('text',{x:cx,y:sy+10,'text-anchor':'middle','font-size':9,fill:'#8d7c62'},sign);
  t2.textContent=z.ch.sub;
  fitSignText(t1,pw-16); fitSignText(t2,pw-16);
}
/* 木牌文字超出牌面时压缩（章节名长短不一，宁可挤一点也不让它溢出到节点上） */
function fitSignText(t,maxW){
  try{ const w=t.getComputedTextLength(); if(w>maxW){ t.setAttribute('textLength',String(maxW)); t.setAttribute('lengthAdjust','spacingAndGlyphs'); } }catch(e){}
}
function fogPuff(parent,x,y,scale,heavy){
  const g=el('g',{class:'misty',opacity:heavy?.9:.75},parent);
  const blobs=heavy?5:3;
  for(let i=0;i<blobs;i++){
    const dx=(i-(blobs-1)/2)*26*scale+(rng(i*7+x)()-.5)*10;
    el('ellipse',{cx:x+dx,cy:y+(rng(i*13+y)()-.5)*10,rx:(24+rng(i+x)()*14)*scale,ry:(11+rng(i+y)()*6)*scale,fill:heavy?'#e8ecef':'#f2f4f5',opacity:.9},g);
  }
  return g;
}
/* 关卡节点上的玩法角标（小圆底 + 图标）：门型 / 同向 / 迷宫，经典平坦关不画 */
function modeBadge(parent,x,y,level){
  const gate=level.mode==='gate'||level.mode==='sharedGate';
  const maze=level.terrain==='maze';
  if(!gate&&level.mode!=='sameSide'&&!maze) return;
  const g=el('g',{},parent);
  el('circle',{cx:x,cy:y,r:9.5,fill:'#fffdf6',stroke:'rgba(74,59,42,.45)','stroke-width':1.3},g);
  if(gate){
    el('path',{d:`M${x-4.5} ${y+4.5} V${y-1.5} Q${x} ${y-7.5} ${x+4.5} ${y-1.5} V${y+4.5}`,
      fill:'none',stroke:'#b07a1f','stroke-width':1.9},g);
  } else if(level.mode==='sameSide'){
    el('path',{d:`M${x-3.6} ${y+4.5} V${y-3.5} M${x-3.6} ${y-3.5} l-2 2.6 M${x-3.6} ${y-3.5} l2 2.6`,
      fill:'none',stroke:'#4f7d5b','stroke-width':1.7},g);
    el('path',{d:`M${x+3.6} ${y+4.5} V${y-3.5} M${x+3.6} ${y-3.5} l-2 2.6 M${x+3.6} ${y-3.5} l2 2.6`,
      fill:'none',stroke:'#4f7d5b','stroke-width':1.7},g);
  } else {
    el('path',{d:`M${x-4.5} ${y+4.5} h9 M${x-4.5} ${y+0.5} h5 M${x+3.5} ${y-3.5} h1`,
      fill:'none',stroke:'#6a9a76','stroke-width':1.9},g);
  }
}
/* AdventureMap 组件 */
function renderAdventureMap(root){

  make.onclick=()=>{ location.hash='#/edit'; };
  hero.appendChild(make);
  page.appendChild(hero);

  /* 今日挑战：一张卡片，看得出玩法与今天有没有打过；普通/地狱双档自选 */
  {
    const key=Daily.todayKey();
    const lv=buildDailyLevel(key,0);
    const rec=Daily.rec(key);
    const box=html('div','paper daily-card');
    const left=html('div','daily-left');

      ? (modeName+' · 棋盘 '+lv.width+'×'+lv.height+(lv.specialKind?(' · 带'+((MECH[lv.specialKind]||{}).name||'机关')):'')
         +(lv.events&&lv.events.length?' · 带回合事件':'')+' · <b>普通 / 地狱</b>两档'
         +'<br><span class="dim">同一档难度，所有人拿到的是同一张图</span>')
      : '今天这张图还没生成出来';
    left.appendChild(info);
    box.appendChild(left);
    const right=html('div','daily-right');
    const doneLine=rec
      ? (rec.win?'普通 ✓'+(rec.best?' · 最好 '+rec.best+' 步':''):'普通未过')
        +(rec.hellWin?(' · 地狱 ✓'+(rec.bestHell?' · 最好 '+rec.bestHell+' 步':'')):'')
      : '';
    if(doneLine) right.appendChild(html('div','daily-done',doneLine));
    right.appendChild(html('div','daily-streak','连续 '+Daily.streak()+' 天'));

    goH.onclick=()=>{ location.hash='#/daily/hell'; };

  const g=el('g',{},svg);

  /* 道路 */

  const thOf=id=>THEMES[LEVELS[id-1].visualTheme];
  EDGES.forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;

  const chapterUnlockedAny=ci=>ZONES[ci] && LEVELS.filter(l=>l.chapterId===ci+1).some(l=>isUnlocked(l.id));

  /* 关卡节点 */
  const lastWon=window.__justWon; window.__justWon=null;
  NODES.forEach(nd=>{
    const level=LEVELS[nd.id-1];
    const doneLv=Save.done(nd.id);
    const unlocked=isUnlocked(nd.id);

    const ng=el('g',{class:'node-hit'+((!unlocked)?' node-locked':'')},g);
    const shape=th.shapes[level.index%th.shapes.length];
    const muted=!unlocked&&!zoneLocked;
    if(zoneLocked){ ng.style.opacity='.5'; }
    if(doneLv||curLv) nodeShapeDrawing(ng,shape,nd.x,nd.y,th,false);
    else nodeShapeDrawing(ng,shape,nd.x,nd.y,th,true);
    /* 章末 Boss：金环 + 王冠，一眼看出这是大关 */
    if(level.isBoss){
      el('circle',{cx:nd.x,cy:nd.y,r:30,fill:'none',stroke:'#e6b455','stroke-width':3,opacity:.5},ng);
      const cy=nd.y+42;
      el('path',{d:`M${nd.x-13} ${cy+7} l3 -13 l5 7 l5 -9 l5 9 l5 -7 l3 13 Z`,
        fill:'#e6b455',stroke:'#633806','stroke-width':1.2},ng);
    }
    /* 玩法角标：让玩家在 100 关里一眼挑出想要的类型（经典平坦关不加） */
    modeBadge(ng,nd.x-20,nd.y-22,level);
    /* 当前关卡：呼吸光环 + 冒险球 */
    if(curLv&&unlocked&&!doneLv){
      el('circle',{cx:nd.x,cy:nd.y,r:26,fill:'none',stroke:'#e6b455','stroke-width':5,class:'node-ring'},ng);
      const pg=el('g',{class:'node-bob'},ng);
      PlayerPiece(pg,nd.x,nd.y-46,13,currentSkin().id);
    }
    if(doneLv){
      /* 完成标记：小旗 */
      el('path',{d:`M${nd.x+12} ${nd.y-26} v20 h-13 l4 -5 -4 -5 z`,fill:'#4f7d5b',stroke:'#4a3b2a','stroke-width':1.6},ng);
      const rec=Save.rec(nd.id);
      const sg=el('g',{},ng);
      for(let i=0;i<3;i++){
        const on=rec&&rec.stars>i;
        el('path',{d:starPath(nd.x+(i-1)*17,nd.y+26,7,3),fill:on?'#e6b455':'#d8d2c2',stroke:'rgba(74,59,42,.4)','stroke-width':1},sg);
      }
      if(lastWon===nd.id) ng.setAttribute('class',ng.getAttribute('class')+' node-pop');
    }
    /* 未解锁：雾气（而不是灰色按钮） */
    if(!unlocked&&!doneLv){
      if(zoneLocked){ fogPuff(ng,nd.x,nd.y,1.4,true); }
      else { ng.style.opacity='.85'; fogPuff(ng,nd.x,nd.y-4,0.9,false); }
    }
    /* 编号小牌 */
    const tag=el('g',{},ng);
    el('rect',{x:nd.x-11,y:nd.y+38,width:22,height:16,rx:7,fill:unlocked?'#fff':'#eceae4',stroke:'rgba(74,59,42,.45)','stroke-width':1.4},tag);
    const num=el('text',{x:nd.x,y:nd.y+46,'text-anchor':'middle','font-size':10,'font-weight':700,fill:'#4a3b2a','dominant-baseline':'central'},tag);
    num.textContent=nd.id;
    ng.addEventListener('click',()=>{
      if(!unlocked){ toast('前面的路还没打通，先完成上一处地点吧'); return; }
      location.hash='#/play/'+nd.id;
    });
  });
  /* 章节间整体雾带（未解锁章节额外压一层） */
  ZONES.forEach((z,ci)=>{
    if(!chapterUnlockedAny(ci)){
      fogPuff(g,400,z.y0+120,4.6,true);
      fogPuff(g,220,z.y0+300,3.2,true);
      fogPuff(g,580,z.y0+420,3.4,true);
    }
  });
  /* 定位到当前关卡 */
  requestAnimationFrame(()=>{
    const curNode=byId[currentLevelId()];
    if(curNode){
      const rect=svg.getBoundingClientRect();
      const scale=rect.width/800;
      const target=curNode.y*scale-innerHeight*0.45;
      window.scrollTo({top:Math.max(0,target),behavior:'smooth'});
    }
  });
}
function maxUnlocked(){
  let m=1;
  LEVELS.forEach(l=>{ if(isUnlocked(l.id)) m=Math.max(m,l.id); });
  return m;
}
function ch2name(lv){ return THEMES[lv.visualTheme].label+' · '+lv.width+'×'+lv.height+' 棋盘'; }

/* 玩法文案的唯一出处：HUD 目标行、教学卡、地图角标都从这里取 */
const MODES={
  race:      {name:'相向竞速', goal:'对岸任意一格',
              tip:'你和对手从两侧出发，先到对岸的人赢。墙不能把任何一方彻底封死。'},
  gate:      {name:'门关',     goal:'中央门（2 格）',
              tip:'这一关只有中央那扇门算终点：绕远也要挤进门里，别在大门前被对手封住。'},
  sameSide:  {name:'同向竞速', goal:'抢先到顶边',
              tip:'你们并排从同一侧出发，抢同一条终点线。挡在对手前面，比只顾自己加速更管用。'},
  sharedGate:{name:'共同终点', goal:'抢先站上门',
              tip:'起点各不相同，但那扇门只有一扇：谁先站上去谁赢。'},
  chase:     {name:'追逐',     goal:'在被追上之前抵达对岸',
              tip:'有东西在追你：它每回合走两格，你只有一格。放墙拖住它，然后在它贴上来之前冲到对岸。'},
};
const TERRAIN_NAME={plain:'',maze:'回廊迷宫'};
function goalText(level){ return (MODES[level.mode]||MODES.race).goal; }
function modeTag(level){
  const t=TERRAIN_NAME[level.terrain]||'';

  return level.mode==='race'?(t||m):(t?m+' · '+t:m);

/* ---------- 教学卡示意图：迷你棋盘 + 少量元素 + 轻微动画 ----------
   目标只有一个：让玩家在 3 秒内看懂「这一关的规则和别处不一样在哪」。
   所以每张图只画一个变量，元素越少越好。 */
function introArt(kind){
  kind=String(kind||'').replace(/^ev:/,'');      /* 事件 key 是 'ev:xxx'，示意图按 xxx 取（修复：此前事件卡一直落在默认图） */
  const NSv='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NSv,'svg');
  svg.setAttribute('viewBox','0 0 260 116');
  svg.setAttribute('class','intro-art');
  const S=15, X0=14, Y0=20, COLS=8, ROWS=5;
  const px=c=>X0+c*S+S/2, py=r=>Y0+r*S+S/2;
  const add=(tag,attrs)=>{ const e=document.createElementNS(NSv,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); svg.appendChild(e); return e; };
  const gold='#EF9F27', purple='#7F77DD', monster='#a8324a';
  const ball=(x,y,col,extra)=>add('circle',Object.assign({cx:x,cy:y,r:5,fill:col,stroke:'#4a3b2a','stroke-width':1.2},extra||{}));
  const txt=(x,y,t,size,fill)=>Object.assign(add('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':size||11,fill:fill||'#4a3b2a','font-weight':600}),{textContent:t});
  const goalBar=(x,w,cls)=>add('rect',{x,y:Y0-5,width:w,height:5,rx:2.5,fill:gold,class:cls||''});
  const gate=(cx,cls)=>{
    add('rect',{x:cx-S,y:Y0-5,width:S*2-3,height:5,rx:2.5,fill:gold,class:cls||''});
    const g=add('path',{d:`M${cx-S} ${Y0-3} V${Y0-15} Q${cx} ${Y0-26} ${cx+S-3} ${Y0-15} V${Y0-3}`,fill:gold,opacity:.42,stroke:'#b07a1f','stroke-width':1.4,class:cls||''});
    add('text',{x:cx-S/2,y:Y0-15,'text-anchor':'middle','dominant-baseline':'central','font-size':10,fill:'#fff','font-weight':700}).textContent='门';
    return g;
  };
  /* 棋盘底 */
  add('rect',{x:X0-4,y:Y0-4,width:COLS*S+8,height:ROWS*S+8,rx:9,fill:'#f7f4ea',stroke:'#c9b48a','stroke-width':1.5});
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    add('rect',{x:X0+c*S,y:Y0+r*S,width:S,height:S,fill:(r+c)%2?'#efe9d8':'#e5ddc8',stroke:'#d6cdb4','stroke-width':0.5});
  }
  const barrier=(r,c0,len)=>add('rect',{x:X0+c0*S+1,y:Y0+r*S+1,width:S*len-2,height:S-2,rx:5,fill:'#9a7550',stroke:'#6b4f33','stroke-width':1});
  const rightLabel=(t1,t2)=>{
    txt(200,44,t1,12);
    if(t2) txt(200,62,t2,10,'#7a6a52');
  };
  switch(kind){
    case 'gate':                                  /* 只有中央那扇门算终点 */
      goalBar(X0,COLS*S);
      gate(px(3));
      ball(px(5),py(4),gold,{class:'ia-hop'});
      add('path',{d:`M${px(3)+S} ${Y0+8} H${px(5)}`,stroke:'#b07a1f','stroke-width':1.6,'stroke-dasharray':'4 4','marker-end':''});
      rightLabel('只有门算终点','其余格子都不算');
      break;
    case 'maze':                                  /* 回廊：缺口左右交替 */
      goalBar(X0,COLS*S);
      barrier(1,0,6); barrier(2,2,6); barrier(3,0,6); barrier(4,2,6);
      ball(px(7),py(4),gold,{class:'ia-step'});
      txt(200,44,'隔断左右交替',12); txt(200,62,'必须蛇形绕行',10,'#7a6a52');
      break;
    case 'sameSide':                              /* 并排同侧出发 */
      goalBar(X0,COLS*S);
      ball(px(2),py(4),gold,{class:'ia-hop'});
      ball(px(5),py(4),purple,{class:'ia-hop'});
      txt(200,44,'并排出发',12); txt(200,62,'抢同一条线',10,'#7a6a52');
      break;
    case 'sharedGate':                            /* 起点不同，抢同一扇门 */
      gate(px(3));
      ball(px(0),py(4),gold,{class:'ia-push-a'});
      ball(px(7),py(4),purple,{class:'ia-push-b'});
      txt(200,44,'抢同一扇门',12); txt(200,62,'先站上就赢',10,'#7a6a52');
      break;
    case 'chase':                                 /* 怪物与你同速，但会拦截 */
      goalBar(X0,COLS*S);
      ball(px(2),py(3),gold,{class:'ia-dodge'});
      add('circle',{cx:px(5),cy:py(2),r:7,fill:monster,stroke:'#4a1420','stroke-width':1.4,class:'ia-chase'});
      add('path',{d:`M${px(5)} ${py(2)+9} V${py(3)}`,stroke:'#4a1420','stroke-width':1.6,'stroke-dasharray':'3 3'});
      add('rect',{x:px(5)-S+2,y:py(2)+S/2,width:S-4,height:5,rx:2.5,fill:'#9a7550',stroke:'#6b4f33','stroke-width':1,transform:`rotate(90 ${px(5)-S/2+2} ${py(2)+S/2+2})`});
      txt(196,44,'它和你一样快',12); txt(200,62,'会抄前路堵你',10,'#7a6a52');
      break;
    case 'rain':                                  /* 定期落石 */
      goalBar(X0,COLS*S);
      add('path',{d:`M${px(3)-6} ${Y0-16} l6 9 l6 -9 z`,fill:'#9a7550',stroke:'#6b4f33','stroke-width':1,class:'ia-hop'});
      add('path',{d:`M${px(6)-6} ${Y0-16} l6 9 l6 -9 z`,fill:'#9a7550',stroke:'#6b4f33','stroke-width':1,class:'ia-hop'});
      add('rect',{x:px(3)-S/2+2,y:py(2)-S/2+2,width:S-4,height:S-4,rx:5,fill:'#9a7550',stroke:'#6b4f33','stroke-width':1});
      ball(px(1),py(4),gold);
      txt(196,44,'天上掉障碍',12); txt(200,62,'棋盘越变越挤',10,'#7a6a52');
      break;
    case 'duel':                                  /* 两人同屏轮流走 */
      goalBar(X0,COLS*S);
      ball(px(2),py(1),gold,{class:'ia-tick-a'});
      ball(px(6),py(3),purple,{class:'ia-tick-b'});
      txt(200,44,'轮流走',12); txt(200,62,'各 10 面墙',10,'#7a6a52');
      break;
    case 'boss':                                  /* 章末 Boss */
      add('path',{d:`M${px(3)-10} ${Y0-8} l2 -12 l4 7 l4 -9 l4 9 l4 -7 l2 12 Z`,fill:gold,stroke:'#633806','stroke-width':1.2,class:'ia-pulse'});
      barrier(2,1,5); barrier(3,2,5);
      ball(px(1),py(4),gold);
      add('circle',{cx:px(6),cy:py(1),r:7,fill:monster,stroke:'#4a1420','stroke-width':1.4});
      txt(200,44,'章末大关',12); txt(200,62,'一套新规则',10,'#7a6a52');
      break;
    case 'shrink':                                /* 岩浆从两侧涌上 */
      goalBar(X0,COLS*S);
      add('rect',{x:X0,y:Y0,width:S,height:ROWS*S,fill:'#d9534f',opacity:.55,class:'ia-push-a'});
      add('rect',{x:X0+(COLS-1)*S,y:Y0,width:S,height:ROWS*S,fill:'#d9534f',opacity:.55,class:'ia-push-b'});
      ball(px(4),py(4),gold);
      txt(196,44,'岩浆两侧推进',12); txt(200,62,'棋盘越来越窄',10,'#7a6a52');
      break;
    case 'shiftGate':                             /* 门会换位置 */
      goalBar(X0,COLS*S);
      gate(px(3),'ia-tick-a');
      gate(px(6),'ia-tick-b');
      ball(px(0),py(4),gold);
      txt(196,44,'门会换位置',12); txt(200,62,'别只认一条路',10,'#7a6a52');
      break;
    case 'phase':                                 /* 对手换打法 */
      goalBar(X0,COLS*S);
      ball(px(1),py(4),gold);
      const f=(x,cls,label)=>Object.assign(
        add('path',{d:`M${x-8} ${py(1)+8} V${py(1)} Q${x} ${py(1)-12} ${x+8} ${py(1)} V${py(1)+8} Z`,fill:purple,opacity:.5,stroke:'#534AB7','stroke-width':1.2,class:cls}),
        {});
      f(px(3),'ia-tick-a'); f(px(5),'ia-tick-b'); f(px(7),'ia-tick-a');
      txt(196,44,'对手换打法',12); txt(200,62,'三个阶段',10,'#7a6a52');
      break;
    case 'portal':                                /* 踩上传到配对的另一扇 */
      goalBar(X0,COLS*S);
      add('circle',{cx:px(3),cy:py(4),r:6,fill:'none',stroke:'#534AB7','stroke-width':2,class:'ia-blink'});
      add('circle',{cx:px(3),cy:py(0),r:6,fill:'none',stroke:'#534AB7','stroke-width':2,class:'ia-blink'});
      ball(px(3),py(1),gold,{class:'ia-pulse'});
      txt(196,44,'踩上直接到对面',12); txt(200,62,'横跨半个棋盘',10,'#7a6a52');
      break;
    case 'boost':                                 /* 加速带：多滑一格 */
      goalBar(X0,COLS*S);
      add('rect',{x:px(3)-S/2,y:py(1)-S/2,width:S,height:S,rx:4,fill:'#63B3A6',opacity:.3});
      add('rect',{x:px(3)-S/2,y:py(2)-S/2,width:S,height:S,rx:4,fill:'#63B3A6',opacity:.3});
      ball(px(3),py(3),gold,{class:'ia-hop'});
      txt(200,44,'踩上多滑一格',12); txt(200,62,'一步顶两步',10,'#7a6a52');
      break;
    case 'spring':                                /* 弹簧：弹两格，可越墙 */
      goalBar(X0,COLS*S);
      barrier(2,3,1);                             /* 中间挡着一格障碍，说明能越过去 */
      add('rect',{x:px(3)-S/2,y:py(3)-S/2,width:S,height:S,rx:4,fill:'#EF9F27',opacity:.28});
      ball(px(3),py(0),gold,{class:'ia-pulse'});
      txt(196,44,'弹两格，能越墙',12); txt(200,62,'唯一越过墙的手段',10,'#7a6a52');
      break;
    case 'trap':                                  /* 陷阱：丢 2 面墙 */
      goalBar(X0,COLS*S);
      for(let i=0;i<5;i++){
        const a=-Math.PI/2+i*Math.PI*2/5;
        const cx0=px(3), cy0=py(2);
        el('path',{d:`M${cx0+Math.cos(a)*7} ${cy0+Math.sin(a)*7} L${cx0+Math.cos(a+0.5)*2.4} ${cy0+Math.sin(a+0.5)*2.4} L${cx0+Math.cos(a-0.5)*2.4} ${cy0+Math.sin(a-0.5)*2.4} Z`,
          fill:'#A32D2D',opacity:.8,class:'ia-blink'});
      }
      ball(px(3),py(3),gold);
      txt(196,44,'踩到丢 2 面墙',12); txt(200,62,'捷径上有代价',10,'#7a6a52');
      break;
    default:
      ball(px(4),py(3),gold);
  }
  return svg;
}

/* 除 mode/terrain/Boss 之外，还会独立出现的机制（首次遇到各讲一次） */
const MECH={
  maze:{name:'回廊迷宫', tip:'地形：每隔几行一道隔断，只在左或右留缺口，且左右交替——蛇形绕行是常态，别走进死路。', goal:'抵达对岸任意一格'},
  portal:{name:'传送门', tip:'地上有两个紫色的漩涡（一上一下配成一对）：踩上任意一个，立刻被送到另一个。用来横跨半个棋盘抢位。', goal:'抵达对岸任意一格'},
  boost:{name:'加速带', tip:'绿色的箭头格：踩上去会顺着你前进的方向再滑一格，等于一步走两格（滑行不能穿墙）。', goal:'抵达对岸任意一格'},
  spring:{name:'弹簧', tip:'金色的弹簧格：踩上去会被沿原方向弹出两格，而且**能越过墙和障碍**——这是唯一能越过墙的手段。', goal:'抵达对岸任意一格'},
  trap:{name:'陷阱', tip:'暗红的尖刺格：踩上去要丢 2 面墙。它常常正好在捷径上，绕开还是硬踩由你决定。', goal:'抵达对岸任意一格'},
  pickup:{name:'拆墙器', tip:'金色的扳手格：踩上立刻多 1 面墙。它常常在必经之路的旁边——绕开还是顺路捡由你决定。', goal:'抵达对岸任意一格'},
  'ev:shrink':{name:'岩浆收缩', tip:'每几回合两侧岩浆各涌上一列，棋盘越来越窄。慢一步，路就没了——别在两侧磨蹭。', goal:'在路被烧完前抵达对岸'},
  'ev:shiftGate':{name:'门漂移', tip:'那扇门每隔几回合换一次位置。别死盯一条路线，随时看清目标现在在哪。', goal:'抵达中央门（会移动）'},
  'ev:phase':{name:'阶段切换', tip:'对手每隔几回合换一次打法：冲锋 → 筑墙 → 镜像。它换阶段的那一瞬间，是你反超的机会。', goal:'抵达中央门'},
  duel:{name:'双人对战', tip:'两人一台设备轮流走：金球与紫球各有 10 面墙，谁先到对方那条边谁赢。屏幕上方会写明轮到谁。', goal:'金球→顶边 · 紫球→底边'},
};
/* 这一关该不该弹教学卡（经典平坦的普通关不打扰；新机制首次出现才弹一次）
   优先级：Boss > 追逐 > 回合事件 > 特殊格 > 迷宫 > 其他玩法 */
function introKindOf(level){
  if(level.isBoss) return 'boss';
  if(level.mode==='chase') return 'chase';
  if(level.events&&level.events.length) return 'ev:'+level.events[0].type;
  if(level.specialKind) return level.specialKind;
  if(level.terrain==='maze') return 'maze';
  if(level.mode!=='race') return level.mode;
  return null;
}

/* 新玩法首次遇到时先讲一句规则，看过就不再打扰（记在本地存档里） */
const Intro={
  key:'dreamquest.intro.v1',
  seen(){ try{ return JSON.parse(localStorage.getItem(this.key)||'{}'); }catch(e){ return {}; } },
  has(k){ return !!this.seen()[k]; },
  mark(k){ const s=this.seen(); s[k]=1; try{ localStorage.setItem(this.key,JSON.stringify(s)); }catch(e){} },
  /* 一张卡：示意图 + 标题 + 规则 + 目标 + 一个按钮 */
  card(artKind,title,tip,goalText,counter,k,btnText){
    const {scrim,panel,close}=overlayPanel();
    if(artKind) panel.appendChild(introArt(artKind));
    panel.appendChild(html('h2','',title));
    panel.appendChild(html('div','narr',tip));
    if(goalText) panel.appendChild(html('div','newrec','本关目标：'+goalText));
    if(counter) panel.appendChild(html('div','narr','克制提示：'+counter));
    const row=html('div','row');
    const go=html('button','btn primary',btnText||'开始挑战');
    go.onclick=()=>{ Intro.mark(k); close(); };
    row.appendChild(go);
    panel.appendChild(row);
  },
  show(level,k){
    const m=MODES[level.mode]||MODES.race;
    const mech=MECH[k]||{};                    /* k 可能是 'maze' / 'portal' / 'ev:xxx' */
    const title='新玩法 · '+(mech.name||m.name);
    const tip=mech.tip||m.tip;
    const goal=mech.goal||m.goal;
    Intro.card(k,title,tip,goal,'',k);         /* 示意图直接按 key 取：每种机制一张图 */
  },
  /* Boss 卡：名字 + 机制 + 打法 + 克制提示（如果这关还带回合事件，一并讲清） */
  showBoss(level,k){
    const P=PERSONAS[level.aiConfig.persona]||PERSONAS.race;
    const ev=level.events&&level.events[0];
    const art=ev?('ev:'+ev.type):'boss';
    const {scrim,panel,close}=overlayPanel();
    panel.appendChild(introArt(art));
    panel.appendChild(html('div','newrec','BOSS · 第'+level.chapterId+'章'));
    panel.appendChild(html('h2','',level.bossName));
    panel.appendChild(html('div','narr',level.bossNote));
    if(ev){
      const M2=MECH['ev:'+ev.type];
      if(M2) panel.appendChild(html('div','narr','关卡机制：'+M2.tip));
    }
    if(level.specialKind){
      const M3=MECH[level.specialKind];
      if(M3) panel.appendChild(html('div','narr','场上机关：'+M3.tip));
    }
    panel.appendChild(html('div','narr','对手打法：'+P.name+' —— '+P.note));
    panel.appendChild(html('div','newrec','克制提示：'+level.bossCounter));
    const row=html('div','row');
    const go=html('button','btn primary','应战');
    go.onclick=()=>{ Intro.mark(k); close(); };
    row.appendChild(go);
    panel.appendChild(row);
  },
  showDuel(){
    const k='duel';
    if(Intro.has(k)) return;
    Intro.card('duel','双人对战 · 同屏轮流',MECH.duel.tip,MECH.duel.goal,'',k,'开始对战');
  }
};

/* ---------------- 技能卡 ----------------
   每关最多用一张，选中立刻生效（不是开局选卡——那样会打断节奏，也少了临场应变的味道）。
   四张基础卡开局就有；三张进阶卡随章节解锁（ch = 解锁所需的章节进度）——
   让第 60 关的手和第 1 关的手不一样，这是"变强曲线"的主轴。
   双人同屏不给用（两边都是人，给了会失衡）。 */
const SKILLS={
  walls:{name:'备墙', mark:'＋', desc:'立刻多带 2 面墙', once:true,
    apply(g){ g.wallsLeft.P+=2; return '多带 2 面墙，现在有 '+g.wallsLeft.P+' 面'; }},
  strip:{name:'拆墙', mark:'−', desc:'对手本关少 1 面墙', once:true,
    apply(g){ g.wallsLeft.A=Math.max(0,g.wallsLeft.A-1); return '对手只剩 '+g.wallsLeft.A+' 面墙'; }},
  foresee:{name:'预知', mark:'眼', desc:'本关随时看到对手的最佳选择（打算走哪格、想封哪面墙）'},
  scout:{name:'侦察', mark:'图', desc:'本关画出对手到目标的最短路（虚线圈起来的那条）'},
  dash:{name:'二连走', mark:'⇉', desc:'本关的一次走子可以直走 2 格（路径上不能有墙和障碍）', once:true, ch:2,
    apply(g){ g.dashArmed=true; return '已蓄力：下一次走子可以直走 2 格（点两个格外的目标格）'; }},
  echo:{name:'回响', mark:'听', desc:'本关标出对手的下一步焦点：追逐关是怪物的拦截点，其他关是它的推进路线', ch:4},
  crowbar:{name:'撬棍', mark:'撬', desc:'拆掉场上任意一面已有的墙（选卡后点那面墙即可）', once:true, ch:6,
    apply(g){ g.removalMode=true; return '撬棍已就位：点场上任何一面墙把它拆掉'; }},
};
/* 章节解锁判定：玩家进度最远到过哪一章（自定义/每日关不算） */
function skillChUnlocked(){
  const mx=maxUnlocked();
  const lv=LEVELS[mx-1];
  return lv?lv.chapterId:1;
}
/* 预览对手这一步"最想做什么"：临时关掉随机性问一次 AI，问完恢复（decide 是纯函数） */
function previewOpponent(g,level){
  if(g.mode==='chase'){                       /* 追逐关：怪物就是沿最短路逼近 */
    const c=pathLen(g,g.balls.A,g.balls.P);
    return c.next?{type:'move',to:c.next}:null;
  }
  const sn=level.aiConfig.noise, sm=level.aiConfig.mistake;
  level.aiConfig.noise=0; level.aiConfig.mistake=0;
  const act=AI.decide(g,level);
  level.aiConfig.noise=sn; level.aiConfig.mistake=sm;
  return act;
}

/* ---------------- GameBoard：动态棋盘对局 ---------------- */
let gameTimer=null;
let twoPMode=false;          /* 双人同屏（两人一台设备轮流走）：模块级，切换后重开本局 */
let firstMover='P';          /* 双人模式谁先走（交换先后手用） */
let customLevel=null;        /* 自定义关卡（编辑器试玩 / 分享码打开） */
let customFromEditor=false;  /* 是否来自编辑器（决定结算面板给什么按钮） */
let dailyLevel=null;         /* 今日挑战的关卡（每天一张，同一天全网同图） */
let editorState=null;        /* 编辑器的编辑状态（避免切页丢失） */
function renderGame(root,levelId){
  const level=(levelId==='c'&&customLevel)?customLevel:((levelId==='d'&&dailyLevel)?dailyLevel:LEVELS[levelId-1]);
  if(!level){ location.hash='#/map'; return; }
  const ch=level.daily?{id:0,name:'今日挑战',sub:'同一天，所有人拿到的是同一张图'}
    :(level.custom?{id:0,name:'自制关卡',sub:'你（或朋友）画的一张图'}:CHAPTERS[level.chapterId-1]);
  const th=THEMES[level.visualTheme];
  const page=html('div','game-page'); root.appendChild(page);

  const g=makeGame(level);
  g.twoP=twoPMode;                           /* 双人同屏：不走 AI，轮到谁谁操作 */
  level.preWalls.forEach(w=>{ (w.kind==='H'?g.hW:g.vW).add(K(w.kind,w.r,w.c)); });
  g.wallsLeft.P=level.wallRules.quota.P;
  /* 双人同屏时双方墙数对等（AI 的那套配额在人对人时不公平），谁先走也可以交换 */
  g.wallsLeft.A=g.twoP?level.wallRules.quota.P:level.wallRules.quota.A;
  if(g.twoP) g.turn=firstMover;
  g.skill=null;                              /* 本关已用的技能卡（每关一张） */

  /* ---- GameHUD ---- */
  const hud=html('div','paper hud');
  const back=html('button','btn ghost icon-btn','←');
  back.onclick=()=>{ location.hash='#/map'; };
  hud.appendChild(back);
  const lv=html('div','lv');
  lv.innerHTML=(level.isBoss?('BOSS · '+level.bossName+' · '+ch.name):(level.name+' · '+ch.name))
    +' <small>'+th.label+'主题 · 棋盘 '+level.width+'×'+level.height+' · '+modeTag(level)+'</small>';
  hud.appendChild(lv);
  const turnPair=html('span','turn-pair');
  const orbP=html('span','turn-orb'); orbP.style.background='#f2c14e';
  const orbA=html('span','turn-orb'); orbA.style.background=['#8f86c9','#7fa8c9','#c98fa6'][level.aiConfig.skin%3];
  turnPair.append(orbP,orbA); hud.appendChild(turnPair);
  const pillRound=html('span','pill'); const pillTime=html('span','pill'); const pillWall=html('span','pill');
  hud.append(pillRound,pillTime,pillWall);
  /* 本关目标写成一行字，直接消掉「终点到底算哪几格」的歧义 */
  const pillGoal=html('span','pill goal-pill');
  hud.appendChild(pillGoal);
  /* 带回合事件的关卡：显示下一次事件还有几回合 */
  let pillEvent=null;
  if(level.events&&level.events.length){ pillEvent=html('span','pill evt-pill'); hud.appendChild(pillEvent); }
  /* 双人同屏：谁在走要一眼看得出来 */
  let pillTurn=null;
  if(g.twoP){ pillTurn=html('span','pill turn-pill'); hud.appendChild(pillTurn); }
  /* 技能卡：本关随时可用一张（双人不给用，两边都是人会失衡） */
  let skillBtn=null;
  if(!g.twoP){
    skillBtn=html('button','btn ghost warn','技能');
    skillBtn.title='本关可用一张技能卡：随时点开、选中即生效、本关内有效';
    skillBtn.onclick=()=>openSkillPanel();
    hud.appendChild(skillBtn);
  }
  /* 追逐关：随时告诉你怪物离你还有几步 */
  let pillChase=null;
  if(g.mode==='chase'){ pillChase=html('span','pill chase-pill'); hud.appendChild(pillChase); }
  const twoBtn=html('button','btn ghost',g.twoP?'单人':'双人');
  twoBtn.title=g.twoP?'切回单人（对 AI）':'切换成两人同屏对战（本局重开）';
  twoBtn.onclick=()=>{
    twoPMode=!twoPMode;
    toast(twoPMode?'双人对战：两人轮流走，各 10 面墙（本局重开）':'切回单人模式（对 AI）');
    renderGameFresh();
  };
  hud.appendChild(twoBtn);
  /* 静音开关：所有声音（含 BGM）一键关掉，偏好记在本地 */
  const muteBtn=html('button','btn ghost icon-btn',SFX.isMuted()?'🔇':'🔊');
  muteBtn.title='音效 / 音乐开关';
  muteBtn.onclick=()=>{ const m=SFX.toggle(); muteBtn.textContent=m?'🔇':'🔊'; toast(m?'已静音':'声音已打开'); };
  hud.appendChild(muteBtn);
  const restart=html('button','btn ghost icon-btn','↺');
  restart.onclick=()=>renderGameFresh();
  hud.appendChild(restart);
  page.appendChild(hud);

  /* ---- GameBoard（SVG 场景 + 动态棋盘） ---- */
  const cell=clamp(Math.floor(560/level.width),40,62);
  const M=64, BW=level.width*cell, BH=level.height*cell;
  const VW=M*2+BW, VH=M*2+BH;
  const arena=html('div','board-arena'); page.appendChild(arena);
  const svg=el('svg',{class:'boardsvg',viewBox:'0 0 '+VW+' '+VH,role:'img'});
  arena.appendChild(svg);

  /* 环境背景（棋盘所在的世界角落） */
  el('rect',{x:0,y:0,width:VW,height:VH,fill:th.arena,rx:18},svg);
  (function envDeco(){
    const R=rng(level.id*31+9);
    for(let i=0;i<10;i++){
      const x=R()*VW, y=R()*VH;
      if(x>M-14&&x<M+BW+14&&y>M-14&&y<M+BH+14) continue;
      if(level.visualTheme==='forest'||level.visualTheme==='mist'){
        el('circle',{cx:x,cy:y,r:2+R()*2,fill:'#5b8a5a',opacity:.3},svg);
      } else if(level.visualTheme==='star'||level.visualTheme==='lava'){
        el('circle',{cx:x,cy:y,r:1+R()*1.6,fill:level.visualTheme==='star'?'#ffe08a':'#ff9d5c',opacity:.5,class:'goal-cell'},svg);
      } else {
        el('circle',{cx:x,cy:y,r:2+R()*3,fill:'rgba(74,59,42,.16)'},svg);
      }
    }
  })();

  /* 棋盘框（材质变化区分层级，保证棋盘不融入背景） */
  el('rect',{x:M-22,y:M-22,width:BW+44,height:BH+44,rx:16,fill:th.frame,stroke:th.frameEdge,'stroke-width':4},svg);
  el('rect',{x:M-13,y:M-13,width:BW+26,height:BH+26,rx:11,fill:'none',stroke:'rgba(255,255,255,.35)','stroke-width':2.5,'stroke-dasharray':'3 9'},svg);

  const gBoard=el('g',{},svg);
  /* BoardCell：动态生成 */
  const cellEls={};
  for(let r=0;r<level.height;r++)for(let c=0;c<level.width;c++){
    const x=M+c*cell, y=M+r*cell;
    const dark=(r+c)%2===0;
    const rc=el('rect',{x,y,width:cell,height:cell,fill:dark?th.cellA:th.cellB,stroke:th.grid,'stroke-width':1},gBoard);
    cellEls[r+':'+c]=rc;
    rc.addEventListener('click',ev=>{ ev.stopPropagation(); onCellTap(r,c); });
  }
  /* 障碍层单独成组：回合事件（岩浆收缩、定期落障）会往 g.blocked 里加格子，重画这一层就行 */
  const gBlocks=el('g',{},gBoard);
  function redrawBlocks(){
    gBlocks.innerHTML='';
    for(let r=0;r<level.height;r++)for(let c=0;c<level.width;c++){
      if(isBlockedCell(g,r,c)) drawBlock(gBlocks,level,th,r,c,cell,M+c*cell,M+r*cell);
    }
  }
  redrawBlocks();
  /* 特殊格：传送门 / 加速带 / 弹簧 / 陷阱 —— 画在格子之上、棋子之下 */
  const gSpecials=el('g',{'pointer-events':'none'},gBoard);
  /* 技能卡的叠加层（预知：圈出对手想走/想封的位置；侦察：画出对手到目标的最短路） */
  const gSkill=el('g',{'pointer-events':'none'},gBoard);
  function drawSkillOverlay(){
    gSkill.innerHTML='';
    if(g.over||!g.skill) return;
    if(g.skill==='scout'||(g.skill==='echo'&&g.mode!=='chase')){
      const path=g.mode==='chase'?pathLen(g,g.balls.A,g.balls.P).path:bfs(g,'A').path;
      if(path&&path.length>1){
        const d=path.map((p,i)=>(i?'L':'M')+(M+p.c*cell+cell/2)+' '+(M+p.r*cell+cell/2)).join(' ');
        el('path',{d,fill:'none',stroke:'#7F77DD','stroke-width':3.5,'stroke-dasharray':'7 7',
          opacity:.6,'stroke-linecap':'round'},gSkill);
      }
    } else if(g.skill==='echo'&&g.mode==='chase'){
      /* 回响：实时标出怪物的拦截点（它正奔向哪个格子设卡） */
      const pp=bfs(g,'P');
      if(pp.path.length>1){
        const k=Math.min(pp.path.length-1,Math.max(1,Math.round(pp.path.length*CHASE_CUT)));
        const t=pp.path[k];
        el('circle',{cx:M+t.c*cell+cell/2,cy:M+t.r*cell+cell/2,r:cell*0.34,
          fill:'none',stroke:'#a8324a','stroke-width':3,'stroke-dasharray':'5 5',opacity:.85,class:'anchor-pulse'},gSkill);
      }
    } else if(g.skill==='foresee'){
      const act=previewOpponent(g,level);
      if(!act) return;
      if(act.type==='move'){
        el('circle',{cx:M+act.to.c*cell+cell/2,cy:M+act.to.r*cell+cell/2,r:cell*0.31,
          fill:'none',stroke:'#a8324a','stroke-width':3,'stroke-dasharray':'5 5',opacity:.8},gSkill);
      } else {
        const T=7;
        const a=act.kind==='H'
          ? {x:M+act.c*cell+3,y:M+(act.r+1)*cell-T/2,width:cell*2-6,height:T}
          : {x:M+(act.c+1)*cell-T/2,y:M+act.r*cell+3,width:T,height:cell*2-6};
        el('rect',Object.assign({rx:3.5,fill:'none',stroke:'#a8324a','stroke-width':2.5,
          'stroke-dasharray':'5 4',opacity:.85},a),gSkill);
      }
    }
  }
  function drawSpecials(){
    gSpecials.innerHTML='';
    (g.specialCells||[]).forEach(s=>{
      const x=M+s.c*cell, y=M+s.r*cell, cx=x+cell/2, cy=y+cell/2, u=cell/2;
      if(s.kind==='portal'){
        el('circle',{cx,cy,r:u*0.78,fill:'#7F77DD',opacity:.2},gSpecials);
        el('circle',{cx,cy,r:u*0.5,fill:'none',stroke:'#534AB7','stroke-width':2.2,opacity:.85},gSpecials);
        el('path',{d:`M${cx-u*0.26} ${cy-u*0.26} L${cx+u*0.26} ${cy+u*0.26} M${cx+u*0.26} ${cy-u*0.26} L${cx-u*0.26} ${cy+u*0.26}`,
          stroke:'#534AB7','stroke-width':2,'stroke-linecap':'round',opacity:.9},gSpecials);
      } else if(s.kind==='boost'){
        el('rect',{x:x+2,y:y+2,width:cell-4,height:cell-4,rx:5,fill:'#63B3A6',opacity:.28},gSpecials);
        for(let i=-1;i<=1;i++){
          el('path',{d:`M${cx-u*0.42+i*u*0.34} ${cy+u*0.34} L${cx+i*u*0.34} ${cy-u*0.3} L${cx+u*0.42+i*u*0.34} ${cy+u*0.34}`,
            fill:'none',stroke:'#0F6E56','stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.85},gSpecials);
        }
      } else if(s.kind==='spring'){
        el('rect',{x:x+2,y:y+2,width:cell-4,height:cell-4,rx:5,fill:'#EF9F27',opacity:.22},gSpecials);
        let d=`M${cx-u*0.5} ${cy+u*0.42}`;
        for(let i=0;i<4;i++) d+=` L${cx+(i%2?u*0.5:-u*0.5)} ${cy+u*0.42-(i+1)*u*0.22}`;
        el('path',{d,fill:'none',stroke:'#854F0B','stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round'},gSpecials);
      } else if(s.kind==='trap'){
        el('circle',{cx,cy,r:u*0.82,fill:'#A32D2D',opacity:.16},gSpecials);
        for(let i=0;i<5;i++){
          const a=-Math.PI/2+i*Math.PI*2/5;
          const x1=cx+Math.cos(a)*u*0.62, y1=cy+Math.sin(a)*u*0.62;
          const x2=cx+Math.cos(a+0.5)*u*0.2, y2=cy+Math.sin(a+0.5)*u*0.2;
          const x3=cx+Math.cos(a-0.5)*u*0.2, y3=cy+Math.sin(a-0.5)*u*0.2;
          el('path',{d:`M${x1} ${y1} L${x2} ${y2} L${x3} ${y3} Z`,fill:'#A32D2D',opacity:.85},gSpecials);
        }
      } else if(s.kind==='pickup'){
        el('circle',{cx,cy,r:u*0.8,fill:'#EF9F27',opacity:.18},gSpecials);
        /* 扳手：开口朝右上 */
        el('path',{d:`M${cx-u*0.34} ${cy+u*0.34} L${cx+u*0.18} ${cy-u*0.18}`,
          stroke:'#854F0B','stroke-width':3,'stroke-linecap':'round'},gSpecials);
        el('path',{d:`M${cx+u*0.08} ${cy-u*0.34} a${u*0.3} ${u*0.3} 0 1 0 ${u*0.28} ${u*0.05} l-${u*0.14} ${u*0.14} Z`,
          fill:'none',stroke:'#854F0B','stroke-width':2.2,'stroke-linecap':'round'},gSpecials);
      }
    });
  }
  drawSpecials();
  /* 终点标记：读的是对局状态 g.goals（不是关卡初始数据），所以「门漂移」这类事件能让画面跟着变
     · 整条边线型：色带 + 斜纹 + 沿线小旗 —— 明确「任意一格都算」；
     · 门型：只把指定格画成带「门」字的拱门，其余位置不留任何终点痕迹。
     按阵营分色：金色 = 玩家的目标，AI 配色 = 对手的目标；双方目标相同时只画一次（否则后画的会盖住先画的）。 */
  const aiAccent=['#8f86c9','#7fa8c9','#c98fa6'][level.aiConfig.skin%3];
  const goalMarks=el('g',{'pointer-events':'none'},gBoard);   /* 标记不吃点击，边线上的格子照样能走 */
  const isEdgeRow=cells=>cells.length===level.width&&cells.every(x=>x.r===cells[0].r);
  const sameSet=(a,b)=>a.length===b.length&&a.every(c=>b.some(x=>x.r===c.r&&x.c===c.c));
  const goalLineY=cells=>{                       /* 目标在顶行 → 线在上沿；在底行 → 线在下沿 */
    const rows=cells.map(c=>c.r);
    return Math.min(...rows)===0 ? M : M+(Math.max(...rows)+1)*cell;
  };
  const goalDir=cells=>Math.min(...cells.map(c=>c.r))===0?'up':'down';
  function redrawGoals(){
    goalMarks.innerHTML='';
    const gp=g.goals.P, ga=g.goals.A;
    if(!gp.length&&!ga.length) return;
    const shared=gp.length>0&&sameSet(gp,ga);
    if(gp.length) drawGoalSide(gp, goalLineY(gp), '#e6b455', goalDir(gp), shared?aiAccent:null);
    if(ga.length&&!shared) drawGoalSide(ga, goalLineY(ga), aiAccent, goalDir(ga), null);
  }
  function drawGoalSide(cells,lineY,color,dir,outline){
    if(!cells.length) return;
    const up=dir==='up', line=outline||color;
    if(isEdgeRow(cells)){
      el('rect',{x:M,y:lineY-4.5,width:BW,height:9,rx:4.5,fill:color,opacity:.26,class:'goal-cell'},goalMarks);
      el('rect',{x:M+2,y:lineY-2,width:BW-4,height:4,rx:2,fill:color,opacity:.9,class:'goal-cell'},goalMarks);
      for(let x=M+8;x<M+BW-6;x+=16){                     /* 斜纹：整条线都在提示范围内 */
        el('path',{d:'M'+x+' '+(lineY-6.5)+' l7 12',stroke:color,'stroke-width':1.6,opacity:.45},goalMarks);
      }
      const n=Math.max(3,Math.min(6,Math.round(BW/(cell*3))));
      for(let i=0;i<n;i++){                              /* 沿线插旗，杜绝「只有中间那格算」的误读 */
        const cx=M+BW*(i+0.5)/n, base=up?lineY-6:lineY+6, tip=up?base-13:base+13;
        el('path',{d:'M'+cx+' '+base+' V'+tip+' h11 l-3.5 '+(up?-4:4)+' l3.5 '+(up?-4:4)+' h-11 Z',
          fill:color,stroke:'rgba(74,59,42,.45)','stroke-width':1},goalMarks);
      }
    } else {
      const gx0=M+Math.min(...cells.map(g=>g.c))*cell, gx1=M+(Math.max(...cells.map(g=>g.c))+1)*cell;
      const mid=(gx0+gx1)/2, h=Math.max(28,cell*0.56), s=up?-1:1;
      /* 立一扇门：底边压在终点线上，门体向上（玩家侧）/ 向下（对手侧）立起 */
      el('path',{d:'M'+gx0+' '+lineY+' V'+(lineY+s*(h-10))+' Q'+mid+' '+(lineY+s*(h+7))+' '+gx1+' '+(lineY+s*(h-10))+' V'+lineY+' Z',
        fill:color,opacity:.42,stroke:line,'stroke-width':2},goalMarks);
      /* 格内亮线：明确「站上这两格才算」 */
      cells.forEach(g2=>{
        const x0=M+g2.c*cell;
        el('rect',{x:x0+2,y:lineY-4,width:cell-4,height:8,rx:4,fill:color,class:'goal-cell'},goalMarks);
      });
      /* 门楣写字：最直白的一层提示 */
      el('text',{x:mid,y:lineY+s*h*0.55,'text-anchor':'middle','dominant-baseline':'central',
        'font-size':Math.round(Math.max(13,cell*0.3)),'font-weight':700,fill:'#fffdf6',
        stroke:'rgba(74,59,42,.5)','stroke-width':0.9},goalMarks).textContent='门';
    }
  }
  redrawGoals();
  function drawBlock(parent,level,th,r,c,cell,x,y){
    const cx=x+cell/2, cy=y+cell/2;
    const g2=el('g',{},parent);
    if(th.block==='stump'){
      el('ellipse',{cx,cy:cy+6,rx:cell*0.38,ry:cell*0.3,fill:'#9c7550',stroke:'#4a3b2a','stroke-width':2},g2);
      el('ellipse',{cx,cy:cy-2,rx:cell*0.34,ry:cell*0.17,fill:'#c99b6b',stroke:'#4a3b2a','stroke-width':1.6},g2);
    } else if(th.block==='rock'){
      el('path',{d:`M${cx-cell*0.34} ${cy+cell*0.26} l${cell*0.08} ${-cell*0.34} ${cell*0.2} ${-cell*0.16} ${cell*0.24} ${cell*0.14} ${cell*0.08} ${cell*0.36} z`,fill:'#a49a8c',stroke:'#4a3b2a','stroke-width':2},g2);
    } else if(th.block==='brazier'){
      el('rect',{x:cx-4,y:cy-8,width:8,height:18,rx:3,fill:'#7d766c',stroke:'#4a3b2a','stroke-width':1.6},g2);
      el('circle',{cx,cy:cy-11,r:5,fill:'#ff9d5c',class:'goal-cell'},g2);
    } else if(th.block==='lavarock'){
      el('path',{d:`M${cx-cell*0.34} ${cy+cell*0.26} l${cell*0.1} ${-cell*0.36} ${cell*0.18} ${-cell*0.12} ${cell*0.26} ${cell*0.1} ${cell*0.1} ${cell*0.38} z`,fill:'#5f504c',stroke:'#2f2b28','stroke-width':2},g2);
    } else if(th.block==='cloud'){
      el('ellipse',{cx,cy,rx:cell*0.36,ry:cell*0.26,fill:'#fff',opacity:.92,stroke:'#8ec3e0','stroke-width':2},g2);
    } else {
      el('path',{d:starPath(cx,cy,cell*0.3,cell*0.12),fill:'#b5a6d6',stroke:'#3a3f63','stroke-width':2},g2);
    }
  }
  /* 墙层 / 预览层 / 棋子层 */
  const gWalls=el('g',{},gBoard);
  const gPrev=el('g',{},gBoard);
  const gPieces=el('g',{},gBoard);
  const ballXY=b=>({x:M+b.c*cell+cell/2, y:M+b.r*cell+cell/2});

  function drawWalls(){
    gWalls.innerHTML='';
    const all=[];
    g.hW.forEach(k=>{ const [,r,c]=k.split(':').map(Number); all.push({kind:'H',r,c}); });
    g.vW.forEach(k=>{ const [,r,c]=k.split(':').map(Number); all.push({kind:'V',r,c}); });
    all.forEach(w=>{
      const T=7;
      const a=w.kind==='H'
        ? {x:M+w.c*cell+3, y:M+(w.r+1)*cell-T/2, width:cell*2-6, height:T}
        : {x:M+(w.c+1)*cell-T/2, y:M+w.r*cell+3, width:T, height:cell*2-6};
      const rc=el('rect',{...a,rx:3.5,fill:th.wall,stroke:'rgba(30,22,12,.45)','stroke-width':1.2},gWalls);
      if(w.fresh){ growAnim(rc, w.kind); }
      attachCrowbar(rc,w);
    });
  }
  /* 撬棍（技能）：激活后场上任何一面墙都可以点掉 */
  function attachCrowbar(rc,w){
    if(!g.removalMode) return;
    rc.style.cursor='pointer';
    rc.addEventListener('click',ev=>{
      ev.stopPropagation();
      if(!g.removalMode) return;
      (w.kind==='H'?g.hW:g.vW).delete(K(w.kind,w.r,w.c));
      g.removalMode=false;
      SFX.play('wall');
      drawWalls(); drawMoveHints(); syncHUD();
      toast('拆掉了一面墙');
    });
  }
  function growAnim(rc,kind){
    rc.style.transformBox='fill-box'; rc.style.transformOrigin='center';
    tween(320,(e)=>{ const s=0.1+0.95*e; const ov=e>0.8?1+(1-e)*0.35:1;
      rc.style.transform=(kind==='H'?'scaleX(':'scaleY(')+(s*ov).toFixed(3)+')'; rc.style.opacity=e; },()=>{rc.style.transform='';rc.style.opacity='';});
  }
  /* WallDrag：按住格线交点 → 墙从起点跟手长出 → 满 2 格松手落墙 */
  const ANCHOR_HIT=cell*0.45;   /* 交点吸附半径 */
  const DIR_TH=cell*0.18;       /* 方向判定最小位移 */
  let drag=null;                /* {kx,ky,dir,sign,ext,full,cand,oob} */
  let pending=null;             /* 点两下放墙模式：{kx,ky}——轻点交点后进入，再点某个方向的墙影即落墙 */
  let suppressClick=false;       /* 筑墙拖拽后吞掉误发的 click，防止走子 */
  function nearestAnchor(px,py){
    const kx=Math.round((px-M)/cell), ky=Math.round((py-M)/cell);
    if(kx<0||kx>level.width||ky<0||ky>level.height) return null;
    if(Math.hypot(px-(M+kx*cell), py-(M+ky*cell))>ANCHOR_HIT) return null;
    return {kx,ky};
  }
  function dragHint(txt,bad){
    el('text',{x:VW/2,y:M/2+8,'text-anchor':'middle','font-size':bad?15:14,
      fill:bad?'#c96f5e':'#7a6f5f','font-weight':bad?700:400},gPrev).textContent=txt;
  }
  function drawDrag(){
    gPrev.innerHTML='';
    if(!drag) return;
    const T=9;
    const ax=M+drag.kx*cell, ay=M+drag.ky*cell;
    const col=(drag.full&&drag.cand&&!drag.cand.valid)?'#c96f5e':th.wall;
    el('circle',{cx:ax,cy:ay,r:cell*0.15,fill:col,class:'anchor-pulse'},gPrev);
    if(!drag.dir){ dragHint('按住交点，往要挡的方向拖出 2 格长的墙'); return; }
    const len=Math.max(.35,drag.ext)*cell*drag.sign;
    const seg=drag.dir==='H'
      ? {x:Math.min(ax,ax+len), y:ay-T/2, width:Math.abs(len), height:T}
      : {x:ax-T/2, y:Math.min(ay,ay+len), width:T, height:Math.abs(len)};
    el('rect',{...seg,rx:4,fill:col,opacity:.5},gPrev);
    const tipx=drag.dir==='H'?ax+len:ax, tipy=drag.dir==='V'?ay+len:ay;
    el('circle',{cx:tipx,cy:tipy,r:cell*0.14,fill:'#fff',stroke:col,'stroke-width':3},gPrev);
    if(drag.full&&drag.cand){
      const k=drag.cand;
      const a=k.kind==='H'
        ? {x:M+k.c*cell+3, y:M+(k.r+1)*cell-T/2, width:cell*2-6, height:T}
        : {x:M+(k.c+1)*cell-T/2, y:M+k.r*cell+3, width:T, height:cell*2-6};
      el('rect',{...a,rx:3.5,fill:k.valid?'#e6b455':'#c96f5e',opacity:k.valid?.8:.85},gPrev);
      if(!k.valid) dragHint(drag.oob?'墙要完全落在棋盘内部':wallBlockReason(g,k.kind,k.r,k.c),true);
    } else {
      dragHint('拖满 2 格后松手放墙');
    }
  }
  /* 点两下放墙：轻点交点 → 四个方向各亮一面候选墙影（合法金 / 非法红）→ 点墙影落墙 */
  function drawPending(){
    gPrev.innerHTML='';
    if(!pending) return;
    const T=9;
    const ax=M+pending.kx*cell, ay=M+pending.ky*cell;
    el('circle',{cx:ax,cy:ay,r:cell*0.15,fill:th.wall,class:'anchor-pulse'},gPrev);
    [{dir:'H',sign:1},{dir:'H',sign:-1},{dir:'V',sign:1},{dir:'V',sign:-1}].forEach(d=>{
      let r,c;
      if(d.dir==='H'){ r=pending.ky-1; c=d.sign>0?pending.kx:pending.kx-2; }
      else { c=pending.kx-1; r=d.sign>0?pending.ky:pending.ky-2; }
      const oob=r<0||r>level.height-2||c<0||c>level.width-2;
      const valid=!oob&&validWall(g,d.dir,r,c);
      const a=d.dir==='H'
        ? {x:M+c*cell+3, y:M+(r+1)*cell-T/2, width:cell*2-6, height:T}
        : {x:M+(c+1)*cell-T/2, y:M+r*cell+3, width:T, height:cell*2-6};
      const rect=el('rect',{...a,rx:4,fill:oob?'rgba(74,59,42,.2)':(valid?'#e6b455':'#c96f5e'),
        opacity:oob?.25:.82,'data-cand':'1'},gPrev);
      if(oob) return;
      rect.style.cursor='pointer';
      rect.addEventListener('pointerdown',ev=>{
        ev.stopPropagation(); ev.preventDefault();
        const who=activeColor(); if(!who) return;
        if(g.wallsLeft[who]<=0){ toast(g.twoP?'这一方的墙用完了':'墙已经用完了，这回合只能走格子'); return; }
        if(!validWall(g,d.dir,r,c)){ SFX.play('wallFail'); toast(wallBlockReason(g,d.dir,r,c)); return; }
        pending=null;
        commitWall({kind:d.dir,r,c},who);
      });
    });
    dragHint('再点一个方向的墙影落墙 · 点别处取消',false);
  }

  /* PlayerPiece / AIPiece：原点绘制 + translate 定位（追逐关里 A 不是对手而是怪物，换个造型）
     A 外面套一层 g：外层负责位移，内层负责动画（转/扑），互不打架 */
  const pr=cell*0.34;
  const pieceRef={P:null,A:null};
  pieceRef.P=PlayerPiece(gPieces,0,0,pr,currentSkin().id);
  const aWrap=el('g',{},gPieces);
  const aInner=g.mode==='chase'?MonsterPiece(aWrap,0,0,pr):AIPiece(aWrap,0,0,pr,level.aiConfig.skin);
  pieceRef.A=aWrap;
  function setPiece(color,ball){
    const p=ballXY(ball);
    pieceRef[color].setAttribute('transform','translate('+p.x+','+p.y+')');
  }
  setPiece('P',g.balls.P); setPiece('A',g.balls.A);
  function rollPiece(color,to,done){
    const node=pieceRef[color];
    const from=ballXY(g.balls[color]);
    const tx=M+to.c*cell+cell/2, ty=M+to.r*cell+cell/2;
    const dx=tx-from.x, dy=ty-from.y;
    const rot=(Math.abs(dx)>0.5?Math.sign(dx):0)*(Math.hypot(dx,dy)/(2*Math.PI*pr))*360;
    node.__rot=(node.__rot||0)+rot;
    const inner=node.querySelector('g')||node;
    tween(300,(e)=>{
      const x=from.x+dx*e, y=from.y+dy*e;
      node.setAttribute('transform','translate('+x+','+y+') rotate('+(node.__rot*e)+' '+(dx?0:0)+' '+(dy?0:0)+')');
    },()=>{
      tween(160,(e2,p)=>{
        const s=Math.sin(p*Math.PI);
        node.setAttribute('transform','translate('+tx+','+ty+') rotate('+node.__rot+') scale('+(1-0.1*s)+','+(1+0.12*s)+')');
      },()=>{ node.setAttribute('transform','translate('+tx+','+ty+') rotate('+node.__rot+')'); if(done)done(); });
    });
  }

  /* ---- ActionBar（无模式：单行手势提示） ---- */
  const actions=html('div','actions');
  const hintBox=html('div','hint');
  actions.appendChild(hintBox);
  page.appendChild(actions);
  function syncActions(){
    hintBox.innerHTML=g.twoP
      ? '轮到<b>'+(g.turn==='P'?'金球':'紫球')+'</b>：点发光的格子走球 · 放墙<b>点交点再点方向</b>，或按住拖 2 格（本方剩 <b>'+g.wallsLeft[g.turn]+'</b> 面）'
      : '点<b>发光的格子</b>走球 · 放墙<b>点格线交点再点方向</b>，或按住拖 2 格（剩 <b>'+g.wallsLeft.P+'</b> 面）';
    hintBox.style.display=g.over?'none':'';
  }

  /* 合法走位提示（按当前操作方画） */
  let hintCells=[];
  function drawMoveHints(){
    hintCells.forEach(h=>h.remove()); hintCells=[];
    const who=activeColor(); if(!who) return;
    legalMoves(g,who).forEach(m=>{
      const x=M+m.c*cell+cell/2, y=M+m.r*cell+cell/2;
      const c=el('circle',{cx:x,cy:y,r:cell*0.14,fill:'#e6b455',class:'move-hint',stroke:'rgba(74,59,42,.35)','stroke-width':1.5},svg);
      c.addEventListener('click',ev=>{ ev.stopPropagation(); onCellTap(m.r,m.c); });
      hintCells.push(c);
    });
  }

  /* ---- HUD 状态 ---- */
  const t0=Date.now();
  /* 当前可操作的一方：单人模式永远是玩家；双人同屏轮到谁就是谁 */
  function activeColor(){
    if(g.over||busy) return null;
    return g.twoP ? g.turn : (g.turn==='P'?'P':null);
  }
  function sideGoalTxt(color){
    const cells=g.goals[color]||[];
    if(!cells.length) return '—';
    const side=cells[0].r===0?'顶边':'底边';
    return cells.length===level.width?side:(side+'的门');
  }
  function syncHUD(){
    pillRound.innerHTML='回合 <b>'+g.round+'</b>';
    pillTime.innerHTML='用时 <b>'+fmtTime((Date.now()-t0)/1000)+'</b>';
    pillWall.innerHTML=g.twoP
      ? '墙 金<b>'+g.wallsLeft.P+'</b> 紫<b>'+g.wallsLeft.A+'</b>'
      : '我的墙 <b>'+g.wallsLeft.P+'</b>';
    pillGoal.innerHTML=g.twoP
      ? '金球→'+sideGoalTxt('P')+' · 紫球→'+sideGoalTxt('A')
      : '目标 <b>'+goalText(level)+'</b>';
    if(pillTurn){
      pillTurn.innerHTML=g.over?'对局结束':('轮到 <b>'+(g.turn==='P'?'金球':'紫球')+'</b>');
      pillTurn.style.background=g.turn==='P'?'#fff6dd':'#EEEDFE';
      pillTurn.style.borderColor=g.turn==='P'?'rgba(201,154,46,.55)':'rgba(83,74,183,.45)';
    }
    if(pillChase){
      const d=pathLen(g,g.balls.A,g.balls.P).dist;
      pillChase.innerHTML=d?'怪物 <b>'+d+'</b> 格外':'怪物贴上了你';
    }
    if(pillEvent){
      const ev=level.events[0], left=ev.every-(g.round%ev.every);
      const nm={shrink:'岩浆',shiftGate:'门漂移',phase:'换阶段'}[ev.type]||'事件';
      pillEvent.innerHTML=nm+' <b>'+left+' 回合后</b>';
    }
    orbP.classList.toggle('on',g.turn==='P'&&!g.over);
    orbA.classList.toggle('on',g.turn==='A'&&!g.over);
    drawSkillOverlay();
  }
  /* ---- 技能卡 ---- */
  function openSkillPanel(){
    if(g.over) return;
    const {scrim,panel,close}=overlayPanel();
    panel.appendChild(html('h2','','用一张技能卡'));
    panel.appendChild(html('div','narr',g.skill
      ? ('本关已经用过「'+SKILLS[g.skill].name+'」了——每关只能带一张。')
      : '每关最多用一张，选中立刻生效，本关内持续有效。'));
    const list=html('div','skill-list');
    const chNow=skillChUnlocked();
    Object.keys(SKILLS).forEach(k=>{
      const s=SKILLS[k];
      const locked=s.ch&&chNow<s.ch;
      const card=html('button','skill-card'+(locked?' dim locked':(g.skill===k?' used':(g.skill?' dim':''))));
      card.innerHTML='<span class="sk-mark">'+s.mark+'</span><b>'+s.name+'</b><small>'
        +(locked?('第 '+s.ch+' 章解锁（你目前在第 '+chNow+' 章）'):s.desc)+'</small>';
      card.disabled=!!g.skill||locked;
      card.onclick=()=>{ useSkill(k); close(); };
      list.appendChild(card);
    });
    panel.appendChild(list);
    const row=html('div','row');
    const no=html('button','btn ghost',g.skill?'知道了':'先不用');
    no.onclick=close;
    row.appendChild(no);
    panel.appendChild(row);
  }
  function useSkill(k){
    if(g.skill||g.over) return;
    const s=SKILLS[k];
    if(!s) return;
    if(s.ch&&skillChUnlocked()<s.ch) return;       /* 未解锁的卡不能用 */
    g.skill=k;
    SFX.play('skill');
    const msg=s.apply?s.apply(g):('本关生效：'+s.name);
    if(k==='crowbar') drawWalls();                 /* 撬棍：重画墙层，让每面墙可点 */
    if(skillBtn){ skillBtn.textContent='已用 · '+s.name; skillBtn.classList.remove('warn'); }
    toast(msg);
    syncHUD();
  }
  clearInterval(gameTimer);
  gameTimer=setInterval(syncHUD,500);
  syncHUD();

  /* ---- 回合流转（表现层不暴露 AI 决策过程） ---- */
  let busy=false;
  const stats={rounds:0, walls:0};
  /* 二连走（技能）：从 me 出发直线 2 格，两段路都必须通畅，落点/中途不能站着别人 */
  function dashTargetOk(who,r,c){
    const me=g.balls[who], other=g.balls[who==='P'?'A':'P'];
    if(!((Math.abs(me.r-r)===2&&me.c===c)||(Math.abs(me.c-c)===2&&me.r===r))) return false;
    const mr=(me.r+r)/2, mc=(me.c+c)/2;
    if(isBlockedCell(g,mr,mc)||isBlockedCell(g,r,c)) return false;
    if(other.r===r&&other.c===c) return false;
    if(other.r===mr&&other.c===mc) return false;
    if(edgeBlocked(g,me,{r:mr,c:mc})||edgeBlocked(g,{r:mr,c:mc},{r,c})) return false;
    return true;
  }
  function onCellTap(r,c){
    pending=null; drawDrag();
    const who=activeColor(); if(!who) return;
    const me=g.balls[who];
    /* 二连走：蓄力后的一次走子可以直走 2 格（用掉蓄力，正常结算机关） */
    if(g.dashArmed&&who==='P'&&dashTargetOk(who,r,c)){
      g.dashArmed=false; busy=true;
      hintCells.forEach(h=>h.remove()); hintCells=[];
      applyMove(who,{r,c},()=>afterAct(),true);
      return;
    }
    if(g.dashArmed&&who==='P'&&Math.abs(me.r-r)+Math.abs(me.c-c)===2){
      toast('二连走只能沿直线走 2 格，且路径上不能有墙和障碍'); return;
    }
    if(Math.abs(me.r-r)+Math.abs(me.c-c)!==1) return;
    if(edgeBlocked(g,me,{r,c})||isBlockedCell(g,r,c)) return;
    const other=g.balls[who==='P'?'A':'P'];
    if(other.r===r&&other.c===c){ toast(g.twoP?'那一格被另一方占着':'对方正守在那里'); return; }
    busy=true;
    hintCells.forEach(h=>h.remove()); hintCells=[];
    applyMove(who,{r,c},()=>afterAct(),true);
  }
  /* 走一步 → 落地 → 结算机关（传送/加速/弹簧/陷阱）→ 判定胜负与交还回合。
     机关带来的位移算同一步，不多计回合。 */
  function applyMove(who,to,after,countRound){
    const from={r:g.balls[who].r,c:g.balls[who].c};
    SFX.play(g.twoP||who==='P'?'step':'aiStep');
    rollPiece(who,to,()=>{
      g.balls[who]={r:to.r,c:to.c};
      const res=resolveSpecial(g,who,from,to);
      const displaced=(res.r!==to.r||res.c!==to.c);
      const settle=()=>{
        if(res.kind==='trap') g.wallsLeft[who]=Math.max(0,g.wallsLeft[who]-2);
        else if(res.kind==='pickup') g.wallsLeft[who]+=1;
        specialFx(res,who);
        if(countRound) stats.rounds++;
        syncHUD();
        if(reachedGoal(g,who)){ finishGame(who); return; }
        after();
      };
      if(displaced) rollPiece(who,{r:res.r,c:res.c},()=>{ g.balls[who]={r:res.r,c:res.c}; settle(); });
      else settle();
    });
  }
  function specialFx(res,who){
    if(!res||!res.kind) return;
    if(res.kind==='portal'){ SFX.play('portal'); toast('传送门：直接穿到了对面'); }
    else if(res.kind==='boost'){ SFX.play('boost'); toast('加速带：顺势多滑了一格'); }
    else if(res.kind==='spring'){ SFX.play('spring'); toast('弹簧：被弹出去两格'); }
    else if(res.kind==='trap'){ SFX.play('trap'); toast(who==='P'?'踩到陷阱，丢了 2 面墙':'对手踩到陷阱，它丢了 2 面墙'); }
    else if(res.kind==='pickup'){ SFX.play('portal'); toast(who==='P'?'拾获拆墙器，多 1 面墙':'对手拾获拆墙器，多 1 面墙'); }
  }
  /* 走完/放完墙之后：单人交给 AI，双人换手 */
  function afterAct(){ if(g.twoP) handTurnBack(); else aiTurn(); }
  function finishGame(color){
    if(g.twoP){ duelWin(color); return; }
    if(color==='P') playerWin(); else playerFail();
  }
  /* AI 行动（决策与表现分离：只保留短暂过渡，不暴露任何思考过程） */
  function aiTurn(){
    g.turn='A'; syncHUD();
    if(g.mode==='chase') return chaseTurn();
    setTimeout(()=>{
      if(g.over) return;
      if(!hasOptions(g,'A')){ toast('对手被彻底困住，跳过一回合'); return handTurnBack(); }
      const act=AI.decide(g,level);
      if(!act) return handTurnBack();
      if(act.type==='move'){
        applyMove('A',act.to,()=>handTurnBack(),false);
      } else {
        placeWall(g,'A',act.kind,act.r,act.c);
        drawWallsWith({...act,fresh:true});
        setTimeout(handTurnBack,340);
      }
    },420);
  }
  /* 追逐关：怪物与你同速（每回合 1 格）。抓捕规则 = 象棋"将军"：
     你一回合结束时若与怪物贴身，它直接扑上——被它贴住就必须立刻甩开，
     被逼到墙角再甩不开就输了。墙是唯一能打断它拦截路线的手段。 */
  function chaseTurn(){
    const steps=level.chaseSteps||1;
    let done=0;
    const manhattan=()=>Math.abs(g.balls.A.r-g.balls.P.r)+Math.abs(g.balls.A.c-g.balls.P.c);
    const stepOnce=()=>{
      if(g.over) return;
      if(manhattan()<=1){ caught(); return; }        /* 回合结束还贴身 → 扑上 */
      if(done>=steps) return handTurnBack();
      const act=AI.decide(g,level);
      if(!act) return handTurnBack();
      done++;
      applyMove('A',act.to,()=>{
        if(g.balls.A.r===g.balls.P.r&&g.balls.A.c===g.balls.P.c){ caught(); return; }
        setTimeout(stepOnce,140);
      },false);
    };
    setTimeout(stepOnce,420);
  }
  function caught(){
    g.over='A'; busy=true;
    clearInterval(gameTimer);
    /* 扑击一下：内层放大再收回 */
    aInner.style.transformBox='fill-box'; aInner.style.transformOrigin='center';
    tween(420,(e)=>{ aInner.style.transform='scale('+(1+0.55*Math.sin(e*Math.PI)).toFixed(3)+')'; },()=>{ aInner.style.transform=''; });
    syncHUD(); drawMoveHints(); syncActions();
    if(!level.custom) Stats.record(level.id,{win:false,rounds:stats.rounds,walls:stats.walls,skill:g.skill});
    setTimeout(()=>FailurePanel(level,'它贴上来了。记住：它和你一样快，但会抢到你的必经之路——发现它堵路，就用墙把它的路线顶开，别被逼进墙角。','caught'),900);
  }
  /* 回合事件：改完状态要重画棋盘与终点 */
  function runEvents(){
    const fired=tickEvents(g,level);
    if(!fired.length) return;
    fired.forEach(f=>{
      if(f.type==='shrink'){ SFX.play('lava'); redrawBlocks(); toast('岩浆涌上来了：两侧各塌了一列'); }
      else if(f.type==='shiftGate'){ SFX.play('gate'); redrawGoals(); toast('门换位置了'); }
      else if(f.type==='rain'){ SFX.play('rain'); redrawBlocks(); toast('头顶落石：盘上多了几块障碍'); }
      else if(f.type==='phase'){ SFX.play('phase'); toast('对手换了打法：'+((PERSONAS[f.persona]||{}).name||'')); }
    });
    syncHUD();
  }
  /* 交还操作权：单人模式交回玩家；双人同屏换给另一方（两人各走一手算一回合） */
  function handTurnBack(){
    if(g.twoP){
      g.turn = g.turn==='P' ? 'A' : 'P';
      if(g.turn==='P'){ g.round++; runEvents(); }
      if(!hasRealOptions(g,'P')&&!hasRealOptions(g,'A')){ stalemate(); return; }
      /* 轮到的一方若被彻底围死（走不了也没墙可放），跳过他的这一手 */
      if(!hasRealOptions(g,g.turn)){
        g.turn = g.turn==='P' ? 'A' : 'P';
        if(g.turn==='P'){ g.round++; runEvents(); }
        toast('这一方被彻底困住，跳过一手');
      }
      busy=false;
      drawMoveHints(); syncHUD(); syncActions();
      return;
    }
    g.turn='P'; g.round++;
    runEvents();
    if(!hasRealOptions(g,'P')&&!hasRealOptions(g,'A')){ stalemate(); return; }
    if(!hasOptions(g,'P')){ toast('你被彻底困住，这一回合跳过'); return aiTurn(); }
    busy=false;
    drawMoveHints(); syncHUD(); syncActions();
  }
  function stalemate(){
    g.over='draw'; busy=true;
    clearInterval(gameTimer);
    if(!level.custom) Stats.record(level.id,{win:false,rounds:stats.rounds,walls:stats.walls,skill:g.skill});
    setTimeout(()=>FailurePanel(level,'两条路都被彼此封死了，谁也到不了对岸。雾里没有输家，再走一次吧。','stalemate'),500);
  }
  function drawWallsWith(w){
    /* 把 fresh 标记传给 drawWalls 的最后一块 */
    const temp=K(w.kind,w.r,w.c);
    const all=[];
    g.hW.forEach(k=>{ const [,r,c]=k.split(':').map(Number); all.push({kind:'H',r,c,fresh:k===temp&&w.fresh}); });
    g.vW.forEach(k=>{ const [,r,c]=k.split(':').map(Number); all.push({kind:'V',r,c,fresh:k===temp&&w.fresh}); });
    gWalls.innerHTML='';
    all.forEach(x=>{
      const T=7;
      const a=x.kind==='H'
        ? {x:M+x.c*cell+3, y:M+(x.r+1)*cell-T/2, width:cell*2-6, height:T}
        : {x:M+(x.c+1)*cell-T/2, y:M+x.r*cell+3, width:T, height:cell*2-6};
      const rc=el('rect',{...a,rx:3.5,fill:th.wall,stroke:'rgba(30,22,12,.45)','stroke-width':1.2},gWalls);
      if(x.fresh) growAnim(rc,x.kind);
      attachCrowbar(rc,x);
    });
  }
  drawWalls();
  drawMoveHints(); syncActions();

  /* 第一次遇到「新机制」时先讲规则（每关一个 key，看过就不再打扰）；Boss 关单独出一张 Boss 卡；
     都没有新东西要讲时，第一次进双人再补一张双人规则卡 */
  if(level.isBoss){
    const k='boss:'+level.id;
    if(!Intro.has(k)) Intro.showBoss(level,k);
  } else {
    const k=introKindOf(level);
    if(k&&!Intro.has(k)) Intro.show(level,k);
    else if(g.twoP&&!Intro.has('duel')) Intro.showDuel();
  }

  /* ---- 墙交互（pointer 预览 + 点击/松手确认） ---- */
  function svgXY(ev){
    const b=svg.getBoundingClientRect();
    return { x:(ev.clientX-b.left)*(VW/b.width), y:(ev.clientY-b.top)*(VH/b.height) };
  }
  svg.addEventListener('pointermove',ev=>{
    if(!drag) return;
    const p=svgXY(ev);
    if(!drag.dir){
      const dx=p.x-(M+drag.kx*cell), dy=p.y-(M+drag.ky*cell);
      if(Math.hypot(dx,dy)<DIR_TH) return;
      drag.dir=Math.abs(dx)>=Math.abs(dy)?'H':'V';
    }
    const d=drag.dir==='H'?(p.x-M)/cell-drag.kx:(p.y-M)/cell-drag.ky;
    drag.sign=d>=0?1:-1;
    drag.ext=Math.min(2,Math.abs(d));
    drag.full=drag.ext>=1.6;
    drag.cand=null; drag.oob=false;
    if(drag.full){
      let kind,r,c;
      if(drag.dir==='H'){ kind='H'; r=drag.ky-1; c=drag.sign>0?drag.kx:drag.kx-2; }
      else { kind='V'; c=drag.kx-1; r=drag.sign>0?drag.ky:drag.ky-2; }
      drag.oob=r<0||r>level.height-2||c<0||c>level.width-2;
      drag.cand={kind,r,c,valid:!drag.oob&&validWall(g,kind,r,c)};
    }
    drawDrag();
  });
  svg.addEventListener('pointerdown',ev=>{
    suppressClick=false;
    const who=activeColor(); if(!who) return;
    if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-cand')) return;   /* 候选墙影自己处理 */
    const p=svgXY(ev);
    const a=nearestAnchor(p.x,p.y);
    if(pending){
      const same=a&&a.kx===pending.kx&&a.ky===pending.ky;
      pending=null; drawDrag();
      if(same) return;                     /* 再点同一个交点 = 取消；点别处 = 取消后照常走流程 */
    }
    if(!a) return;
    if(g.wallsLeft[who]<=0){ toast(g.twoP?'这一方的墙用完了，只能走格子':'墙已经用完了，这回合只能走格子'); return; }
    drag={...a,color:who,dir:null,sign:1,ext:0,full:false,cand:null,oob:false};
    suppressClick=true;
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
    drawDrag();
  });
  /* 拖墙结束后的 click 不应触发走子：捕获阶段吞掉 */
  svg.addEventListener('click',ev=>{ if(suppressClick){ ev.stopPropagation(); suppressClick=false; } },true);
  function finishDrag(commit){
    if(!drag){ return; }
    const d=drag; drag=null;
    if(commit&&!d.dir){                    /* 原地轻点（没拖出方向）→ 进入点两下放墙模式 */
      pending={kx:d.kx,ky:d.ky};
      drawPending();
      return;
    }
    setTimeout(()=>{ suppressClick=false; },300);   /* 兜底复位：个别环境拖后不发 click */
    let placed=false;
    if(commit&&d.cand&&d.cand.valid){ commitWall(d.cand,d.color); placed=true; }
    else if(commit){
      if(d.cand&&!d.cand.valid) toast(d.oob?'墙要完全落在棋盘内部':'不能落在这里：会重叠/相交，或把球锁死');
      else if(d.dir&&!d.full) toast('墙长固定为 2 格：再拖远一点');
    }
    if(!placed) drawDrag();
  }
  svg.addEventListener('pointerup',()=>finishDrag(true));
  svg.addEventListener('pointercancel',()=>finishDrag(false));
  function commitWall(slot,color){
    busy=true;
    placeWall(g,color||'P',slot.kind,slot.r,slot.c);
    stats.walls++;
    drawWallsWith({...slot,fresh:true});
    drawDrag();
    setTimeout(()=>{ if(reachedGoal(g,color||'P')){ finishGame(color||'P'); return; } afterAct(); },260);
  }

  /* ---- 胜利 / 失败 ---- */
  function sparkle(){
    /* 星星撒在玩家实际抵达的那一格（胜利条件是整条边线，可能是任意一格） */
    const arrived=[{r:g.balls.P.r,c:g.balls.P.c}];
    arrived.forEach(gl=>{
      const cx=M+gl.c*cell+cell/2, cy=M+gl.r*cell+cell/2;
      for(let i=0;i<7;i++){
        const st=el('path',{d:starPath(cx+(i-3)*14,cy,5,2.2),fill:'#e6b455',opacity:0},svg);
        tween(700+i*90,(e,p)=>{ st.setAttribute('transform','translate(0 '+(-40*p)+')'); st.setAttribute('opacity',String(Math.sin(p*Math.PI))); },()=>st.remove());
      }
    });
  }
  function playerWin(){
    g.over='P'; busy=true;
    clearInterval(gameTimer);
    SFX.play('win');
    sparkle(); syncHUD(); syncActions(); drawMoveHints();
    const time=(Date.now()-t0)/1000;
    /* 自定义关不进主线存档与难度统计（不污染进度、星级与热力图） */
    const stars=computeStars(level,{rounds:stats.rounds,walls:stats.walls,time});
    let isNew=false;
    if(level.custom){ window.__justWon=null; }
    else {
      isNew=Save.record(level.id,{stars,rounds:stats.rounds,walls:stats.walls,time:Math.round(time)});
      Stats.record(level.id,{win:true,rounds:stats.rounds,walls:stats.walls,skill:g.skill});
      if(!g.skill) Flags.bump('noSkillWins');            /* 「只靠自己」要用的累计数 */
      window.__justWon=level.id;
    }
    setTimeout(()=>VictoryPanel(level,{rounds:stats.rounds,walls:stats.walls,time,stars,skill:g.skill},isNew),780);
  }
  function playerFail(){
    g.over='A'; busy=true;
    clearInterval(gameTimer);
    syncHUD(); drawMoveHints(); syncActions();
    if(!level.custom) Stats.record(level.id,{win:false,rounds:stats.rounds,walls:stats.walls,skill:g.skill});
    setTimeout(()=>FailurePanel(level,null,'ai'),650);
  }
  /* 双人同屏：金球与紫球谁先到对岸谁赢；战绩存在本地（不进单人存档，不污染星级） */
  function duelWin(color){
    g.over=color; busy=true;
    clearInterval(gameTimer);
    SFX.play('win');
    syncHUD(); drawMoveHints(); syncActions();
    const time=(Date.now()-t0)/1000;
    const score=Duel.add(color);
    Flags.bump('duelPlays');                              /* 「棋逢对手 / 双人宿敌」要用的累计数 */
    setTimeout(()=>DuelPanel(level,color,{rounds:stats.rounds,walls:stats.walls,time,score,first:firstMover}),720);
  }
  function renderGameFresh(){
    clearInterval(gameTimer);
    root.innerHTML='';
    renderGame(root,levelId);
  }
}
/* 双人同屏战绩（本地） */
const Duel={
  key:'dreamquest.duel.v1',
  get(){ try{ return JSON.parse(localStorage.getItem(this.key)||'{"P":0,"A":0}'); }catch(e){ return {P:0,A:0}; } },
  add(color){ const s=this.get(); s[color]=(s[color]||0)+1; try{ localStorage.setItem(this.key,JSON.stringify(s)); }catch(e){} return s; }
};

/* VictoryPanel / FailurePanel / StarRating */
function StarRating(stars,cls){
  SFX.play('star');
  const box=html('div',cls||'starline');
  for(let i=0;i<3;i++){
    const s=document.createElementNS(NS,'svg');
    s.setAttribute('width','30'); s.setAttribute('height','30'); s.setAttribute('viewBox','0 0 30 30');
    const on=i<stars;
    s.innerHTML='<path d="'+starPath(15,16,13,5.4)+'" fill="'+(on?'#e6b455':'#dcd6c6')+'" stroke="'+(on?'#b07a1f':'rgba(74,59,42,.3)')+'" stroke-width="1.6"/>';
    s.classList.add('star-pop'); s.style.animationDelay=(i*0.16)+'s';
    box.appendChild(s);
  }
  return box;
}
function overlayPanel(){
  /* 同时只允许一层弹层：开新的就把残留的收掉（否则切关/切页会叠一堆面板） */
  document.querySelectorAll('.scrim').forEach(s=>s.remove());
  const scrim=html('div','scrim');
  const panel=html('div','paper panel');
  scrim.appendChild(panel); document.body.appendChild(scrim);
  requestAnimationFrame(()=>scrim.classList.add('show'));
  scrim.addEventListener('click',e=>{ if(e.target===scrim&&scrim.dataset.closable) close(); });
  function close(){ scrim.classList.remove('show'); setTimeout(()=>scrim.remove(),320); }
  return {scrim,panel,close};
}
function VictoryPanel(level,stats,isNew){
  if(level.daily) return DailyResultPanel(level,stats,true);

  if(stats.skill&&SKILLS[stats.skill]){
    panel.appendChild(html('div','narr','（本关用了技能卡：'+SKILLS[stats.skill].name+'）'));
  }
  panel.appendChild(StarRating(stats.stars));
  const grid=html('div','stats-grid');
  [['回合数',stats.rounds],['筑墙',stats.walls+' 面'],['用时',fmtTime(stats.time)]].forEach(([k,v])=>{
    const d=html('div','stat'); d.innerHTML='<small>'+k+'</small><b>'+v+'</b>'; grid.appendChild(d);
  });
  panel.appendChild(grid);

    const blk=achievementBlock(Achievements.refresh());
    if(blk) panel.appendChild(blk);
  }
  const row=html('div','row');
  const nextId=level.id<LEVELS.length?level.id+1:null;
  const again=html('button','btn green','再次挑战');
  const home=html('button','btn'+(nextId?' ghost':' primary'),'回到主界面');
  again.onclick=()=>{ close(); reroute('#/play/'+level.id); };

    row.appendChild(next);

  }
}
